      out+='<div style="margin-bottom:12px"><span class="eyebrow">Stage '+G.n+' · '+G.en+' · Level '+lv+'</span>'+us.map(function(u){
        var c=unitCounts(u);
        return '<div class="ul"><div style="min-width:0"><p class="ar">'+esc(u.titleAr||u.titleEn)+'</p><span class="muted" style="font-size:13px">Unit '+u.order+' · '+esc(u.titleEn||'')+' · '+c.rules+' lessons, '+c.words+' words</span></div>'+
          '<div class="row" style="flex:none"><button class="btn ghost sm" type="button" data-act="edit" data-id="'+u.id+'">Edit</button>'+(inStore(u.id)?'<button class="btn ghost sm" type="button" data-act="del" data-id="'+u.id+'">'+(isSeed(u.id)?'Reset':'Delete')+'</button>':'')+'</div></div>'}).join('')+'</div>';
    }
  });
  return out;
}
function numOpts(max,cur){var o='';for(var i=1;i<=max;i++)o+='<option value="'+i+'"'+(i===cur?' selected':'')+'>'+i+'</option>';return o}
function viewStudio(){
  var st=S.studio,sg=st.sg||1,lv=st.lv||1,un=st.un||1;
  var nextFree=function(g,l){var used=allUnits().filter(function(u){return u.stage===g&&u.level===l}).map(function(u){return u.order});for(var i=1;i<=UN_N;i++)if(used.indexOf(i)<0)return i;return 1};
  if(!st.un)un=nextFree(sg,lv);
  V.innerHTML='<h1 style="font-size:30px;margin:10px 0 4px">Studio</h1><p class="muted">Paste your lesson text, check the preview, then save. Students see it straight away.</p>'+
    (S.db?'':'<div class="note warn">Shared storage is not available in this view, so units are saved on this device only.</div>')+
    '<div class="studio"><div><div class="card"><h2 style="font-size:22px">Add or change a unit</h2>'+
    '<p class="muted">Use the format below, or paste plain notes and press Organise with Claude. If your text has no STAGE, LEVEL or UNIT line, these three choices are used.</p>'+
    '<div class="tools" style="margin-top:0"><label>Stage <select class="field" id="sSg">'+STAGES.map(function(G){return '<option value="'+G.n+'"'+(G.n===sg?' selected':'')+'>'+G.n+' · '+G.en+'</option>'}).join('')+'</select></label>'+
    '<label>Level <select class="field" id="sLv">'+numOpts(LV_N,lv)+'</select></label>'+
    '<label>Unit <select class="field" id="sUn">'+numOpts(UN_N,un)+'</select></label></div>'+
    '<textarea class="paste" id="paste" spellcheck="false" placeholder="Paste your lesson text here" aria-label="Lesson text">'+esc(st.text)+'</textarea>'+
    '<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="check">Check my text</button>'+(S.say?'<button class="btn ghost" type="button" data-act="organise" id="orgBtn">Organise with Claude</button>':'')+
    '<button class="btn ghost" type="button" data-act="clear">Clear</button></div><p class="muted" id="sStatus" style="margin:10px 0 0"></p><div id="sPrev"></div></div></div>'+
    '<div><div class="card"><h2 style="font-size:22px">Your course</h2><div style="margin-top:8px">'+courseList()+'</div>'+
    (allUnits().length&&S.dl?'<button class="btn ghost sm" type="button" data-act="export">Download all as text</button>':'')+'</div>'+
    '<div class="card" style="margin-top:18px"><h2 style="font-size:20px">Format guide</h2><p class="muted">One line per item. Separate parts with a bar.</p><pre class="tpl">'+esc(TEMPLATE)+'</pre><div class="row" style="margin-top:10px"><button class="btn ghost sm" type="button" data-act="copyfmt">Copy guide</button><button class="btn ghost sm" type="button" data-act="usefmt">Put in editor</button></div>'+
    '<p class="muted" style="margin:12px 0 0;font-size:13px">Write the answers on Q lines in Arabic, with harakat, so students choose between Arabic options. The type at the end of a WORD line is optional (noun, verb, adjective, pronoun, particle, preposition or adverb). There are 3 stages (1 Beginner, 2 Intermediate, 3 Advanced), each with 10 levels, and each level has 10 units. Unit 1 of every level is its Introduction, so the lessons themselves start at unit 2. The STAGE, LEVEL and UNIT lines say where the unit goes. Paste several units at once by starting each with its own STAGE line.</p></div></div></div>';
  $('#paste').oninput=function(){st.text=this.value};
  var refill=function(){st.un=nextFree(st.sg,st.lv);$('#sUn').innerHTML=numOpts(UN_N,st.un)};
  $('#sSg').onchange=function(){st.sg=+this.value;refill()};
  $('#sLv').onchange=function(){st.lv=+this.value;refill()};
  $('#sUn').onchange=function(){st.un=+this.value};
  st.sg=sg;st.lv=lv;st.un=un;paintPreview();
}
function saveUnit(u){
  u.updated=Date.now();
  var p=S.db?S.db.collection('units').doc(u.id).set(u):Promise.resolve();
  return p.then(function(){var i=-1;S.units.forEach(function(x,k){if(x.id===u.id)i=k});if(i<0)S.units.push(u);else S.units[i]=u;lsSet('arabingo.units.v2',S.units)});
}
ACT.check=function(){
  var st=S.studio,t=($('#paste').value||'').trim();
  if(!t){toast('Paste your lesson text first.');return}
  st.text=$('#paste').value;st.prev=parseAll(t,st.sg||1,st.lv||1,st.un||1);paintPreview();
};
ACT.clear=function(){var st=S.studio;st.text='';st.prev=null;$('#paste').value='';paintPreview();$('#sStatus').textContent=''};
ACT.usefmt=function(){var st=S.studio;st.text=TEMPLATE;$('#paste').value=TEMPLATE;st.prev=null;paintPreview()};
ACT.copyfmt=function(){copyText(TEMPLATE,function(ok){toast(ok?'Format guide copied.':'Copy was blocked here. Select the guide text and copy it.')})};
ACT.save=function(){
  var st=S.studio,list=(st.prev||[]).filter(function(r){return (r.unit.rules.length||r.unit.words.length)&&!r.unit.bad}).map(function(r){return r.unit});
  if(!list.length)return;
  var chain=Promise.resolve();
  list.forEach(function(u){chain=chain.then(function(){return saveUnit(u)})});
  chain.then(function(){toast('Saved '+list.length+(list.length===1?' unit.':' units.'));st.text='';st.prev=null;st.un=0;render()})
    .catch(function(e){toast('Could not save'+(e&&e.code?' ('+e.code+')':'')+'. Check that you can edit this page.')});
};
ACT.edit=function(b){
  var u=allUnits().filter(function(x){return x.id===b.dataset.id})[0];if(!u)return;
  var st=S.studio;st.text=unitToText(u);st.prev=null;st.sg=u.stage;st.lv=u.level;st.un=u.order;render(true);
  toast('Loaded into the editor. Make your changes, press Check my text, then Save.');
};
ACT.del=function(b){
  var id=b.dataset.id,u=S.units.filter(function(x){return x.id===id})[0];if(!u)return;
  confirmBox('Delete this unit?',ulabel(u)+(u.titleEn?' ('+u.titleEn+')':'')+(isSeed(id)?' goes back to the built-in lesson for every student.':' will be removed for every student. This cannot be undone.'),'Delete unit',function(){
    var p=S.db?S.db.collection('units').doc(id).delete():Promise.resolve();
    p.then(function(){S.units=S.units.filter(function(x){return x.id!==id});lsSet('arabingo.units.v2',S.units);toast('Unit deleted.');render()})
     .catch(function(){toast('Could not delete that unit.')});
  });
};
ACT.export=function(){
  var t=allUnits().map(unitToText).join('\n');
  S.dl.save({filename:'arabingo-course.txt',data:t}).catch(function(e){if(e&&e.code!=='declined')toast('Download is not available here.')});
};
ACT.organise=function(){
  var st=S.studio,raw=($('#paste').value||'').trim(),stat=$('#sStatus'),btn=$('#orgBtn');
  if(!raw){toast('Paste your raw notes first.');return}
  if(st.busy){if(st.ctl)st.ctl.abort();return}
  st.busy=true;st.ctl=new AbortController();btn.textContent='Stop';stat.textContent='Claude is organising your text…';
  var prompt='You are formatting lesson material for an Arabic course. Rewrite the TEXT below in exactly the line format shown under FORMAT. Keep every Arabic word and its harakat exactly as written. Do not invent grammar rules or Arabic that the text does not support. Split the teaching into LESSON blocks with a short explanation under each LESSON line, and place each example under the lesson it illustrates as EX lines. Collect vocabulary as WORD lines (singular | plural | meaning, leaving the plural empty if it is not given). Write 4 to 8 Q lines (a question, the correct answer, then two or three wrong answers) based only on the material. Use STAGE: '+(st.sg||1)+', LEVEL: '+(st.lv||1)+' and UNIT: '+(st.un||1)+' unless the text says otherwise. Reply with the formatted text only, with no commentary and no code fences.\n\nFORMAT:\n'+TEMPLATE+'\n\nTEXT:\n'+raw;
  S.say(prompt,{signal:st.ctl.signal,onText:function(o){stat.textContent='Claude is organising your text… '+o.text.length+' characters so far'}}).then(function(r){
    var t=r.text.replace(/^\s*```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
    st.busy=false;st.text=t;$('#paste').value=t;stat.textContent=r.truncated?'The answer was cut short. Try a smaller piece of text.':'';btn.textContent='Organise with Claude';
    ACT.check();toast('Organised. Check the preview before you save.');
  }).catch(function(e){
    st.busy=false;btn.textContent='Organise with Claude';var c=e&&e.code;
    stat.textContent=c==='cancelled'?'Stopped.':c==='not_granted'?'Claude was not allowed to run for this page.':c==='rate_limited'?'Too many requests right now. Try again in a minute.':'Claude could not organise that text. Try again, or use the format guide.';
  });
};

/* ---------- events + boot ---------- */
V.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||!ACT[b.dataset.act])return;
  if(b.tagName==='A')e.preventDefault();
  ACT[b.dataset.act](b);
});
V.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('g[role=button][data-act]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(ACT[g.dataset.act])ACT[g.dataset.act](g);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('data-act')==='fcflip'){e.preventDefault();ACT.fcflip()}
});
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
$('#themeBtn').onclick=function(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);lsSet('arabingo.theme',n)};
var savedTheme=lsGet('arabingo.theme',null);if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
window.addEventListener('hashchange',function(){S.fc=null;render(true)});

function setUnits(list){
  S.units=list.filter(function(u){return u&&u.rules&&u.words&&u.qs&&u.level&&u.order}).map(function(u){if(!u.stage){u.stage=u.level;u.level=1}u.id=u.stage+'-'+u.level+'-'+u.order;return u});
  lsSet('arabingo.units.v2',S.units);
}
function mergeProgress(remote){
  if(!remote)return;
  var p=S.prog;p.xp=Math.max(p.xp||0,remote.xp||0);
  if((remote.last||'')>(p.last||'')){p.last=remote.last;p.streak=remote.streak||0}
  var d=remote.done||{};Object.keys(d).forEach(function(k){if(!p.done[k]||(d[k].score||0)>p.done[k].score)p.done[k]=d[k]});
}
function boot(){
  S.units=lsGet('arabingo.units.v2',[]);
  var hasRt=!!(window.claude&&window.claude.use);
  S.loading=hasRt&&!S.units.length;
  
  render();
  if(!hasRt)return;
  var C=window.claude;
  Promise.all([C.use('user'),C.use('db'),C.use('sample'),C.use('downloads')]).then(function(r){
    var user=r[0];S.say=r[2];S.dl=r[3];S.db=r[1];
    var p=user?Promise.all([user.canEdit(),user.id()]):Promise.resolve([false,null]);
    return p.then(function(x){
      S.canTeach=false;S.uid=x[1];S.teacher=false;
      if(!S.canTeach){S.say=null;S.dl=null}
      if(!S.db)S.loading=false;
      render();
      if(!S.db)return;
      S.db.collection('units').onSnapshot(function(snap){
        var first=S.loading;S.loading=false;
        setUnits(snap.docs.map(function(d){return d.data()}));
        var typing=document.activeElement&&document.activeElement.id==='paste';
        if(first||(routeName()!=='unit'&&!typing))render();
      },function(){S.loading=false;render()});
      if(S.uid){
        S.db.collection('data/users/'+S.uid).doc('progress2').get().then(function(d){
          if(d.exists){mergeProgress(d.data());lsSet('arabingo.progress.v2',S.prog);paintChips();if(routeName()==='home')render()}
        }).catch(function(){});
      }
    });
  }).catch(function(){S.loading=false;render()});
}
boot();
})();
</script>

</body></html>
