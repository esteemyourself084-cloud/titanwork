var SEED=[{"stage":1,"level":1,"order":1,"titleAr":"المُقَدِّمَةُ","titleEn":"Introduction","about":"A simple first look at how Arabic works: the three types of words, tenses, numbers, sentences and the root system. Every idea here is short and comes back in later lessons.","rules":[{"title":"Arabic at a glance (اللُّغَةُ العَرَبِيَّةُ)","body":"Arabic is written and read from right to left. It has 28 letters, they join together inside a word, and there are no capital letters.\nShort vowels are not letters. They are small marks written above or below a letter, called الحَرَكَاتُ (the vowel marks). They tell you how to say the word. You will study them one by one soon. Here are the three main ones.\n- فَتْحَةٌ (fatḥa) gives the sound \"a\".\n- ضَمَّةٌ (ḍamma) gives the sound \"u\".\n- كَسْرَةٌ (kasra) gives the sound \"i\".","ex":[{"ar":"كَتَبَ","tr":"kataba","en":"he wrote","note":"This is a verb, an action word. The فَتْحَةٌ gives the sound \"a\" three times: ka-ta-ba."},{"ar":"كُتُبٌ","tr":"kutubun","en":"books","note":"The same three letters with different vowel marks. The ضَمَّةٌ gives the sound \"u\", so it is read \"ku-tu-bun\". It means many books."},{"ar":"كِتَابٌ","tr":"kitābun","en":"book","note":"The كَسْرَةٌ gives the sound \"i\", and the long ا gives a long \"aa\": \"ki-taa-bun\". It means one book."}]},{"title":"Three types of words (أَنْوَاعُ الكَلِمَةِ)","body":"Every Arabic word (كَلِمَةٌ) is one of three types. Knowing the type of a word is the first step to understanding any sentence.\n- اِسْمٌ (ism) is a noun. It names a person, a place, a thing or an idea. It also covers describing words, like كَبِيرٌ (big).\n- فِعْلٌ (fiʿl) is a verb. It is an action word, and it also tells us when the action happens.\n- حَرْفٌ (ḥarf) is a particle. It is a small word that joins or links other words.","ex":[{"ar":"كِتَابٌ","tr":"kitābun","en":"book (an اِسْمٌ, a noun)","note":"It names a thing, so it is an اِسْمٌ."},{"ar":"كَتَبَ","tr":"kataba","en":"he wrote (a فِعْلٌ, a verb)","note":"It tells us about an action that already happened, so it is a فِعْلٌ."},{"ar":"مِنْ","tr":"min","en":"from (a حَرْفٌ, a particle)","note":"It does not name anything and does not do anything. It only links words, so it is a حَرْفٌ."}]},{"title":"The verb and its three tenses (الفِعْلُ)","body":"A فِعْلٌ has three tenses. The tense shows when the action happens.\n- الفِعْلُ المَاضِي (the past) is for what already happened.\n- الفِعْلُ المُضَارِعُ (the present) is for what is happening now or happens regularly. It is also used for the future.\n- فِعْلُ الأَمْرِ (the command) is for telling someone to do something.\nLook at the same verb in all three tenses. The three root letters stay, and the vowel marks and extra letters change.","ex":[{"ar":"كَتَبَ","tr":"kataba","en":"he wrote (Past)","note":"The past is the basic form of the verb. It means \"he did it\", and dictionaries list a verb under this form."},{"ar":"يَكْتُبُ","tr":"yaktubu","en":"he writes (Present)","note":"Add يَـ at the start and change the vowel marks. The root letters ك ت ب stay the same."},{"ar":"اُكْتُبْ","tr":"uktub","en":"write! (Command)","note":"The command is short. The small circle on the last letter is called سُكُونٌ and means \"no vowel here\"."},{"ar":"ذَهَبَ","tr":"dhahaba","en":"he went (Past)","note":"A second verb, with the root letters ذ ه ب. It means \"he went\"."},{"ar":"يَذْهَبُ","tr":"yadhhabu","en":"he goes (Present)","note":"It follows the same pattern as يَكْتُبُ: يَـ at the start shows the present."},{"ar":"اِذْهَبْ","tr":"idhhab","en":"go! (Command)","note":"The command starts with a helping letter and ends with a سُكُونٌ, just like اُكْتُبْ."}]},{"title":"The noun and its number (الاسْمُ)","body":"An اِسْمٌ can be in three numbers. English has only two, but Arabic has a special form for exactly two things.\n- مُفْرَدٌ (singular) means one.\n- مُثَنَّى (dual) means exactly two. It usually ends in ـَانِ.\n- جَمْعٌ (plural) means three or more. Each plural has its own shape, so learn it together with the word.","ex":[{"ar":"كِتَابٌ","tr":"kitābun","en":"one book","note":"One thing only. This is the singular, called مُفْرَدٌ."},{"ar":"كِتَابَانِ","tr":"kitābāni","en":"two books","note":"Add ـانِ to the end and you get the dual, called مُثَنَّى. It means exactly two."},{"ar":"كُتُبٌ","tr":"kutubun","en":"many books","note":"Many books is a plural, called جَمْعٌ. Notice that the whole shape of the word changes, not only the ending."},{"ar":"طَالِبٌ","tr":"ṭālibun","en":"one student","note":"One student, a singular."},{"ar":"طَالِبَانِ","tr":"ṭālibāni","en":"two students","note":"Add ـانِ again for exactly two students."},{"ar":"طُلَّابٌ","tr":"ṭullābun","en":"many students","note":"The plural of طَالِبٌ has a new shape. Learn each plural together with its singular."}]},{"title":"The particle (الحَرْفُ)","body":"A حَرْفٌ is a small word that does not have a full meaning on its own. It never changes its shape, and it helps link the words around it. You only need to learn each one once. Here are some common particles.\n- مِنْ means from.\n- فِي means in.\n- إِلَى means to.\n- عَلَى means on.\n- وَ means and.\n- هَلْ starts a yes or no question.","ex":[{"ar":"مِنْ","tr":"min","en":"from","note":"مِنْ shows where something starts, as in \"from the house\"."},{"ar":"فِي","tr":"fī","en":"in","note":"فِي shows where something is, as in \"in the house\"."},{"ar":"إِلَى","tr":"ilā","en":"to","note":"إِلَى shows direction, as in \"to the school\"."},{"ar":"عَلَى","tr":"ʿalā","en":"on","note":"عَلَى shows that something sits on something else, as in \"on the table\"."},{"ar":"وَ","tr":"wa","en":"and","note":"وَ joins two words or ideas. It is one letter, and it is written joined to the next word."},{"ar":"هَلْ","tr":"hal","en":"question word for yes or no","note":"Put هَلْ at the start of a sentence to turn it into a question that needs a yes or no answer."}]},{"title":"Two types of sentences (الجُمْلَةُ)","body":"A sentence (جُمْلَةٌ) in Arabic is one of two types. The very first word decides which one it is. Arabic has no word for \"is\", so a sentence like \"The house is big\" is simply two words side by side.\n- الجُمْلَةُ الاسْمِيَّةُ (the nominal sentence) starts with an اِسْمٌ.\n- الجُمْلَةُ الفِعْلِيَّةُ (the verbal sentence) starts with a فِعْلٌ.","ex":[{"ar":"البَيْتُ كَبِيرٌ","tr":"al-baytu kabīrun","en":"The house is big (nominal sentence)","note":"It starts with a noun, so it is a nominal sentence. There is no word for \"is\": the two words simply sit side by side."},{"ar":"الطَّالِبُ مُجْتَهِدٌ","tr":"aṭ-ṭālibu mujtahidun","en":"The student is hard-working (nominal sentence)","note":"Another nominal sentence: the noun comes first, then a word that describes it."},{"ar":"ذَهَبَ الوَلَدُ","tr":"dhahaba l-waladu","en":"The boy went (verbal sentence)","note":"It starts with the verb ذَهَبَ, so it is a verbal sentence: the verb comes first, then who did it."},{"ar":"قَرَأَ الطَّالِبُ","tr":"qaraʾa ṭ-ṭālibu","en":"The student read (verbal sentence)","note":"Verb first again: \"read\", and then the student who read."}]},{"title":"The root system (الجَذْرُ)","body":"Most Arabic words are built from a root (جَذْرٌ), usually three letters that carry one core idea. Add vowel marks and extra letters to the root and you get verbs, nouns and more. Words from the same root are family, so one root helps you learn many words.\n- The root ك ت ب carries the idea of writing.\n- The root د ر س carries the idea of studying.\n- The root ع ل م carries the idea of knowing.","ex":[{"ar":"كَتَبَ","tr":"kataba","en":"he wrote (root ك ت ب)","note":"The root ك ت ب carries the idea of writing, and the verb \"he wrote\" comes from it."},{"ar":"كِتَابٌ","tr":"kitābun","en":"book (root ك ت ب)","note":"A book is something written, so it uses the same three letters."},{"ar":"كَاتِبٌ","tr":"kātibun","en":"writer (root ك ت ب)","note":"The person who does the writing is a writer."},{"ar":"مَكْتَبَةٌ","tr":"maktabatun","en":"library (root ك ت ب)","note":"The place of books is a library. A مَ at the start of a word often shows a place."},{"ar":"دَرَسَ","tr":"darasa","en":"he studied (root د ر س)","note":"The root د ر س carries the idea of studying."},{"ar":"دَرْسٌ","tr":"darsun","en":"lesson (root د ر س)","note":"A lesson is something studied, built from the same root."},{"ar":"مَدْرَسَةٌ","tr":"madrasatun","en":"school (root د ر س)","note":"A school is a place of study, with the same مَ pattern as مَكْتَبَةٌ."},{"ar":"عَلِمَ","tr":"ʿalima","en":"he knew (root ع ل م)","note":"The root ع ل م carries the idea of knowing."},{"ar":"عِلْمٌ","tr":"ʿilmun","en":"knowledge (root ع ل م)","note":"Knowledge is the thing that is known."},{"ar":"مُعَلِّمٌ","tr":"muʿallimun","en":"teacher (root ع ل م)","note":"A teacher is the person who makes others know. A مُ at the start of a word often shows the person doing the action."}]},{"title":"Masculine, feminine and \"the\"","body":"Every اِسْمٌ is either masculine (مُذَكَّرٌ) or feminine (مُؤَنَّثٌ). A feminine word usually ends in ـَةٌ. To say \"the\", put اَلْ at the start of a word.","ex":[{"ar":"طَالِبٌ","tr":"ṭālibun","en":"student (masculine)","note":"A male student. No ending is added for the masculine."},{"ar":"طَالِبَةٌ","tr":"ṭālibatun","en":"student (feminine)","note":"Add ـةٌ at the end to make it feminine: a female student."},{"ar":"مُعَلِّمٌ","tr":"muʿallimun","en":"teacher (masculine)","note":"A male teacher."},{"ar":"مُعَلِّمَةٌ","tr":"muʿallimatun","en":"teacher (feminine)","note":"Add ـةٌ for a female teacher."},{"ar":"الكِتَابُ","tr":"al-kitābu","en":"the book","note":"Put اَلْ at the start to say \"the\": a book becomes the book."}]}],"words":[{"ar":"اِسْمٌ","pl":"أَسْمَاءٌ","en":"noun","type":"noun"},{"ar":"فِعْلٌ","pl":"أَفْعَالٌ","en":"verb","type":"noun"},{"ar":"حَرْفٌ","pl":"حُرُوفٌ","en":"particle","type":"noun"},{"ar":"كَلِمَةٌ","pl":"كَلِمَاتٌ","en":"word","type":"noun"},{"ar":"جُمْلَةٌ","pl":"جُمَلٌ","en":"sentence","type":"noun"},{"ar":"جَذْرٌ","pl":"جُذُورٌ","en":"root","type":"noun"},{"ar":"مُفْرَدٌ","pl":"","en":"singular","type":"noun"},{"ar":"مُثَنَّى","pl":"","en":"dual","type":"noun"},{"ar":"جَمْعٌ","pl":"جُمُوعٌ","en":"plural","type":"noun"},{"ar":"مُذَكَّرٌ","pl":"","en":"masculine","type":"noun"},{"ar":"مُؤَنَّثٌ","pl":"","en":"feminine","type":"noun"},{"ar":"كِتَابٌ","pl":"كُتُبٌ","en":"book","type":"noun"},{"ar":"طَالِبٌ","pl":"طُلَّابٌ","en":"student","type":"noun"},{"ar":"مُعَلِّمٌ","pl":"مُعَلِّمُونَ","en":"teacher","type":"noun"},{"ar":"كَتَبَ","pl":"","en":"to write","type":"verb"},{"ar":"دَرَسَ","pl":"","en":"to study","type":"verb"},{"ar":"ذَهَبَ","pl":"","en":"to go","type":"verb"},{"ar":"مِنْ","pl":"","en":"from","type":"particle"},{"ar":"فِي","pl":"","en":"in","type":"particle"},{"ar":"إِلَى","pl":"","en":"to","type":"particle"},{"ar":"عَلَى","pl":"","en":"on","type":"particle"},{"ar":"وَ","pl":"","en":"and","type":"particle"},{"ar":"هَلْ","pl":"","en":"question word for yes or no","type":"particle"}],"qs":[{"q":"Which Arabic word means \"verb\"?","a":"فِعْلٌ","w":["اِسْمٌ","حَرْفٌ"]},{"q":"Which Arabic word means \"noun\"?","a":"اِسْمٌ","w":["فِعْلٌ","حَرْفٌ"]},{"q":"Which Arabic word means \"particle\"?","a":"حَرْفٌ","w":["اِسْمٌ","فِعْلٌ"]},{"q":"Which name means \"the past tense\"?","a":"الفِعْلُ المَاضِي","w":["الفِعْلُ المُضَارِعُ","فِعْلُ الأَمْرِ"]},{"q":"Which name means \"the command\"?","a":"فِعْلُ الأَمْرِ","w":["الفِعْلُ المَاضِي","الفِعْلُ المُضَارِعُ"]},{"q":"Which Arabic word means \"dual\", exactly two?","a":"مُثَنَّى","w":["مُفْرَدٌ","جَمْعٌ"]},{"q":"Which Arabic word means \"plural\"?","a":"جَمْعٌ","w":["مُفْرَدٌ","مُثَنَّى"]},{"q":"Which Arabic word means \"root\"?","a":"جَذْرٌ","w":["جُمْلَةٌ","كَلِمَةٌ"]},{"q":"Which type of sentence starts with a verb?","a":"الجُمْلَةُ الفِعْلِيَّةُ","w":["الجُمْلَةُ الاسْمِيَّةُ"]},{"q":"What do we put at the start of a word to say \"the\"?","a":"اَلْ","w":["وَ","مِنْ"]},{"q":"Which Arabic word means \"sentence\"?","a":"جُمْلَةٌ","w":["جَذْرٌ","حَرْفٌ"]},{"q":"Which Arabic word means \"word\"?","a":"كَلِمَةٌ","w":["جُمْلَةٌ","فِعْلٌ"]},{"q":"Which Arabic word means \"singular\", one?","a":"مُفْرَدٌ","w":["مُثَنَّى","جَمْعٌ"]},{"q":"Which name means \"the present tense\"?","a":"الفِعْلُ المُضَارِعُ","w":["الفِعْلُ المَاضِي","فِعْلُ الأَمْرِ"]},{"q":"Which type of sentence starts with a noun?","a":"الجُمْلَةُ الاسْمِيَّةُ","w":["الجُمْلَةُ الفِعْلِيَّةُ"]},{"q":"Which Arabic word means \"masculine\"?","a":"مُذَكَّرٌ","w":["مُؤَنَّثٌ"]},{"q":"Which Arabic word means \"feminine\"?","a":"مُؤَنَّثٌ","w":["مُذَكَّرٌ"]},{"q":"Which mark gives the sound \"u\"?","a":"ضَمَّةٌ","w":["فَتْحَةٌ","كَسْرَةٌ"]},{"q":"Which mark gives the sound \"i\"?","a":"كَسْرَةٌ","w":["ضَمَّةٌ","فَتْحَةٌ"]},{"q":"Which particle means \"in\"?","a":"فِي","w":["مِنْ","عَلَى"]}],"id":"1-1-1"},{"stage":1,"level":1,"order":2,"titleAr":"كَلِمَاتٌ وَعِبَارَاتٌ يَوْمِيَّةٌ","titleEn":"Everyday Words and Phrases","about":"The words and questions you need for a first conversation in Arabic: greetings, \"how are you?\", \"what is your name?\", where you are from, and polite phrases. Learn them as whole phrases and say them out loud.","rules":[{"title":"Greetings (التَّحِيَّاتُ)","body":"Muslims greet each other with السَّلَامُ عَلَيْكُمْ, and the reply is وَعَلَيْكُمُ السَّلَامُ. Other greetings change with the time of day. Many greetings come in pairs: one person says the greeting, the other answers with a slightly richer reply. In the examples, a card marked \"Reply\" is the answer to the card above it.\n- صَبَاحُ الخَيْرِ is said in the morning, and the reply is صَبَاحُ النُّورِ.\n- مَسَاءُ الخَيْرِ is said in the evening, and the reply is مَسَاءُ النُّورِ.\n- مَعَ السَّلَامَةِ is said when someone leaves.","ex":[{"ar":"السَّلَامُ عَلَيْكُمْ","tr":"as-salāmu ʿalaykum","en":"peace be upon you","note":"The greeting Muslims give when they meet. Say it first when you meet someone or enter a room."},{"ar":"وَعَلَيْكُمُ السَّلَامُ","tr":"wa ʿalaykumu s-salām","en":"and upon you be peace","re":true,"note":"Always answer with this. It uses the same words in a different order, with وَ (\"and\") at the start."},{"ar":"مَرْحَبًا","tr":"marḥaban","en":"hello","note":"A general hello that anyone can say at any time of day."},{"ar":"أَهْلًا وَسَهْلًا","tr":"ahlan wa sahlan","en":"welcome","note":"Said to welcome a guest, for example when they arrive at your home."},{"ar":"صَبَاحُ الخَيْرِ","tr":"ṣabāḥu l-khayr","en":"good morning","note":"Said in the morning. Literally \"morning of goodness\"."},{"ar":"صَبَاحُ النُّورِ","tr":"ṣabāḥu n-nūr","en":"good morning (the answer)","re":true,"note":"The answer to صَبَاحُ الخَيْرِ. Literally \"morning of light\", a richer reply."},{"ar":"مَسَاءُ الخَيْرِ","tr":"masāʾu l-khayr","en":"good evening","note":"Said in the afternoon and evening. Literally \"evening of goodness\"."},{"ar":"مَسَاءُ النُّورِ","tr":"masāʾu n-nūr","en":"good evening (the answer)","re":true,"note":"The answer to مَسَاءُ الخَيْرِ. Literally \"evening of light\", the same pattern as the morning reply."},{"ar":"مَعَ السَّلَامَةِ","tr":"maʿa s-salāma","en":"goodbye","note":"Said when someone leaves. Literally \"with safety\"."}]},{"title":"I, you, he and she (الضَّمَائِرُ)","body":"These small words say who is talking or who is being talked about. Arabic has two words for \"you\": one for a man and one for a woman. The only difference is the last vowel mark: فَتْحَةٌ for a man and كَسْرَةٌ for a woman.\n- أَنَا means \"I\".\n- أَنْتَ means \"you\" to a man, and أَنْتِ means \"you\" to a woman.\n- هُوَ means \"he\", and هِيَ means \"she\".\nIn Arabic you do not need a word for \"am, is, are\" in the present. You simply put the two words next to each other: أَنَا طَالِبٌ means \"I am a student\". To make a word feminine we usually add ـةٌ at the end, so طَالِبٌ (a male student) becomes طَالِبَةٌ (a female student).","ex":[{"ar":"أَنَا طَالِبٌ","tr":"anā ṭālibun","en":"I am a student (a man speaking)","note":"A man is speaking, so the word is the masculine طَالِبٌ. Notice there is no word for \"am\"."},{"ar":"أَنَا طَالِبَةٌ","tr":"anā ṭālibatun","en":"I am a student (a woman speaking)","note":"A woman is speaking, so the word is the feminine طَالِبَةٌ."},{"ar":"أَنْتَ مُعَلِّمٌ","tr":"anta muʿallimun","en":"you are a teacher (to a man)","note":"أَنْتَ points at a man, so the describing word stays masculine."},{"ar":"أَنْتِ مُعَلِّمَةٌ","tr":"anti muʿallimatun","en":"you are a teacher (to a woman)","note":"أَنْتِ points at a woman, so the describing word takes ـةٌ."},{"ar":"هُوَ طَالِبٌ","tr":"huwa ṭālibun","en":"he is a student","note":"هُوَ is for one man or boy."},{"ar":"هِيَ طَالِبَةٌ","tr":"hiya ṭālibatun","en":"she is a student","note":"هِيَ is for one woman or girl."}]},{"title":"How are you? (كَيْفَ حَالُكَ؟)","body":"حَالٌ means \"condition\" or \"state\", so كَيْفَ حَالُكَ؟ is literally \"how is your state?\". The ending ـكَ means \"your\" for a man, and ـكِ means \"your\" for a woman. The usual answer is بِخَيْرٍ, which means \"in goodness\", followed by thanks to Allah. To ask the question back, say وَأَنْتَ؟ to a man or وَأَنْتِ؟ to a woman.","ex":[{"ar":"كَيْفَ حَالُكَ؟","tr":"kayfa ḥāluka","en":"how are you? (to a man)","note":"The normal way to ask a man how he is. Literally \"how is your state?\"."},{"ar":"بِخَيْرٍ، الحَمْدُ لِلَّهِ","tr":"bi-khayrin, al-ḥamdu lillāh","en":"fine, praise be to Allah","re":true,"note":"The usual answer. بِخَيْرٍ means \"in goodness\", and الحَمْدُ لِلَّهِ thanks Allah."},{"ar":"كَيْفَ حَالُكِ؟","tr":"kayfa ḥāluki","en":"how are you? (to a woman)","note":"The same question to a woman. Only the last vowel changes, to a كَسْرَةٌ."},{"ar":"أَنَا بِخَيْرٍ","tr":"anā bi-khayrin","en":"I am fine","re":true,"note":"A fuller answer: \"I am in goodness\". Men and women say it the same way."},{"ar":"وَأَنْتَ؟","tr":"wa anta","en":"and you? (to a man)","note":"Ask it back to a man. وَ means \"and\"."},{"ar":"وَأَنْتِ؟","tr":"wa anti","en":"and you? (to a woman)","note":"Ask it back to a woman."}]},{"title":"What is your name? (مَا اسْمُكَ؟)","body":"اِسْمٌ means \"name\". Add ـكَ or ـكِ to say \"your name\", and add ـي to say \"my name\". Use مَا (what) to ask the question and اِسْمِي to answer. When you meet someone new, you can say تَشَرَّفْنَا or فُرْصَةٌ سَعِيدَةٌ.","ex":[{"ar":"مَا اسْمُكَ؟","tr":"mā ismuka","en":"what is your name? (to a man)","note":"Literally \"what is your name?\", asked to a man."},{"ar":"اِسْمِي أَحْمَدُ","tr":"ismī aḥmadu","en":"my name is Ahmad","re":true,"note":"The ending ـي means \"my\". Put your own name after اِسْمِي."},{"ar":"مَا اسْمُكِ؟","tr":"mā ismuki","en":"what is your name? (to a woman)","note":"The same question to a woman, with the كَسْرَةٌ."},{"ar":"اِسْمِي مَرْيَمُ","tr":"ismī maryamu","en":"my name is Maryam","re":true,"note":"A woman answers in exactly the same way. Only the name changes."},{"ar":"تَشَرَّفْنَا","tr":"tasharrafnā","en":"pleased to meet you","note":"A polite thing to say after you hear someone's name. Literally \"we are honoured\"."},{"ar":"فُرْصَةٌ سَعِيدَةٌ","tr":"furṣatun saʿīdatun","en":"a happy opportunity (nice to meet you)","note":"Another way to say \"nice to meet you\". Literally \"a happy opportunity\"."}]},{"title":"Question words (أَدَوَاتُ الاسْتِفْهَامِ)","body":"Question words come at the start of the question. Learn these seven, because you will use them in almost every conversation. You also need هَذَا (\"this\", for a masculine thing) and هَذِهِ (\"this\", for a feminine thing).\n- مَا means \"what\", and مَنْ means \"who\".\n- أَيْنَ means \"where\", and مَتَى means \"when\".\n- كَيْفَ means \"how\", and لِمَاذَا means \"why\".\n- كَمْ means \"how many\" or \"how much\".","ex":[{"ar":"مَا هَذَا؟","tr":"mā hādhā","en":"what is this?","note":"Use مَا to ask about a thing. هَذَا points at something close to you."},{"ar":"هَذَا كِتَابٌ","tr":"hādhā kitābun","en":"this is a book","re":true,"note":"Answer with هَذَا and then the name of the thing."},{"ar":"مَنْ هَذَا؟","tr":"man hādhā","en":"who is this?","note":"Use مَنْ, not مَا, when you ask about a person."},{"ar":"هَذَا أَحْمَدُ","tr":"hādhā aḥmadu","en":"this is Ahmad","re":true,"note":"Answer with هَذَا and then the person's name."},{"ar":"أَيْنَ الكِتَابُ؟","tr":"ayna l-kitābu","en":"where is the book?","note":"أَيْنَ asks about a place. Put the thing you are looking for after it."},{"ar":"أَيْنَ المَكْتَبَةُ؟","tr":"ayna l-maktabatu","en":"where is the library?","note":"أَيْنَ asks about a place. المَكْتَبَةُ is the library, a word you met in the root lesson of the introduction."},{"ar":"هَذِهِ هِيَ المَكْتَبَةُ","tr":"hādhihi hiya l-maktabatu","en":"this is the library","re":true,"note":"To say \"this is THE library\", put هِيَ (she) between the two words. Use هِيَ because مَكْتَبَةٌ is feminine. Without it, هَذِهِ المَكْتَبَةُ means only \"this library\"."},{"ar":"مَتَى الدَّرْسُ؟","tr":"matā d-darsu","en":"when is the lesson?","note":"مَتَى asks about time. دَرْسٌ is a lesson, and اَلْ makes it \"the lesson\"."},{"ar":"لِمَاذَا تَدْرُسُ العَرَبِيَّةَ؟","tr":"limādhā tadrusu l-ʿarabiyya","en":"why do you study Arabic?","note":"لِمَاذَا asks for a reason. تَدْرُسُ is the present form of دَرَسَ, \"you study\"."},{"ar":"كَمْ عُمْرُكَ؟","tr":"kam ʿumruka","en":"how old are you?","note":"كَمْ asks about a number. عُمْرٌ is age, so this is \"how old are you?\"."},{"ar":"هَذِهِ طَالِبَةٌ","tr":"hādhihi ṭālibatun","en":"this is a (female) student","note":"Use هَذِهِ for a feminine thing or a woman. For a man you say هَذَا طَالِبٌ."}]},{"title":"Yes, no and where you are from","body":"نَعَمْ means \"yes\" and لَا means \"no\". Use هَلْ to ask a question that needs a yes or no answer. To ask where someone is from, put مِنْ (from) before أَيْنَ.","ex":[{"ar":"نَعَمْ","tr":"naʿam","en":"yes","note":"The word for yes, said on its own."},{"ar":"لَا","tr":"lā","en":"no","note":"The word for no."},{"ar":"هَلْ أَنْتَ طَالِبٌ؟","tr":"hal anta ṭālibun","en":"are you a student?","note":"هَلْ at the start makes a yes-or-no question."},{"ar":"نَعَمْ، أَنَا طَالِبٌ","tr":"naʿam, anā ṭālibun","en":"yes, I am a student","re":true,"note":"Answer with نَعَمْ and then the full sentence."},{"ar":"مِنْ أَيْنَ أَنْتَ؟","tr":"min ayna anta","en":"where are you from? (to a man)","note":"مِنْ means \"from\", so the question is literally \"from where are you?\"."},{"ar":"أَنَا مِنْ مِصْرَ","tr":"anā min miṣra","en":"I am from Egypt","re":true,"note":"Answer with أَنَا مِنْ and then the place. A woman is asked مِنْ أَيْنَ أَنْتِ؟"},{"ar":"أَنَا مِنْ لُبْنَانَ","tr":"anā min lubnāna","en":"I am from Lebanon","re":true,"note":"A woman answers in exactly the same way. Only the name of the country changes."},{"ar":"هَلْ تَتَكَلَّمُ العَرَبِيَّةَ؟","tr":"hal tatakallamu l-ʿarabiyya","en":"do you speak Arabic?","note":"تَتَكَلَّمُ means \"you speak\". A useful question for a new friend."},{"ar":"نَعَمْ، قَلِيلًا","tr":"naʿam, qalīlan","en":"yes, a little","re":true,"note":"قَلِيلًا means \"a little\". It is a humble, polite answer."}]},{"title":"Being polite (الأَدَبُ)","body":"Politeness is a big part of Arabic conversation, and many polite phrases mention Allah.\n- شُكْرًا means \"thank you\", and عَفْوًا means \"you are welcome\".\n- مِنْ فَضْلِكَ and لَوْ سَمَحْتَ both help you ask politely.\n- آسِفٌ is what a man says to say sorry, and لَا بَأْسَ means \"no problem\".\n- إِنْ شَاءَ اللَّهُ means \"if Allah wills\", and it is said about the future.","ex":[{"ar":"شُكْرًا","tr":"shukran","en":"thank you","note":"The standard way to thank someone."},{"ar":"عَفْوًا","tr":"ʿafwan","en":"you are welcome","re":true,"note":"The usual answer to شُكْرًا. It can also mean \"pardon me\"."},{"ar":"مِنْ فَضْلِكَ","tr":"min faḍlika","en":"please (to a man)","note":"Literally \"from your favour\". Say it when you ask for something."},{"ar":"لَوْ سَمَحْتَ","tr":"law samaḥta","en":"excuse me (to a man)","note":"Literally \"if you allow\". Use it to get someone's attention politely."},{"ar":"آسِفٌ","tr":"āsifun","en":"sorry (a man speaking)","note":"A man says آسِفٌ, and a woman says آسِفَةٌ."},{"ar":"لَا بَأْسَ","tr":"lā baʾsa","en":"no problem","note":"Said back to someone who says sorry: it is fine, no harm done."},{"ar":"إِنْ شَاءَ اللَّهُ","tr":"in shāʾa llāhu","en":"if Allah wills","note":"Muslims say it when speaking about the future, because only Allah knows what will happen."},{"ar":"جَزَاكَ اللَّهُ خَيْرًا","tr":"jazāka llāhu khayran","en":"may Allah reward you with good","note":"A kind way to thank someone. Say جَزَاكِ اللَّهُ خَيْرًا to a woman."}]},{"title":"Handy phrases for learners","body":"These phrases keep a conversation going when you get stuck. They are especially useful when you are learning, so do not be afraid to use them.\n- لَا أَفْهَمُ means \"I do not understand\".\n- أَعِدْ مِنْ فَضْلِكَ means \"please repeat\".\n- أُرِيدُ means \"I want\".","ex":[{"ar":"لَا أَفْهَمُ","tr":"lā afhamu","en":"I do not understand","note":"فَهِمَ means \"to understand\". Put لَا before the present form to say \"do not\"."},{"ar":"أَعِدْ مِنْ فَضْلِكَ","tr":"aʿid min faḍlika","en":"please repeat","note":"A command: \"repeat\". Adding مِنْ فَضْلِكَ makes it polite."},{"ar":"مَا مَعْنَى هَذِهِ الكَلِمَةِ؟","tr":"mā maʿnā hādhihi l-kalimati","en":"what is the meaning of this word?","note":"مَعْنًى is meaning, and كَلِمَةٌ is feminine, so هَذِهِ is used. A great way to learn new words."},{"ar":"أُرِيدُ مَاءً","tr":"urīdu māʾan","en":"I want water","note":"أُرِيدُ means \"I want\". Put what you want after it."},{"ar":"كَمْ هَذَا؟","tr":"kam hādhā","en":"how much is this?","note":"Use it in a shop to ask the price."},{"ar":"أَيْنَ الحَمَّامُ؟","tr":"ayna l-ḥammāmu","en":"where is the bathroom?","note":"A very useful question when you are out and about."}]}],"words":[{"ar":"مَرْحَبًا","pl":"","en":"hello","type":"phrase"},{"ar":"أَهْلًا وَسَهْلًا","pl":"","en":"welcome","type":"phrase"},{"ar":"صَبَاحُ الخَيْرِ","pl":"","en":"good morning","type":"phrase"},{"ar":"مَسَاءُ الخَيْرِ","pl":"","en":"good evening","type":"phrase"},{"ar":"مَعَ السَّلَامَةِ","pl":"","en":"goodbye","type":"phrase"},{"ar":"شُكْرًا","pl":"","en":"thank you","type":"phrase"},{"ar":"عَفْوًا","pl":"","en":"you are welcome","type":"phrase"},{"ar":"نَعَمْ","pl":"","en":"yes","type":"particle"},{"ar":"لَا","pl":"","en":"no","type":"particle"},{"ar":"أَنَا","pl":"","en":"I","type":"pronoun"},{"ar":"أَنْتَ","pl":"","en":"you (to a man)","type":"pronoun"},{"ar":"أَنْتِ","pl":"","en":"you (to a woman)","type":"pronoun"},{"ar":"هُوَ","pl":"","en":"he","type":"pronoun"},{"ar":"هِيَ","pl":"","en":"she","type":"pronoun"},{"ar":"هَذَا","pl":"","en":"this (masculine)","type":"pronoun"},{"ar":"هَذِهِ","pl":"","en":"this (feminine)","type":"pronoun"},{"ar":"مَا","pl":"","en":"what","type":"question word"},{"ar":"مَنْ","pl":"","en":"who","type":"question word"},{"ar":"أَيْنَ","pl":"","en":"where","type":"question word"},{"ar":"مَتَى","pl":"","en":"when","type":"question word"},{"ar":"كَيْفَ","pl":"","en":"how","type":"question word"},{"ar":"لِمَاذَا","pl":"","en":"why","type":"question word"},{"ar":"كَمْ","pl":"","en":"how many, how much","type":"question word"},{"ar":"حَالٌ","pl":"أَحْوَالٌ","en":"condition, state","type":"noun"},{"ar":"عُمْرٌ","pl":"أَعْمَارٌ","en":"age, lifetime","type":"noun"},{"ar":"دَرْسٌ","pl":"دُرُوسٌ","en":"lesson","type":"noun"},{"ar":"مَاءٌ","pl":"مِيَاهٌ","en":"water","type":"noun"},{"ar":"مَعْنًى","pl":"مَعَانٍ","en":"meaning","type":"noun"},{"ar":"طَالِبَةٌ","pl":"طَالِبَاتٌ","en":"female student","type":"noun"},{"ar":"مَكْتَبَةٌ","pl":"مَكْتَبَاتٌ","en":"library","type":"noun"},{"ar":"مِصْرُ","pl":"","en":"Egypt","type":"noun"},{"ar":"لُبْنَانُ","pl":"","en":"Lebanon","type":"noun"},{"ar":"فَهِمَ","pl":"","en":"to understand","type":"verb"},{"ar":"أَرَادَ","pl":"","en":"to want","type":"verb"}],"qs":[{"q":"How do you say \"peace be upon you\"?","a":"السَّلَامُ عَلَيْكُمْ","w":["مَعَ السَّلَامَةِ","شُكْرًا"]},{"q":"What is the reply to السَّلَامُ عَلَيْكُمْ?","a":"وَعَلَيْكُمُ السَّلَامُ","w":["صَبَاحُ الخَيْرِ","عَفْوًا"]},{"q":"Which phrase means \"goodbye\"?","a":"مَعَ السَّلَامَةِ","w":["مَرْحَبًا","مَسَاءُ الخَيْرِ"]},{"q":"Which phrase means \"good morning\"?","a":"صَبَاحُ الخَيْرِ","w":["مَسَاءُ الخَيْرِ","أَهْلًا وَسَهْلًا"]},{"q":"Which phrase means \"good evening\"?","a":"مَسَاءُ الخَيْرِ","w":["صَبَاحُ الخَيْرِ","مَعَ السَّلَامَةِ"]},{"q":"Which word means \"I\"?","a":"أَنَا","w":["أَنْتَ","هُوَ"]},{"q":"Which word means \"she\"?","a":"هِيَ","w":["هُوَ","أَنْتِ"]},{"q":"Which word means \"you\" said to a woman?","a":"أَنْتِ","w":["أَنْتَ","أَنَا"]},{"q":"How do you ask a man \"How are you?\"","a":"كَيْفَ حَالُكَ؟","w":["كَيْفَ حَالُكِ؟","مَا اسْمُكَ؟"]},{"q":"How do you ask a woman \"How are you?\"","a":"كَيْفَ حَالُكِ؟","w":["كَيْفَ حَالُكَ؟","مَا اسْمُكِ؟"]},{"q":"Which answer means \"Fine, praise be to Allah\"?","a":"بِخَيْرٍ، الحَمْدُ لِلَّهِ","w":["لَا بَأْسَ","مَعَ السَّلَامَةِ"]},{"q":"How do you ask a man \"What is your name?\"","a":"مَا اسْمُكَ؟","w":["مَنْ هَذَا؟","كَمْ عُمْرُكَ؟"]},{"q":"How do you say \"My name is Ahmad\"?","a":"اِسْمِي أَحْمَدُ","w":["اِسْمُكَ أَحْمَدُ","أَنَا أَحْمَدُ طَالِبَةٌ"]},{"q":"Which word means \"who\"?","a":"مَنْ","w":["مَا","أَيْنَ"]},{"q":"Which word means \"where\"?","a":"أَيْنَ","w":["مَتَى","كَيْفَ"]},{"q":"Which word means \"when\"?","a":"مَتَى","w":["لِمَاذَا","كَمْ"]},{"q":"Which word means \"why\"?","a":"لِمَاذَا","w":["كَيْفَ","مَنْ"]},{"q":"Which word means \"yes\"?","a":"نَعَمْ","w":["لَا","عَفْوًا"]},{"q":"How do you ask a man \"Where are you from?\"","a":"مِنْ أَيْنَ أَنْتَ؟","w":["كَيْفَ حَالُكَ؟","هَلْ أَنْتَ طَالِبٌ؟"]},{"q":"Which word means \"thank you\"?","a":"شُكْرًا","w":["عَفْوًا","مَرْحَبًا"]},{"q":"Which phrase means \"if Allah wills\"?","a":"إِنْ شَاءَ اللَّهُ","w":["جَزَاكَ اللَّهُ خَيْرًا","الحَمْدُ لِلَّهِ"]},{"q":"Which phrase means \"I do not understand\"?","a":"لَا أَفْهَمُ","w":["أُرِيدُ مَاءً","لَا بَأْسَ"]},{"q":"Which phrase means \"please\" (to a man)?","a":"مِنْ فَضْلِكَ","w":["شُكْرًا","مَعَ السَّلَامَةِ"]},{"q":"Which answer means \"Yes, a little\"?","a":"نَعَمْ، قَلِيلًا","w":["لَا بَأْسَ","مَعَ السَّلَامَةِ"]},{"q":"Which phrase means \"I want water\"?","a":"أُرِيدُ مَاءً","w":["لَا أَفْهَمُ","أَيْنَ الحَمَّامُ؟"]},{"q":"How do you ask \"How old are you?\"","a":"كَمْ عُمْرُكَ؟","w":["مَا اسْمُكَ؟","مَتَى الدَّرْسُ؟"]},{"q":"How do you ask \"Who is this?\"","a":"مَنْ هَذَا؟","w":["مَا هَذَا؟","كَمْ هَذَا؟"]},{"q":"How do you ask \"How much is this?\"","a":"كَمْ هَذَا؟","w":["مَا هَذَا؟","مَنْ هَذَا؟"]},{"q":"Which phrase means \"pleased to meet you\"?","a":"تَشَرَّفْنَا","w":["مَعَ السَّلَامَةِ","عَفْوًا"]}],"conv":{"title":"مُحَادَثَةٌ: أَحْمَدُ وَمَرْيَمُ فِي المَدْرَسَةِ","lines":[{"w":"m","n":"أَحْمَدُ","ar":"السَّلَامُ عَلَيْكُمْ."},{"w":"f","n":"مَرْيَمُ","ar":"وَعَلَيْكُمُ السَّلَامُ."},{"w":"m","n":"أَحْمَدُ","ar":"أَهْلًا وَسَهْلًا. صَبَاحُ الخَيْرِ."},{"w":"f","n":"مَرْيَمُ","ar":"صَبَاحُ النُّورِ."},{"w":"m","n":"أَحْمَدُ","ar":"كَيْفَ حَالُكِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"بِخَيْرٍ، الحَمْدُ لِلَّهِ. وَأَنْتَ؟"},{"w":"m","n":"أَحْمَدُ","ar":"أَنَا بِخَيْرٍ، شُكْرًا."},{"w":"f","n":"مَرْيَمُ","ar":"عَفْوًا. مَا اسْمُكَ؟"},{"w":"m","n":"أَحْمَدُ","ar":"اِسْمِي أَحْمَدُ. وَمَا اسْمُكِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"اِسْمِي مَرْيَمُ."},{"w":"m","n":"أَحْمَدُ","ar":"تَشَرَّفْنَا."},{"w":"f","n":"مَرْيَمُ","ar":"فُرْصَةٌ سَعِيدَةٌ. هَلْ أَنْتَ مُعَلِّمٌ؟"},{"w":"m","n":"أَحْمَدُ","ar":"نَعَمْ، أَنَا مُعَلِّمٌ. وَهَلْ أَنْتِ طَالِبَةٌ؟"},{"w":"f","n":"مَرْيَمُ","ar":"نَعَمْ، أَنَا طَالِبَةٌ."},{"w":"m","n":"أَحْمَدُ","ar":"مِنْ أَيْنَ أَنْتِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"أَنَا مِنْ لُبْنَانَ. وَأَنْتَ؟ مِنْ أَيْنَ أَنْتَ؟"},{"w":"m","n":"أَحْمَدُ","ar":"أَنَا مِنْ مِصْرَ."},{"w":"f","n":"مَرْيَمُ","ar":"أَيْنَ المَكْتَبَةُ مِنْ فَضْلِكَ؟"},{"w":"m","n":"أَحْمَدُ","ar":"هَذِهِ هِيَ المَكْتَبَةُ."},{"w":"f","n":"مَرْيَمُ","ar":"شُكْرًا، جَزَاكَ اللَّهُ خَيْرًا."},{"w":"m","n":"أَحْمَدُ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."},{"w":"f","n":"مَرْيَمُ","ar":"مَعَ السَّلَامَةِ."}],"qs":[{"q":"What is the man's name?","a":"أَحْمَدُ","w":["مَرْيَمُ","هُوَ"]},{"q":"What is the woman's name?","a":"مَرْيَمُ","w":["أَحْمَدُ","أَنَا"]},{"q":"Who is the teacher?","a":"أَحْمَدُ","w":["مَرْيَمُ"]},{"q":"Who is the student?","a":"مَرْيَمُ","w":["أَحْمَدُ"]},{"q":"Where is Maryam from?","a":"مِنْ لُبْنَانَ","w":["مِنْ مِصْرَ"]},{"q":"Where is Ahmad from?","a":"مِنْ مِصْرَ","w":["مِنْ لُبْنَانَ"]},{"q":"What does Maryam want to find?","a":"المَكْتَبَةُ","w":["الحَمَّامُ","الكِتَابُ"]},{"q":"What does Ahmad answer when Maryam asks where the library is?","a":"هَذِهِ هِيَ المَكْتَبَةُ","w":["هَذَا كِتَابٌ","أَنَا مِنْ مِصْرَ"]},{"q":"Which greeting does Ahmad say first?","a":"السَّلَامُ عَلَيْكُمْ","w":["مَعَ السَّلَامَةِ","شُكْرًا"]},{"q":"How does Maryam answer \"How are you?\"","a":"بِخَيْرٍ، الحَمْدُ لِلَّهِ","w":["لَا بَأْسَ","نَعَمْ"]},{"q":"What does Ahmad say after Maryam thanks him?","a":"عَفْوًا","w":["تَشَرَّفْنَا","مَرْحَبًا"]},{"q":"What does Maryam say after \"pleased to meet you\"?","a":"فُرْصَةٌ سَعِيدَةٌ","w":["عَفْوًا","لَا بَأْسَ"]},{"q":"Which question does Ahmad ask to find out her country?","a":"مِنْ أَيْنَ أَنْتِ؟","w":["مَا اسْمُكِ؟","كَيْفَ حَالُكِ؟"]},{"q":"What does Maryam ask Ahmad about his job?","a":"هَلْ أَنْتَ مُعَلِّمٌ؟","w":["هَلْ أَنْتِ طَالِبَةٌ؟","مَنْ هَذَا؟"]},{"q":"How does Ahmad say goodbye?","a":"مَعَ السَّلَامَةِ","w":["صَبَاحُ الخَيْرِ","أَهْلًا وَسَهْلًا"]}]},"id":"1-1-2"},{"stage":1,"level":1,"order":4,"titleAr":"الأُسْرَةُ","titleEn":"The Family","about":"Talk about your family. You will learn the words for father, mother, brother, sister and grandparents, how to say \"my\" and \"his\" and \"her\", and how to say what you have with عِنْدِي.","rules":[{"title":"Family members (أَفْرَادُ الأُسْرَةِ)","body":"أُسْرَةٌ means \"family\". Learn the basic family words first. Each one has a singular and a plural. Point at a masculine person with هَذَا and at a feminine person with هَذِهِ.\n- أَبٌ is \"father\" and أُمٌّ is \"mother\".\n- أَخٌ is \"brother\" and أُخْتٌ is \"sister\".\n- اِبْنٌ is \"son\" and بِنْتٌ is \"daughter\".\n- جَدٌّ is \"grandfather\" and جَدَّةٌ is \"grandmother\".","ex":[{"ar":"هَذَا أَبٌ","tr":"hādhā abun","en":"this is a father","note":"The plural of أَبٌ is آبَاءٌ, which means fathers."},{"ar":"هَذِهِ أُمٌّ","tr":"hādhihi ummun","en":"this is a mother","note":"The plural of أُمٌّ is أُمَّهَاتٌ, which means mothers."},{"ar":"هَذَا أَخٌ","tr":"hādhā akhun","en":"this is a brother","note":"The plural of أَخٌ is إِخْوَةٌ, which means brothers."},{"ar":"هَذِهِ أُخْتٌ","tr":"hādhihi ukhtun","en":"this is a sister","note":"The plural of أُخْتٌ is أَخَوَاتٌ, which means sisters."},{"ar":"هَذَا اِبْنٌ","tr":"hādhā ibnun","en":"this is a son","note":"The plural of اِبْنٌ is أَبْنَاءٌ, which means sons."},{"ar":"هَذِهِ بِنْتٌ","tr":"hādhihi bintun","en":"this is a daughter","note":"The plural of بِنْتٌ is بَنَاتٌ, which means daughters or girls."}]},{"title":"My family (أُسْرَتِي)","body":"To say \"my father\", add ـِي to the end: أَبٌ becomes أَبِي. You already used this ending in اِسْمِي and كِتَابِي. When a word ends with ـةٌ, the ة becomes ت: جَدَّةٌ becomes جَدَّتِي. A word with a doubled letter keeps it: أُمٌّ becomes أُمِّي.","ex":[{"ar":"هَذَا أَبِي","tr":"hādhā abī","en":"this is my father","note":"أَبٌ plus ـِي gives أَبِي."},{"ar":"هَذِهِ أُمِّي","tr":"hādhihi ummī","en":"this is my mother","note":"The doubled م stays doubled: أُمٌّ becomes أُمِّي."},{"ar":"هَذَا أَخِي","tr":"hādhā akhī","en":"this is my brother","note":"أَخٌ plus ـِي gives أَخِي."},{"ar":"هَذِهِ أُخْتِي","tr":"hādhihi ukhtī","en":"this is my sister","note":"أُخْتٌ plus ـِي gives أُخْتِي."},{"ar":"هَذَا جَدِّي","tr":"hādhā jaddī","en":"this is my grandfather","note":"The doubled د stays doubled: جَدٌّ becomes جَدِّي."},{"ar":"هَذِهِ جَدَّتِي","tr":"hādhihi jaddatī","en":"this is my grandmother","note":"The ة of جَدَّةٌ becomes ت before the ending."}]},{"title":"More relatives (الأَقَارِبُ)","body":"Here are more family words. Add ـِي to each one to say \"my\". Notice that a husband is زَوْجٌ and a wife is زَوْجَةٌ.","ex":[{"ar":"هَذَا عَمِّي","tr":"hādhā ʿammī","en":"this is my paternal uncle","note":"عَمٌّ is your father's brother. Its plural is أَعْمَامٌ."},{"ar":"هَذَا خَالِي","tr":"hādhā khālī","en":"this is my maternal uncle","note":"خَالٌ is your mother's brother. Its plural is أَخْوَالٌ."},{"ar":"هَذَا زَوْجِي","tr":"hādhā zawjī","en":"this is my husband","note":"A wife says it about her husband. The plural of زَوْجٌ is أَزْوَاجٌ."},{"ar":"هَذِهِ زَوْجَتِي","tr":"hādhihi zawjatī","en":"this is my wife","note":"A husband says it about his wife. The plural of زَوْجَةٌ is زَوْجَاتٌ."},{"ar":"هَذَا وَلَدِي","tr":"hādhā waladī","en":"this is my boy","note":"وَلَدٌ means a boy or a child. Its plural is أَوْلَادٌ."},{"ar":"هَذِهِ أُسْرَتِي","tr":"hādhihi usratī","en":"this is my family","note":"The plural of أُسْرَةٌ is أُسَرٌ, which means families."}]},{"title":"His and her (كِتَابُهُ وَكِتَابُهَا)","body":"You know ـِي (my), ـكَ (your, to a man) and ـكِ (your, to a woman). Two new endings complete the set. ـهُ means \"his\" and ـهَا means \"her\". Say them with the same vowel marks you see here.","ex":[{"ar":"هَذَا كِتَابُهُ","tr":"hādhā kitābuhu","en":"this is his book","note":"ـهُ at the end means \"his\" (a man owns it)."},{"ar":"هَذَا كِتَابُهَا","tr":"hādhā kitābuhā","en":"this is her book","note":"ـهَا at the end means \"her\" (a woman owns it)."},{"ar":"مَا اسْمُهُ؟","tr":"mā ismuhu","en":"what is his name?","note":"You ask about a man with ـهُ."},{"ar":"اِسْمُهُ مُحَمَّدٌ","tr":"ismuhu muḥammadun","en":"his name is Muhammad","re":true,"note":"Use اِسْمُهُ before a man's name."},{"ar":"مَا اسْمُهَا؟","tr":"mā ismuhā","en":"what is her name?","note":"You ask about a woman with ـهَا."},{"ar":"اِسْمُهَا فَاطِمَةُ","tr":"ismuhā fāṭimatu","en":"her name is Fatima","re":true,"note":"Use اِسْمُهَا before a woman's name."},{"ar":"هَذِهِ أُمُّهُ","tr":"hādhihi ummuhu","en":"this is his mother","note":"Put ـهُ on the family word to say whose family it is."},{"ar":"هَذِهِ أُخْتُهَا","tr":"hādhihi ukhtuhā","en":"this is her sister","note":"The same word with ـهَا is \"her sister\"."}]},{"title":"Who is this? (مَنْ هَذَا؟)","body":"Use مَنْ to ask about a person. مَنْ هُوَ؟ asks \"who is he?\" and مَنْ هِيَ؟ asks \"who is she?\". You can answer with a family word and \"my\".","ex":[{"ar":"مَنْ هَذَا؟","tr":"man hādhā","en":"who is this? (a man)","note":"Point at a man or a boy."},{"ar":"هَذَا أَبِي","tr":"hādhā abī","en":"this is my father","re":true,"note":"Answer with هَذَا and the family word."},{"ar":"مَنْ هَذِهِ؟","tr":"man hādhihi","en":"who is this? (a woman)","note":"Point at a woman or a girl."},{"ar":"هَذِهِ جَدَّتِي","tr":"hādhihi jaddatī","en":"this is my grandmother","re":true,"note":"Answer with هَذِهِ and the family word."},{"ar":"مَنْ هُوَ؟","tr":"man huwa","en":"who is he?","note":"Use it when you talk about a man who is not near you."},{"ar":"هُوَ أَخِي","tr":"huwa akhī","en":"he is my brother","re":true,"note":"هُوَ means \"he\"."},{"ar":"مَنْ هِيَ؟","tr":"man hiya","en":"who is she?","note":"Use it when you talk about a woman who is not near you."},{"ar":"هِيَ أُخْتِي","tr":"hiya ukhtī","en":"she is my sister","re":true,"note":"هِيَ means \"she\"."},{"ar":"مَا شَاءَ اللَّهُ","tr":"mā shāʾa llāhu","en":"what God wills! (said to admire something)","note":"Say it when you like what you see, for example a family photo."}]},{"title":"Do you have...? (عِنْدِي)","body":"Arabic has no word for \"have\". We say عِنْدَ, which means \"at\" or \"with\", and add an ending. عِنْدِي means \"I have\", عِنْدَكَ means \"you have\" (to a man), عِنْدَكِ means \"you have\" (to a woman), عِنْدَهُ means \"he has\" and عِنْدَهَا means \"she has\". To say \"I do not have\", put لَيْسَ before it.","ex":[{"ar":"هَلْ عِنْدَكَ أَخٌ؟","tr":"hal ʿindaka akhun","en":"do you have a brother? (to a man)","note":"هَلْ starts a yes-or-no question, and عِنْدَكَ is for a man."},{"ar":"نَعَمْ، عِنْدِي أَخٌ","tr":"naʿam, ʿindī akhun","en":"yes, I have a brother","re":true,"note":"عِنْدِي means \"I have\"."},{"ar":"هَلْ عِنْدَكِ أُخْتٌ؟","tr":"hal ʿindaki ukhtun","en":"do you have a sister? (to a woman)","note":"عِنْدَكِ is for a woman."},{"ar":"لَا، لَيْسَ عِنْدِي أُخْتٌ","tr":"lā, laysa ʿindī ukhtun","en":"no, I do not have a sister","re":true,"note":"لَيْسَ makes the sentence negative."},{"ar":"عِنْدَهُ ابْنٌ","tr":"ʿindahu ibnun","en":"he has a son","note":"عِنْدَهُ means \"he has\"."},{"ar":"عِنْدَهَا بِنْتٌ","tr":"ʿindahā bintun","en":"she has a daughter","note":"عِنْدَهَا means \"she has\"."}]}],"words":[{"ar":"أَبٌ","pl":"آبَاءٌ","en":"father","type":"noun"},{"ar":"أُمٌّ","pl":"أُمَّهَاتٌ","en":"mother","type":"noun"},{"ar":"أَخٌ","pl":"إِخْوَةٌ","en":"brother","type":"noun"},{"ar":"أُخْتٌ","pl":"أَخَوَاتٌ","en":"sister","type":"noun"},{"ar":"اِبْنٌ","pl":"أَبْنَاءٌ","en":"son","type":"noun"},{"ar":"بِنْتٌ","pl":"بَنَاتٌ","en":"daughter, girl","type":"noun"},{"ar":"جَدٌّ","pl":"أَجْدَادٌ","en":"grandfather","type":"noun"},{"ar":"جَدَّةٌ","pl":"جَدَّاتٌ","en":"grandmother","type":"noun"},{"ar":"عَمٌّ","pl":"أَعْمَامٌ","en":"paternal uncle","type":"noun"},{"ar":"خَالٌ","pl":"أَخْوَالٌ","en":"maternal uncle","type":"noun"},{"ar":"زَوْجٌ","pl":"أَزْوَاجٌ","en":"husband","type":"noun"},{"ar":"زَوْجَةٌ","pl":"زَوْجَاتٌ","en":"wife","type":"noun"},{"ar":"وَلَدٌ","pl":"أَوْلَادٌ","en":"boy, child","type":"noun"},{"ar":"أُسْرَةٌ","pl":"أُسَرٌ","en":"family","type":"noun"},{"ar":"عِنْدَ","pl":"","en":"at, with (used to say \"to have\")","type":"preposition"},{"ar":"لَيْسَ","pl":"","en":"is not, does not","type":"verb"}],"qs":[{"q":"Which word means \"father\"?","a":"أَبٌ","w":["أَخٌ","جَدٌّ"]},{"q":"Which word means \"mother\"?","a":"أُمٌّ","w":["أُخْتٌ","جَدَّةٌ"]},{"q":"Which word means \"brother\"?","a":"أَخٌ","w":["أَبٌ","عَمٌّ"]},{"q":"Which word means \"sister\"?","a":"أُخْتٌ","w":["أُمٌّ","بِنْتٌ"]},{"q":"Which word means \"son\"?","a":"اِبْنٌ","w":["أَبٌ","وَلَدٌ"]},{"q":"Which word means \"daughter\"?","a":"بِنْتٌ","w":["أُخْتٌ","زَوْجَةٌ"]},{"q":"Which word means \"grandfather\"?","a":"جَدٌّ","w":["أَبٌ","عَمٌّ"]},{"q":"Which word means \"grandmother\"?","a":"جَدَّةٌ","w":["أُمٌّ","زَوْجَةٌ"]},{"q":"Which word means \"wife\"?","a":"زَوْجَةٌ","w":["أُخْتٌ","بِنْتٌ"]},{"q":"Which word means \"husband\"?","a":"زَوْجٌ","w":["أَخٌ","خَالٌ"]},{"q":"Which word means \"family\"?","a":"أُسْرَةٌ","w":["مَدْرَسَةٌ","مَكْتَبَةٌ"]},{"q":"What is the plural of أَخٌ?","a":"إِخْوَةٌ","w":["أَخَوَاتٌ","آبَاءٌ"]},{"q":"What is the plural of بِنْتٌ?","a":"بَنَاتٌ","w":["أَبْنَاءٌ","أُمَّهَاتٌ"]},{"q":"How do you say \"my father\"?","a":"أَبِي","w":["أَبُوكَ","أُمِّي"]},{"q":"How do you say \"my mother\"?","a":"أُمِّي","w":["أَبِي","أُخْتِي"]},{"q":"How do you say \"my sister\"?","a":"أُخْتِي","w":["أَخِي","جَدَّتِي"]},{"q":"How do you say \"my grandmother\"?","a":"جَدَّتِي","w":["جَدِّي","أُمِّي"]},{"q":"How do you say \"my wife\"?","a":"زَوْجَتِي","w":["زَوْجِي","أُسْرَتِي"]},{"q":"How do you say \"his book\"?","a":"كِتَابُهُ","w":["كِتَابُهَا","كِتَابُكَ"]},{"q":"How do you say \"her book\"?","a":"كِتَابُهَا","w":["كِتَابُهُ","كِتَابِي"]},{"q":"How do you say \"his name is Muhammad\"?","a":"اِسْمُهُ مُحَمَّدٌ","w":["اِسْمُهَا مُحَمَّدٌ","اِسْمِي مُحَمَّدٌ"]},{"q":"How do you say \"her name is Fatima\"?","a":"اِسْمُهَا فَاطِمَةُ","w":["اِسْمُهُ فَاطِمَةُ","اِسْمُكِ فَاطِمَةُ"]},{"q":"How do you ask \"Who is this?\" about a man?","a":"مَنْ هَذَا؟","w":["مَا هَذَا؟","أَيْنَ هَذَا؟"]},{"q":"How do you ask \"Who is she?\"","a":"مَنْ هِيَ؟","w":["مَنْ هُوَ؟","مَا هِيَ؟"]},{"q":"How do you say \"I have a brother\"?","a":"عِنْدِي أَخٌ","w":["عِنْدَكَ أَخٌ","عِنْدَهَا أَخٌ"]},{"q":"How do you ask a man \"Do you have a sister?\"","a":"هَلْ عِنْدَكَ أُخْتٌ؟","w":["هَلْ عِنْدَكِ أُخْتٌ؟","هَلْ عِنْدِي أُخْتٌ؟"]},{"q":"How do you say \"I do not have a sister\"?","a":"لَيْسَ عِنْدِي أُخْتٌ","w":["عِنْدِي أُخْتٌ","لَيْسَ عِنْدَهَا أُخْتٌ"]},{"q":"How do you say \"she has a daughter\"?","a":"عِنْدَهَا بِنْتٌ","w":["عِنْدَهُ بِنْتٌ","عِنْدِي بِنْتٌ"]}],"conv":{"title":"مُحَادَثَةٌ: خَالِدٌ وَسَارَةُ وَصُورَةُ الأُسْرَةِ","lines":[{"w":"m","n":"خَالِدٌ","ar":"السَّلَامُ عَلَيْكُمْ. كَيْفَ حَالُكِ؟"},{"w":"f","n":"سَارَةُ","ar":"وَعَلَيْكُمُ السَّلَامُ. بِخَيْرٍ، الحَمْدُ لِلَّهِ. وَأَنْتَ؟"},{"w":"m","n":"خَالِدٌ","ar":"بِخَيْرٍ، شُكْرًا. مَنْ هَذَا؟"},{"w":"f","n":"سَارَةُ","ar":"هَذَا أَبِي. اِسْمُهُ مُحَمَّدٌ."},{"w":"m","n":"خَالِدٌ","ar":"وَمَنْ هَذِهِ؟"},{"w":"f","n":"سَارَةُ","ar":"هَذِهِ أُمِّي. اِسْمُهَا فَاطِمَةُ."},{"w":"m","n":"خَالِدٌ","ar":"هَلْ عِنْدَكِ أَخٌ؟"},{"w":"f","n":"سَارَةُ","ar":"نَعَمْ، عِنْدِي أَخٌ. اِسْمُهُ عُمَرُ."},{"w":"m","n":"خَالِدٌ","ar":"وَهَلْ عِنْدَكِ أُخْتٌ؟"},{"w":"f","n":"سَارَةُ","ar":"لَا، لَيْسَ عِنْدِي أُخْتٌ. وَهَلْ عِنْدَكَ أُخْتٌ؟"},{"w":"m","n":"خَالِدٌ","ar":"نَعَمْ، عِنْدِي أُخْتٌ. اِسْمُهَا مَرْيَمُ."},{"w":"f","n":"سَارَةُ","ar":"وَمَنْ هَذَا؟"},{"w":"m","n":"خَالِدٌ","ar":"هَذَا جَدِّي، وَهَذِهِ جَدَّتِي."},{"w":"f","n":"سَارَةُ","ar":"مَا شَاءَ اللَّهُ!"},{"w":"m","n":"خَالِدٌ","ar":"شُكْرًا. مَعَ السَّلَامَةِ."},{"w":"f","n":"سَارَةُ","ar":"مَعَ السَّلَامَةِ."}],"qs":[{"q":"What is Sara's father's name?","a":"مُحَمَّدٌ","w":["عُمَرُ","خَالِدٌ"]},{"q":"What is Sara's mother's name?","a":"فَاطِمَةُ","w":["مَرْيَمُ","سَارَةُ"]},{"q":"What is Sara's brother's name?","a":"عُمَرُ","w":["مُحَمَّدٌ","خَالِدٌ"]},{"q":"What is Khalid's sister's name?","a":"مَرْيَمُ","w":["فَاطِمَةُ","سَارَةُ"]},{"q":"What does Khalid ask Sara about her brother?","a":"هَلْ عِنْدَكِ أَخٌ؟","w":["هَلْ عِنْدَكِ أُخْتٌ؟","مَنْ هَذَا؟"]},{"q":"What does Sara answer about a sister?","a":"لَا، لَيْسَ عِنْدِي أُخْتٌ","w":["نَعَمْ، عِنْدِي أُخْتٌ","نَعَمْ، عِنْدِي أَخٌ"]},{"q":"What does Khalid answer when Sara asks if he has a sister?","a":"نَعَمْ، عِنْدِي أُخْتٌ","w":["لَا، لَيْسَ عِنْدِي أُخْتٌ","نَعَمْ، عِنْدِي أَخٌ"]},{"q":"Who does Sara say is in the first photo?","a":"هَذَا أَبِي","w":["هَذَا جَدِّي","هَذَا أَخِي"]},{"q":"Who does Khalid show at the end?","a":"جَدِّي وَجَدَّتِي","w":["أَبِي وَأُمِّي","أَخِي وَأُخْتِي"]},{"q":"How does Sara greet Khalid back?","a":"وَعَلَيْكُمُ السَّلَامُ","w":["مَعَ السَّلَامَةِ","عَفْوًا"]},{"q":"What does Sara say when she sees the grandparents?","a":"مَا شَاءَ اللَّهُ","w":["لَا بَأْسَ","مَرْحَبًا"]},{"q":"How does Khalid say goodbye?","a":"مَعَ السَّلَامَةِ","w":["صَبَاحُ الخَيْرِ","أَهْلًا وَسَهْلًا"]}]},"id":"1-1-4"},{"stage":1,"level":1,"order":8,"titleAr":"الطَّعَامُ وَالشَّرَابُ","titleEn":"Food and Drink","about":"Order food and talk about what you like. You will learn common foods and drinks, how to say أُرِيدُ (I want) and أُحِبُّ (I like), how to say you are hungry or thirsty, and polite words for ordering.","rules":[{"title":"Food (الطَّعَامُ)","body":"طَعَامٌ means \"food\". Learn the foods of a simple meal. Point at each one with هَذَا for a masculine word and هَذِهِ for a feminine word. Most food words are masculine.","ex":[{"ar":"هَذَا خُبْزٌ","tr":"hādhā khubzun","en":"this is bread","note":"خُبْزٌ is masculine."},{"ar":"هَذَا أَرُزٌّ","tr":"hādhā aruzzun","en":"this is rice","note":"The doubled ز stays doubled."},{"ar":"هَذَا لَحْمٌ","tr":"hādhā laḥmun","en":"this is meat","note":"لَحْمٌ is meat in general."},{"ar":"هَذَا دَجَاجٌ","tr":"hādhā dajājun","en":"this is chicken","note":"دَجَاجٌ is chicken meat."},{"ar":"هَذَا سَمَكٌ","tr":"hādhā samakun","en":"this is fish","note":"سَمَكٌ is fish."},{"ar":"هَذَا تَمْرٌ","tr":"hādhā tamrun","en":"these are dates","note":"تَمْرٌ is dates. In Arabia it is a very common food."},{"ar":"هَذِهِ بَيْضَةٌ","tr":"hādhihi bayḍatun","en":"this is an egg","note":"بَيْضَةٌ is feminine. Its plural is بَيْضٌ."},{"ar":"هَذِهِ تُفَّاحَةٌ","tr":"hādhihi tuffāḥatun","en":"this is an apple","note":"تُفَّاحَةٌ is one apple. The group word is تُفَّاحٌ."}]},{"title":"Drinks (المَشْرُوبَاتُ)","body":"شَرَابٌ means \"a drink\". Many drink words are masculine. قَهْوَةٌ ends with ـَةٌ so it is feminine.","ex":[{"ar":"هَذَا مَاءٌ","tr":"hādhā māʾun","en":"this is water","note":"You learned مَاءٌ in Unit 2."},{"ar":"هَذَا حَلِيبٌ","tr":"hādhā ḥalībun","en":"this is milk","note":"حَلِيبٌ is milk."},{"ar":"هَذَا شَايٌ","tr":"hādhā shāyun","en":"this is tea","note":"شَايٌ is tea."},{"ar":"هَذِهِ قَهْوَةٌ","tr":"hādhihi qahwatun","en":"this is coffee","note":"قَهْوَةٌ is feminine."},{"ar":"هَذَا عَصِيرٌ","tr":"hādhā ʿaṣīrun","en":"this is juice","note":"عَصِيرٌ is juice."},{"ar":"هَذَا عَصِيرُ بُرْتُقَالٍ","tr":"hādhā ʿaṣīru burtuqālin","en":"this is orange juice","note":"Put two nouns together to say \"juice of oranges\". The first has no tanween."}]},{"title":"I want and I like (أُرِيدُ وَأُحِبُّ)","body":"You know أُرِيدُ (I want). Learn أُحِبُّ, which means \"I like\" or \"I love\". To say \"I do not like\", put لَا before it. The thing you want ends with ـً. The thing you like does not.","ex":[{"ar":"أُرِيدُ خُبْزًا","tr":"urīdu khubzan","en":"I want bread","note":"خُبْزٌ becomes خُبْزًا after أُرِيدُ."},{"ar":"أُرِيدُ قَهْوَةً","tr":"urīdu qahwatan","en":"I want coffee","note":"قَهْوَةٌ becomes قَهْوَةً after أُرِيدُ."},{"ar":"أُحِبُّ الشَّايَ","tr":"uḥibbu sh-shāya","en":"I like tea","note":"After أُحِبُّ, the noun with ال ends with ـَ."},{"ar":"أُحِبُّ التَّمْرَ","tr":"uḥibbu t-tamra","en":"I like dates","note":"Again the noun with ال ends with ـَ."},{"ar":"لَا أُحِبُّ السَّمَكَ","tr":"lā uḥibbu s-samaka","en":"I do not like fish","note":"لَا before the verb makes it negative."},{"ar":"هَلْ تُحِبُّ القَهْوَةَ؟","tr":"hal tuḥibbu l-qahwata","en":"do you like coffee? (to a man)","note":"تُحِبُّ means \"you like\"."},{"ar":"نَعَمْ، أُحِبُّهَا","tr":"naʿam, uḥibbuhā","en":"yes, I like it","re":true,"note":"ـهَا at the end means \"it\" for a feminine word like قَهْوَةٌ."},{"ar":"هَلْ تُحِبِّينَ القَهْوَةَ؟","tr":"hal tuḥibbīna l-qahwata","en":"do you like coffee? (to a woman)","note":"For a woman, تُحِبُّ becomes تُحِبِّينَ."},{"ar":"لَا، لَا أُحِبُّهَا","tr":"lā, lā uḥibbuhā","en":"no, I do not like it","re":true,"note":"The first لَا means \"no\" and the second makes the verb negative."},{"ar":"هَلْ تُرِيدُ شَايًا؟","tr":"hal turīdu shāyan","en":"do you want tea? (to a man)","note":"تُرِيدُ means \"you want\" (to a man)."},{"ar":"هَلْ تُرِيدِينَ شَايًا؟","tr":"hal turīdīna shāyan","en":"do you want tea? (to a woman)","note":"For a woman, add ـِينَ: تُرِيدِينَ."}]},{"title":"Hungry and thirsty (جَائِعٌ وَعَطْشَانُ)","body":"In Arabic, you say \"I am hungry\" with the describing word جَائِعٌ. For a woman, add ـَةٌ: جَائِعَةٌ. \"Thirsty\" is عَطْشَانُ for a man and عَطْشَى for a woman.","ex":[{"ar":"أَنَا جَائِعٌ","tr":"anā jāʾiʿun","en":"I am hungry (a man)","note":"جَائِعٌ is for a man."},{"ar":"أَنَا جَائِعَةٌ","tr":"anā jāʾiʿatun","en":"I am hungry (a woman)","note":"جَائِعَةٌ is for a woman."},{"ar":"أَنَا عَطْشَانُ","tr":"anā ʿaṭshānu","en":"I am thirsty (a man)","note":"عَطْشَانُ has no tanween."},{"ar":"أَنَا عَطْشَى","tr":"anā ʿaṭshā","en":"I am thirsty (a woman)","note":"عَطْشَى is the feminine form."},{"ar":"هَلْ أَنْتَ جَائِعٌ؟","tr":"hal anta jāʾiʿun","en":"are you hungry? (to a man)","note":"Put هَلْ before the sentence to ask a yes-or-no question."},{"ar":"نَعَمْ، أَنَا جَائِعٌ","tr":"naʿam, anā jāʾiʿun","en":"yes, I am hungry","re":true,"note":"Answer with نَعَمْ and the full sentence."},{"ar":"هَلْ أَنْتِ عَطْشَى؟","tr":"hal anti ʿaṭshā","en":"are you thirsty? (to a woman)","note":"Use عَطْشَى for a woman."},{"ar":"لَا، لَسْتُ عَطْشَى","tr":"lā, lastu ʿaṭshā","en":"no, I am not thirsty","re":true,"note":"لَسْتُ means \"I am not\"."}]},{"title":"Ordering politely (الطَّلَبُ بِأَدَبٍ)","body":"Add مِنْ فَضْلِكَ (\"please\", to a man) or مِنْ فَضْلِكِ (\"please\", to a woman) to be polite. When you hand something over, say تَفَضَّلْ to a man and تَفَضَّلِي to a woman. Use مَعَ for \"with\" and بِدُونِ for \"without\".","ex":[{"ar":"قَهْوَةٌ مِنْ فَضْلِكَ","tr":"qahwatun min faḍlika","en":"coffee, please (to a man)","note":"مِنْ فَضْلِكَ literally means \"from your kindness\"."},{"ar":"مَاءٌ مِنْ فَضْلِكِ","tr":"māʾun min faḍliki","en":"water, please (to a woman)","note":"مِنْ فَضْلِكِ is for a woman."},{"ar":"تَفَضَّلْ","tr":"tafaḍḍal","en":"here you are (to a man)","note":"Say it when you give something."},{"ar":"شُكْرًا","tr":"shukran","en":"thank you","re":true,"note":"Reply with شُكْرًا."},{"ar":"شَايٌ مَعَ سُكَّرٍ","tr":"shāyun maʿa sukkarin","en":"tea with sugar","note":"سُكَّرٌ is sugar. مَعَ means \"with\"."},{"ar":"قَهْوَةٌ بِدُونِ سُكَّرٍ","tr":"qahwatun bi-dūni sukkarin","en":"coffee without sugar","note":"بِدُونِ means \"without\"."},{"ar":"الطَّعَامُ لَذِيذٌ","tr":"aṭ-ṭaʿāmu ladhīdhun","en":"the food is delicious","note":"لَذِيذٌ means \"delicious\". With ال only on the noun, it is a sentence."},{"ar":"القَهْوَةُ لَذِيذَةٌ","tr":"al-qahwatu ladhīdhatun","en":"the coffee is delicious","note":"قَهْوَةٌ is feminine, so we add ـَةٌ to لَذِيذٌ."}]}],"words":[{"ar":"طَعَامٌ","pl":"أَطْعِمَةٌ","en":"food","type":"noun"},{"ar":"شَرَابٌ","pl":"أَشْرِبَةٌ","en":"drink","type":"noun"},{"ar":"خُبْزٌ","pl":"","en":"bread","type":"noun"},{"ar":"أَرُزٌّ","pl":"","en":"rice","type":"noun"},{"ar":"لَحْمٌ","pl":"لُحُومٌ","en":"meat","type":"noun"},{"ar":"دَجَاجٌ","pl":"","en":"chicken","type":"noun"},{"ar":"سَمَكٌ","pl":"أَسْمَاكٌ","en":"fish","type":"noun"},{"ar":"تَمْرٌ","pl":"تُمُورٌ","en":"dates","type":"noun"},{"ar":"بَيْضَةٌ","pl":"بَيْضٌ","en":"egg","type":"noun"},{"ar":"تُفَّاحَةٌ","pl":"تُفَّاحٌ","en":"apple","type":"noun"},{"ar":"بُرْتُقَالٌ","pl":"","en":"orange","type":"noun"},{"ar":"حَلِيبٌ","pl":"","en":"milk","type":"noun"},{"ar":"شَايٌ","pl":"","en":"tea","type":"noun"},{"ar":"قَهْوَةٌ","pl":"","en":"coffee","type":"noun"},{"ar":"عَصِيرٌ","pl":"عَصَائِرُ","en":"juice","type":"noun"},{"ar":"سُكَّرٌ","pl":"","en":"sugar","type":"noun"},{"ar":"أُحِبُّ","pl":"","en":"I like, I love","type":"verb"},{"ar":"جَائِعٌ","pl":"جِيَاعٌ","en":"hungry (m)","type":"adjective"},{"ar":"جَائِعَةٌ","pl":"جَائِعَاتٌ","en":"hungry (f)","type":"adjective"},{"ar":"عَطْشَانُ","pl":"عِطَاشٌ","en":"thirsty (m)","type":"adjective"},{"ar":"عَطْشَى","pl":"عَطْشَى","en":"thirsty (f)","type":"adjective"},{"ar":"لَذِيذٌ","pl":"","en":"delicious (m)","type":"adjective"},{"ar":"لَذِيذَةٌ","pl":"","en":"delicious (f)","type":"adjective"},{"ar":"مِنْ فَضْلِكَ","pl":"","en":"please (to a man)","type":"phrase"},{"ar":"تَفَضَّلْ","pl":"","en":"here you are","type":"phrase"},{"ar":"مَعَ","pl":"","en":"with","type":"preposition"},{"ar":"نَادِلٌ","pl":"نُدُلٌ","en":"waiter","type":"noun"},{"ar":"بِدُونِ","pl":"","en":"without","type":"preposition"}],"qs":[{"q":"Which word means \"bread\"?","a":"خُبْزٌ","w":["أَرُزٌّ","لَحْمٌ"]},{"q":"Which word means \"rice\"?","a":"أَرُزٌّ","w":["خُبْزٌ","سَمَكٌ"]},{"q":"Which word means \"meat\"?","a":"لَحْمٌ","w":["دَجَاجٌ","تَمْرٌ"]},{"q":"Which word means \"chicken\"?","a":"دَجَاجٌ","w":["لَحْمٌ","سَمَكٌ"]},{"q":"Which word means \"fish\"?","a":"سَمَكٌ","w":["دَجَاجٌ","تَمْرٌ"]},{"q":"Which word means \"dates\"?","a":"تَمْرٌ","w":["خُبْزٌ","أَرُزٌّ"]},{"q":"Which word means \"egg\"?","a":"بَيْضَةٌ","w":["تُفَّاحَةٌ","قَهْوَةٌ"]},{"q":"Which word means \"apple\"?","a":"تُفَّاحَةٌ","w":["بَيْضَةٌ","بُرْتُقَالٌ"]},{"q":"Which word means \"milk\"?","a":"حَلِيبٌ","w":["عَصِيرٌ","مَاءٌ"]},{"q":"Which word means \"tea\"?","a":"شَايٌ","w":["قَهْوَةٌ","حَلِيبٌ"]},{"q":"Which word means \"coffee\"?","a":"قَهْوَةٌ","w":["شَايٌ","عَصِيرٌ"]},{"q":"Which word means \"juice\"?","a":"عَصِيرٌ","w":["حَلِيبٌ","مَاءٌ"]},{"q":"Which word means \"sugar\"?","a":"سُكَّرٌ","w":["خُبْزٌ","تَمْرٌ"]},{"q":"Which word means \"food\"?","a":"طَعَامٌ","w":["شَرَابٌ","عَصِيرٌ"]},{"q":"Which word means \"delicious\" (m)?","a":"لَذِيذٌ","w":["جَائِعٌ","جَدِيدٌ"]},{"q":"How do you say \"I want bread\"?","a":"أُرِيدُ خُبْزًا","w":["أُرِيدُ خُبْزٌ","أُحِبُّ خُبْزًا"]},{"q":"How do you say \"I want coffee\"?","a":"أُرِيدُ قَهْوَةً","w":["أُرِيدُ قَهْوَةٌ","أُحِبُّ قَهْوَةً"]},{"q":"How do you say \"I like tea\"?","a":"أُحِبُّ الشَّايَ","w":["أُرِيدُ الشَّايَ","لَا أُحِبُّ الشَّايَ"]},{"q":"How do you say \"I do not like fish\"?","a":"لَا أُحِبُّ السَّمَكَ","w":["أُحِبُّ السَّمَكَ","لَا أُرِيدُ السَّمَكَ"]},{"q":"How does a man ask \"Do you like coffee?\"","a":"هَلْ تُحِبُّ القَهْوَةَ؟","w":["هَلْ أُحِبُّ القَهْوَةَ؟","هَلْ هِيَ القَهْوَةُ؟"]},{"q":"How does a man say \"I am hungry\"?","a":"أَنَا جَائِعٌ","w":["أَنَا جَائِعَةٌ","أَنَا عَطْشَانُ"]},{"q":"How does a woman say \"I am hungry\"?","a":"أَنَا جَائِعَةٌ","w":["أَنَا جَائِعٌ","أَنَا عَطْشَى"]},{"q":"How does a man say \"I am thirsty\"?","a":"أَنَا عَطْشَانُ","w":["أَنَا عَطْشَى","أَنَا جَائِعٌ"]},{"q":"How does a woman say \"I am thirsty\"?","a":"أَنَا عَطْشَى","w":["أَنَا عَطْشَانُ","أَنَا جَائِعَةٌ"]},{"q":"How do you ask a man \"Are you hungry?\"","a":"هَلْ أَنْتَ جَائِعٌ؟","w":["هَلْ أَنْتِ جَائِعَةٌ؟","هَلْ هُوَ جَائِعٌ؟"]},{"q":"How do you say \"coffee, please\" to a man?","a":"قَهْوَةٌ مِنْ فَضْلِكَ","w":["قَهْوَةٌ مِنْ فَضْلِكِ","قَهْوَةٌ تَفَضَّلْ"]},{"q":"How do you say \"tea with sugar\"?","a":"شَايٌ مَعَ سُكَّرٍ","w":["شَايٌ بِدُونِ سُكَّرٍ","سُكَّرٌ مَعَ شَايٍ"]},{"q":"How do you say \"coffee without sugar\"?","a":"قَهْوَةٌ بِدُونِ سُكَّرٍ","w":["قَهْوَةٌ مَعَ سُكَّرٍ","سُكَّرٌ بِدُونِ قَهْوَةٍ"]},{"q":"How do you say \"the food is delicious\"?","a":"الطَّعَامُ لَذِيذٌ","w":["الطَّعَامُ لَذِيذَةٌ","الطَّعَامُ اللَّذِيذُ"]},{"q":"How do you say \"the coffee is delicious\"?","a":"القَهْوَةُ لَذِيذَةٌ","w":["القَهْوَةُ لَذِيذٌ","قَهْوَةٌ لَذِيذٌ"]}],"conv":{"title":"مُحَادَثَةٌ: فِي المَطْعَمِ","lines":[{"w":"m","n":"نَادِلٌ","ar":"السَّلَامُ عَلَيْكُمْ. أَهْلًا وَسَهْلًا."},{"w":"f","n":"هِنْدٌ","ar":"وَعَلَيْكُمُ السَّلَامُ. مَرْحَبًا."},{"w":"m","n":"نَادِلٌ","ar":"هَلْ أَنْتِ جَائِعَةٌ؟"},{"w":"f","n":"هِنْدٌ","ar":"نَعَمْ، أَنَا جَائِعَةٌ وَعَطْشَى."},{"w":"m","n":"نَادِلٌ","ar":"هَلْ تُحِبِّينَ الدَّجَاجَ؟"},{"w":"f","n":"هِنْدٌ","ar":"نَعَمْ، أُحِبُّ الدَّجَاجَ. وَلَا أُحِبُّ السَّمَكَ."},{"w":"m","n":"نَادِلٌ","ar":"دَجَاجٌ وَأَرُزٌّ. هَلْ تُرِيدِينَ خُبْزًا؟"},{"w":"f","n":"هِنْدٌ","ar":"نَعَمْ، أُرِيدُ خُبْزًا مِنْ فَضْلِكَ."},{"w":"m","n":"نَادِلٌ","ar":"هَلْ تُرِيدِينَ عَصِيرًا؟"},{"w":"f","n":"هِنْدٌ","ar":"نَعَمْ، عَصِيرُ بُرْتُقَالٍ، مِنْ فَضْلِكَ."},{"w":"m","n":"نَادِلٌ","ar":"تَفَضَّلِي."},{"w":"f","n":"هِنْدٌ","ar":"شُكْرًا. الطَّعَامُ لَذِيذٌ."},{"w":"m","n":"نَادِلٌ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."}],"qs":[{"q":"What does Hind say when the waiter asks if she is hungry?","a":"أَنَا جَائِعَةٌ وَعَطْشَى","w":["أَنَا جَائِعٌ","لَسْتُ جَائِعَةً"]},{"q":"Which food does Hind like?","a":"الدَّجَاجُ","w":["السَّمَكُ","التَّمْرُ"]},{"q":"Which food does Hind not like?","a":"السَّمَكُ","w":["الدَّجَاجُ","الخُبْزُ"]},{"q":"What does the waiter say Hind will eat with the chicken?","a":"أَرُزٌّ","w":["تَمْرٌ","بَيْضٌ"]},{"q":"What does Hind want with the meal?","a":"خُبْزًا","w":["قَهْوَةً","سُكَّرًا"]},{"q":"What drink does Hind order?","a":"عَصِيرُ بُرْتُقَالٍ","w":["شَايٌ","حَلِيبٌ"]},{"q":"What does the waiter say when he serves her?","a":"تَفَضَّلِي","w":["شُكْرًا","مَرْحَبًا"]},{"q":"What does Hind say about the food?","a":"الطَّعَامُ لَذِيذٌ","w":["الطَّعَامُ جَدِيدٌ","الطَّعَامُ كَبِيرٌ"]},{"q":"How does the waiter say goodbye?","a":"مَعَ السَّلَامَةِ","w":["شُكْرًا","مَرْحَبًا"]}]},"id":"1-1-8"},{"stage":1,"level":1,"order":6,"titleAr":"الأَعْدَادُ وَالأَلْوَانُ","titleEn":"Numbers and Colours","about":"Count, describe and shop. You will learn the numbers 1 to 10, the tens, how to ask كَمْ, how to count things and say your age, then the colours, describing words such as big and small, the phrase-versus-sentence rule, and how to ask for something in a shop.","rules":[{"title":"Numbers one to five (مِنْ وَاحِدٍ إِلَى خَمْسَةٍ)","body":"Start with the first five numbers. Say each one slowly and listen to the vowels. Note that \"two\" ends with ـَانِ.","ex":[{"ar":"وَاحِدٌ","tr":"wāḥidun","en":"one","note":"Number 1."},{"ar":"اِثْنَانِ","tr":"ithnāni","en":"two","note":"Number 2. It begins with a hamzat al-wasl, so the first sound is soft."},{"ar":"ثَلَاثَةٌ","tr":"thalāthatun","en":"three","note":"Number 3. The letter ث sounds like \"th\" in \"think\"."},{"ar":"أَرْبَعَةٌ","tr":"arbaʿatun","en":"four","note":"Number 4. It has the letter ع in the middle."},{"ar":"خَمْسَةٌ","tr":"khamsatun","en":"five","note":"Number 5. It begins with the throat sound خ."}]},{"title":"Numbers six to ten (مِنْ سِتَّةٍ إِلَى عَشَرَةٍ)","body":"Now learn six to ten. These end with ـَةٌ like the numbers from three to five.","ex":[{"ar":"سِتَّةٌ","tr":"sittatun","en":"six","note":"Number 6. The ت is doubled."},{"ar":"سَبْعَةٌ","tr":"sabʿatun","en":"seven","note":"Number 7. It has the letter ع in the middle."},{"ar":"ثَمَانِيَةٌ","tr":"thamāniyatun","en":"eight","note":"Number 8. It has a long vowel in the middle."},{"ar":"تِسْعَةٌ","tr":"tisʿatun","en":"nine","note":"Number 9. It begins with ت."},{"ar":"عَشَرَةٌ","tr":"ʿasharatun","en":"ten","note":"Number 10. It begins with the letter ع."}]},{"title":"The tens (العُقُودُ)","body":"To count tens, use these words. The ending ـُونَ is the same sound you used for plural jobs. Put the number after اِسْمُ or after a question to answer how old someone is.","ex":[{"ar":"عِشْرُونَ","tr":"ʿishrūna","en":"twenty","note":"Number 20."},{"ar":"ثَلَاثُونَ","tr":"thalāthūna","en":"thirty","note":"Number 30. It comes from ثَلَاثَةٌ, with ـُونَ added."},{"ar":"أَرْبَعُونَ","tr":"arbaʿūna","en":"forty","note":"Number 40. It comes from أَرْبَعَةٌ."},{"ar":"خَمْسُونَ","tr":"khamsūna","en":"fifty","note":"Number 50. It comes from خَمْسَةٌ."},{"ar":"مِئَةٌ","tr":"miʾatun","en":"one hundred","note":"Number 100. The word is spelled مِائَةٌ in many books."}]},{"title":"How many? (كَمْ؟)","body":"Use كَمْ to ask about a number. After كَمْ, the thing you count ends with ـًا (tanween fatha). Answer with a number and the thing.","ex":[{"ar":"كَمْ كِتَابًا عِنْدَكَ؟","tr":"kam kitāban ʿindaka","en":"how many books do you have?","note":"كِتَابًا ends with ـًا after كَمْ."},{"ar":"عِنْدِي خَمْسَةُ كُتُبٍ","tr":"ʿindī khamsatu kutubin","en":"I have five books","re":true,"note":"كُتُبٌ is the plural of كِتَابٌ."},{"ar":"كَمْ طَالِبًا فِي الفَصْلِ؟","tr":"kam ṭāliban fī l-faṣli","en":"how many students are in the class?","note":"فِي الفَصْلِ means \"in the class\"."},{"ar":"فِي الفَصْلِ عَشَرَةُ طُلَّابٍ","tr":"fī l-faṣli ʿasharatu ṭullābin","en":"there are ten students in the class","re":true,"note":"طُلَّابٌ is the plural of طَالِبٌ."},{"ar":"كَمِ السَّاعَةُ؟","tr":"kami s-sāʿatu","en":"what time is it?","note":"السَّاعَةُ means \"the hour\" or \"the clock\"."},{"ar":"السَّاعَةُ الثَّالِثَةُ","tr":"as-sāʿatu th-thālithatu","en":"it is three o'clock","re":true,"note":"For time, use the ordinal form: الثَّالِثَةُ is \"the third\"."}]},{"title":"Counting things (عَدُّ الأَشْيَاءِ)","body":"For one and two, the number comes after the thing: كِتَابٌ وَاحِدٌ (one book), كِتَابَانِ (two books). From three to ten, the number comes first and the thing is plural. For a masculine thing, the number keeps ـَةٌ. For a feminine thing, the number drops it: ثَلَاثَةُ كُتُبٍ but ثَلَاثُ طَالِبَاتٍ.","ex":[{"ar":"كِتَابٌ وَاحِدٌ","tr":"kitābun wāḥidun","en":"one book","note":"With one, the number comes after the thing."},{"ar":"كِتَابَانِ","tr":"kitābāni","en":"two books","note":"For two, just add ـَانِ to the thing."},{"ar":"ثَلَاثَةُ كُتُبٍ","tr":"thalāthatu kutubin","en":"three books","note":"كِتَابٌ is masculine, so the number keeps ـَةٌ."},{"ar":"ثَلَاثُ طَالِبَاتٍ","tr":"thalāthu ṭālibātin","en":"three students (girls)","note":"طَالِبَةٌ is feminine, so the number drops ـَةٌ."},{"ar":"أَرْبَعَةُ أَقْلَامٍ","tr":"arbaʿatu aqlāmin","en":"four pens","note":"قَلَمٌ is masculine and its plural is أَقْلَامٌ."},{"ar":"خَمْسُ سَيَّارَاتٍ","tr":"khamsu sayyārātin","en":"five cars","note":"سَيَّارَةٌ is feminine, so خَمْسَةٌ becomes خَمْسُ."},{"ar":"عَشَرَةُ أَوْلَادٍ","tr":"ʿasharatu awlādin","en":"ten boys","note":"وَلَدٌ is masculine."},{"ar":"عَشْرُ بَنَاتٍ","tr":"ʿashru banātin","en":"ten girls","note":"بِنْتٌ is feminine, so عَشَرَةٌ becomes عَشْرُ."}]},{"title":"How old are you? (كَمْ عُمْرُكَ؟)","body":"عُمْرٌ means \"age\". Ask a man كَمْ عُمْرُكَ؟ and ask a woman كَمْ عُمْرُكِ؟ Answer عُمْرِي and a number, then سَنَةً (year). سَنَةٌ ends with ـً after the number.","ex":[{"ar":"كَمْ عُمْرُكَ؟","tr":"kam ʿumruka","en":"how old are you? (to a man)","note":"ـكَ is for a man."},{"ar":"عُمْرِي عِشْرُونَ سَنَةً","tr":"ʿumrī ʿishrūna sanatan","en":"I am twenty years old","re":true,"note":"Literally \"my age is twenty years\"."},{"ar":"كَمْ عُمْرُكِ؟","tr":"kam ʿumruki","en":"how old are you? (to a woman)","note":"ـكِ is for a woman."},{"ar":"عُمْرِي ثَلَاثُونَ سَنَةً","tr":"ʿumrī thalāthūna sanatan","en":"I am thirty years old","re":true,"note":"Put the number before سَنَةً."},{"ar":"كَمْ عُمْرُهُ؟","tr":"kam ʿumruhu","en":"how old is he?","note":"ـهُ means \"his\"."},{"ar":"عُمْرُهُ أَرْبَعُونَ سَنَةً","tr":"ʿumruhu arbaʿūna sanatan","en":"he is forty years old","re":true,"note":"Replace ـِي with ـهُ for \"his\"."},{"ar":"كَمْ عُمْرُهَا؟","tr":"kam ʿumruhā","en":"how old is she?","note":"ـهَا means \"her\"."},{"ar":"عُمْرُهَا خَمْسُونَ سَنَةً","tr":"ʿumruhā khamsūna sanatan","en":"she is fifty years old","re":true,"note":"Replace ـِي with ـهَا for \"her\"."}]},{"title":"The colours for masculine nouns (الأَلْوَانُ)","body":"Colour words are describing words. In Arabic, a describing word comes AFTER the noun it describes. Most colours start with أَ for a masculine noun. Notice that these colour words end with ـُ, not ـٌ, because they take no tanween.","ex":[{"ar":"كِتَابٌ أَحْمَرُ","tr":"kitābun aḥmaru","en":"a red book","note":"أَحْمَرُ is \"red\". It comes after كِتَابٌ."},{"ar":"قَلَمٌ أَزْرَقُ","tr":"qalamun azraqu","en":"a blue pen","note":"أَزْرَقُ is \"blue\"."},{"ar":"بَابٌ أَخْضَرُ","tr":"bābun akhḍaru","en":"a green door","note":"أَخْضَرُ is \"green\"."},{"ar":"بَيْتٌ أَبْيَضُ","tr":"baytun abyaḍu","en":"a white house","note":"أَبْيَضُ is \"white\"."},{"ar":"ثَوْبٌ أَسْوَدُ","tr":"thawbun aswadu","en":"a black thobe","note":"أَسْوَدُ is \"black\". ثَوْبٌ is the long robe."},{"ar":"دَفْتَرٌ أَصْفَرُ","tr":"daftarun aṣfaru","en":"a yellow notebook","note":"أَصْفَرُ is \"yellow\"."}]},{"title":"The colours for feminine nouns (أَلْوَانُ المُؤَنَّثِ)","body":"For a feminine noun, the colour changes its shape. Learn each pair together. The feminine colour also ends with ـُ and no tanween.","ex":[{"ar":"سَيَّارَةٌ حَمْرَاءُ","tr":"sayyāratun ḥamrāʾu","en":"a red car","note":"حَمْرَاءُ is the feminine of أَحْمَرُ."},{"ar":"حَقِيبَةٌ زَرْقَاءُ","tr":"ḥaqībatun zarqāʾu","en":"a blue bag","note":"زَرْقَاءُ is the feminine of أَزْرَقُ."},{"ar":"نَافِذَةٌ خَضْرَاءُ","tr":"nāfidhatun khaḍrāʾu","en":"a green window","note":"خَضْرَاءُ is the feminine of أَخْضَرُ."},{"ar":"وَرْدَةٌ بَيْضَاءُ","tr":"wardatun bayḍāʾu","en":"a white rose","note":"وَرْدَةٌ is a rose. بَيْضَاءُ is the feminine of أَبْيَضُ."},{"ar":"طَاوِلَةٌ سَوْدَاءُ","tr":"ṭāwilatun sawdāʾu","en":"a black table","note":"سَوْدَاءُ is the feminine of أَسْوَدُ."},{"ar":"وَرْدَةٌ صَفْرَاءُ","tr":"wardatun ṣafrāʾu","en":"a yellow rose","note":"صَفْرَاءُ is the feminine of أَصْفَرُ."}]},{"title":"Big, small, new and old (كَبِيرٌ وَصَغِيرٌ)","body":"These describing words end with ـٌ because they take tanween. Add ـَةٌ for a feminine noun: كَبِيرٌ becomes كَبِيرَةٌ. Always put the describing word after the noun.","ex":[{"ar":"بَيْتٌ كَبِيرٌ","tr":"baytun kabīrun","en":"a big house","note":"كَبِيرٌ means \"big\"."},{"ar":"مَدْرَسَةٌ كَبِيرَةٌ","tr":"madrasatun kabīratun","en":"a big school","note":"مَدْرَسَةٌ is feminine, so we add ـَةٌ."},{"ar":"كِتَابٌ صَغِيرٌ","tr":"kitābun ṣaghīrun","en":"a small book","note":"صَغِيرٌ means \"small\"."},{"ar":"حَقِيبَةٌ صَغِيرَةٌ","tr":"ḥaqībatun ṣaghīratun","en":"a small bag","note":"حَقِيبَةٌ is feminine."},{"ar":"سَيَّارَةٌ جَدِيدَةٌ","tr":"sayyāratun jadīdatun","en":"a new car","note":"جَدِيدٌ means \"new\" and جَدِيدَةٌ is feminine."},{"ar":"كِتَابٌ قَدِيمٌ","tr":"kitābun qadīmun","en":"an old book","note":"قَدِيمٌ means \"old\" for things, not for people."},{"ar":"وَرْدَةٌ جَمِيلَةٌ","tr":"wardatun jamīlatun","en":"a beautiful rose","note":"جَمِيلٌ means \"beautiful\"."},{"ar":"رَجُلٌ طَوِيلٌ","tr":"rajulun ṭawīlun","en":"a tall man","note":"رَجُلٌ is a man. طَوِيلٌ means \"tall\" or \"long\"."}]},{"title":"A phrase and a sentence (العِبَارَةُ وَالجُمْلَةُ)","body":"There is one very important rule. With ال on BOTH words, you get a phrase: الكِتَابُ الجَدِيدُ means \"the new book\". With ال only on the noun, you get a full sentence: الكِتَابُ جَدِيدٌ means \"the book is new\". Arabic has no word for \"is\" here.","ex":[{"ar":"الكِتَابُ الجَدِيدُ","tr":"al-kitābu l-jadīdu","en":"the new book","note":"ال on both words makes a phrase."},{"ar":"الكِتَابُ جَدِيدٌ","tr":"al-kitābu jadīdun","en":"the book is new","note":"ال only on the first word makes a sentence."},{"ar":"السَّيَّارَةُ الحَمْرَاءُ","tr":"as-sayyāratu l-ḥamrāʾu","en":"the red car","note":"Both words have ال, so it is a phrase."},{"ar":"السَّيَّارَةُ حَمْرَاءُ","tr":"as-sayyāratu ḥamrāʾu","en":"the car is red","note":"Only the first word has ال, so it is a sentence."},{"ar":"البَيْتُ كَبِيرٌ","tr":"al-baytu kabīrun","en":"the house is big","note":"A sentence about one thing."},{"ar":"البَيْتُ الكَبِيرُ","tr":"al-baytu l-kabīru","en":"the big house","note":"The same two words, now a phrase."}]},{"title":"What colour is it? (مَا لَوْنُهُ؟)","body":"لَوْنٌ means \"colour\". To ask the colour of something masculine, say مَا لَوْنُ plus the thing, or مَا لَوْنُهُ؟ for \"what is its colour?\" For something feminine, say مَا لَوْنُهَا؟ Answer with the colour that agrees with the thing.","ex":[{"ar":"مَا لَوْنُ الكِتَابِ؟","tr":"mā lawnu l-kitābi","en":"what is the colour of the book?","note":"كِتَابٌ becomes الكِتَابِ after لَوْنُ."},{"ar":"لَوْنُهُ أَحْمَرُ","tr":"lawnuhu aḥmaru","en":"its colour is red","re":true,"note":"ـهُ is for a masculine thing."},{"ar":"مَا لَوْنُ السَّيَّارَةِ؟","tr":"mā lawnu s-sayyārati","en":"what is the colour of the car?","note":"سَيَّارَةٌ becomes السَّيَّارَةِ after لَوْنُ."},{"ar":"لَوْنُهَا أَزْرَقُ","tr":"lawnuhā azraqu","en":"its colour is blue","re":true,"note":"لَوْنُهَا is for a feminine thing. The colour word أَزْرَقُ can stay the same here because لَوْنٌ is the masculine word being described."},{"ar":"مَا لَوْنُهُ؟","tr":"mā lawnuhu","en":"what colour is it? (masculine)","note":"Ask it about a masculine thing."},{"ar":"لَوْنُهُ أَخْضَرُ","tr":"lawnuhu akhḍaru","en":"it is green","re":true,"note":"A masculine colour word."},{"ar":"مَا لَوْنُهَا؟","tr":"mā lawnuhā","en":"what colour is it? (feminine)","note":"Ask it about a feminine thing."},{"ar":"لَوْنُهَا أَبْيَضُ","tr":"lawnuhā abyaḍu","en":"it is white","re":true,"note":"The colour word أَبْيَضُ stays masculine after لَوْنُ."}]},{"title":"In the shop (فِي المَحَلِّ)","body":"Use أُرِيدُ to say \"I want\". A seller is بَائِعٌ and the money in Saudi Arabia is the رِيَالٌ. Ask the price with كَمْ هُوَ؟ for a masculine thing and كَمْ هِيَ؟ for a feminine thing. After a number from three to ten, the thing is plural, so رِيَالٌ becomes رِيَالَاتٌ.","ex":[{"ar":"أُرِيدُ حَقِيبَةً","tr":"urīdu ḥaqībatan","en":"I want a bag","note":"أُرِيدُ means \"I want\". The thing wanted ends with ـً."},{"ar":"أُرِيدُ كِتَابًا جَدِيدًا","tr":"urīdu kitāban jadīdan","en":"I want a new book","note":"The describing word also ends with ـً, to match the book."},{"ar":"كَمْ هُوَ؟","tr":"kam huwa","en":"how much is it? (masculine)","note":"Use it for a book, a pen or a house."},{"ar":"خَمْسَةُ رِيَالَاتٍ","tr":"khamsatu riyālātin","en":"five riyals","re":true,"note":"A number from three to ten is followed by a plural."},{"ar":"كَمْ هِيَ؟","tr":"kam hiya","en":"how much is it? (feminine)","note":"Use it for a bag, a car or a rose."},{"ar":"عَشَرَةُ رِيَالَاتٍ","tr":"ʿasharatu riyālātin","en":"ten riyals","re":true,"note":"عَشَرَةُ is the number ten."}]}],"words":[{"ar":"وَاحِدٌ","pl":"","en":"one","type":"number"},{"ar":"اِثْنَانِ","pl":"","en":"two","type":"number"},{"ar":"ثَلَاثَةٌ","pl":"","en":"three","type":"number"},{"ar":"أَرْبَعَةٌ","pl":"","en":"four","type":"number"},{"ar":"خَمْسَةٌ","pl":"","en":"five","type":"number"},{"ar":"سِتَّةٌ","pl":"","en":"six","type":"number"},{"ar":"سَبْعَةٌ","pl":"","en":"seven","type":"number"},{"ar":"ثَمَانِيَةٌ","pl":"","en":"eight","type":"number"},{"ar":"تِسْعَةٌ","pl":"","en":"nine","type":"number"},{"ar":"عَشَرَةٌ","pl":"","en":"ten","type":"number"},{"ar":"عِشْرُونَ","pl":"","en":"twenty","type":"number"},{"ar":"ثَلَاثُونَ","pl":"","en":"thirty","type":"number"},{"ar":"أَرْبَعُونَ","pl":"","en":"forty","type":"number"},{"ar":"خَمْسُونَ","pl":"","en":"fifty","type":"number"},{"ar":"مِئَةٌ","pl":"","en":"one hundred","type":"number"},{"ar":"سَنَةٌ","pl":"سَنَوَاتٌ","en":"year","type":"noun"},{"ar":"سَيَّارَةٌ","pl":"سَيَّارَاتٌ","en":"car","type":"noun"},{"ar":"أَحْمَرُ","pl":"حُمْرٌ","en":"red (m)","type":"adjective"},{"ar":"حَمْرَاءُ","pl":"حُمْرٌ","en":"red (f)","type":"adjective"},{"ar":"أَزْرَقُ","pl":"زُرْقٌ","en":"blue (m)","type":"adjective"},{"ar":"زَرْقَاءُ","pl":"زُرْقٌ","en":"blue (f)","type":"adjective"},{"ar":"أَخْضَرُ","pl":"خُضْرٌ","en":"green (m)","type":"adjective"},{"ar":"خَضْرَاءُ","pl":"خُضْرٌ","en":"green (f)","type":"adjective"},{"ar":"أَبْيَضُ","pl":"بِيضٌ","en":"white (m)","type":"adjective"},{"ar":"بَيْضَاءُ","pl":"بِيضٌ","en":"white (f)","type":"adjective"},{"ar":"أَسْوَدُ","pl":"سُودٌ","en":"black (m)","type":"adjective"},{"ar":"سَوْدَاءُ","pl":"سُودٌ","en":"black (f)","type":"adjective"},{"ar":"أَصْفَرُ","pl":"صُفْرٌ","en":"yellow (m)","type":"adjective"},{"ar":"صَفْرَاءُ","pl":"صُفْرٌ","en":"yellow (f)","type":"adjective"},{"ar":"كَبِيرٌ","pl":"كِبَارٌ","en":"big (m)","type":"adjective"},{"ar":"كَبِيرَةٌ","pl":"كَبِيرَاتٌ","en":"big (f)","type":"adjective"},{"ar":"صَغِيرٌ","pl":"صِغَارٌ","en":"small (m)","type":"adjective"},{"ar":"صَغِيرَةٌ","pl":"صَغِيرَاتٌ","en":"small (f)","type":"adjective"},{"ar":"جَدِيدٌ","pl":"جُدُدٌ","en":"new (m)","type":"adjective"},{"ar":"جَدِيدَةٌ","pl":"جَدِيدَاتٌ","en":"new (f)","type":"adjective"},{"ar":"قَدِيمٌ","pl":"قُدَمَاءُ","en":"old (m)","type":"adjective"},{"ar":"جَمِيلٌ","pl":"","en":"beautiful (m)","type":"adjective"},{"ar":"جَمِيلَةٌ","pl":"جَمِيلَاتٌ","en":"beautiful (f)","type":"adjective"},{"ar":"طَوِيلٌ","pl":"طِوَالٌ","en":"tall, long (m)","type":"adjective"},{"ar":"لَوْنٌ","pl":"أَلْوَانٌ","en":"colour","type":"noun"},{"ar":"بَيْتٌ","pl":"بُيُوتٌ","en":"house","type":"noun"},{"ar":"ثَوْبٌ","pl":"ثِيَابٌ","en":"thobe, garment","type":"noun"},{"ar":"وَرْدَةٌ","pl":"وُرُودٌ","en":"rose, flower","type":"noun"},{"ar":"رَجُلٌ","pl":"رِجَالٌ","en":"man","type":"noun"},{"ar":"بَائِعٌ","pl":"بَاعَةٌ","en":"seller","type":"noun"},{"ar":"رِيَالٌ","pl":"رِيَالَاتٌ","en":"riyal","type":"noun"},{"ar":"أُرِيدُ","pl":"","en":"I want","type":"verb"}],"qs":[{"q":"Which word means \"one\"?","a":"وَاحِدٌ","w":["اِثْنَانِ","عَشَرَةٌ"]},{"q":"Which word means \"two\"?","a":"اِثْنَانِ","w":["وَاحِدٌ","ثَلَاثَةٌ"]},{"q":"Which word means \"three\"?","a":"ثَلَاثَةٌ","w":["أَرْبَعَةٌ","ثَلَاثُونَ"]},{"q":"Which word means \"four\"?","a":"أَرْبَعَةٌ","w":["خَمْسَةٌ","أَرْبَعُونَ"]},{"q":"Which word means \"five\"?","a":"خَمْسَةٌ","w":["سِتَّةٌ","خَمْسُونَ"]},{"q":"Which word means \"six\"?","a":"سِتَّةٌ","w":["سَبْعَةٌ","خَمْسَةٌ"]},{"q":"Which word means \"seven\"?","a":"سَبْعَةٌ","w":["تِسْعَ
