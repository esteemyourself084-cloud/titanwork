,"w":["وَرْدَةٌ أَبْيَضُ","أَبْيَضُ وَرْدَةٌ"]},{"q":"How do you say \"a big house\"?","a":"بَيْتٌ كَبِيرٌ","w":["بَيْتٌ كَبِيرَةٌ","كَبِيرٌ بَيْتٌ"]},{"q":"How do you say \"a small bag\"?","a":"حَقِيبَةٌ صَغِيرَةٌ","w":["حَقِيبَةٌ صَغِيرٌ","صَغِيرَةٌ حَقِيبَةٌ"]},{"q":"How do you say \"the new book\" (a phrase)?","a":"الكِتَابُ الجَدِيدُ","w":["الكِتَابُ جَدِيدٌ","كِتَابٌ الجَدِيدُ"]},{"q":"How do you say \"the book is new\" (a sentence)?","a":"الكِتَابُ جَدِيدٌ","w":["الكِتَابُ الجَدِيدُ","كِتَابٌ جَدِيدٌ"]},{"q":"How do you say \"the car is red\"?","a":"السَّيَّارَةُ حَمْرَاءُ","w":["السَّيَّارَةُ الحَمْرَاءُ","سَيَّارَةٌ حَمْرَاءُ"]},{"q":"How do you say \"the big house\" (a phrase)?","a":"البَيْتُ الكَبِيرُ","w":["البَيْتُ كَبِيرٌ","بَيْتٌ كَبِيرٌ"]},{"q":"How do you ask \"What colour is it?\" (masculine)","a":"مَا لَوْنُهُ؟","w":["مَا لَوْنُهَا؟","مَا اسْمُهُ؟"]},{"q":"How do you say \"I want a bag\"?","a":"أُرِيدُ حَقِيبَةً","w":["أُرِيدُ حَقِيبَةٌ","عِنْدِي حَقِيبَةً"]},{"q":"How do you ask \"How much is it?\" about a bag?","a":"كَمْ هِيَ؟","w":["كَمْ هُوَ؟","كَمْ عُمْرُهَا؟"]},{"q":"Which word means \"seller\"?","a":"بَائِعٌ","w":["رَجُلٌ","طَبَّاخٌ"]},{"q":"How do you ask \"What is the colour of the car?\"","a":"مَا لَوْنُ السَّيَّارَةِ؟","w":["مَا لَوْنُ الكِتَابِ؟","مَنْ هَذِهِ؟"]},{"q":"How do you say \"its colour is red\"?","a":"لَوْنُهُ أَحْمَرُ","w":["لَوْنُهُ حَمْرَاءُ","لَوْنُكَ أَحْمَرُ"]}],"conv":{"title":"مُحَادَثَةٌ: فِي المَحَلِّ","lines":[{"w":"m","n":"بَائِعٌ","ar":"السَّلَامُ عَلَيْكُمْ. أَهْلًا وَسَهْلًا."},{"w":"f","n":"زَيْنَبُ","ar":"وَعَلَيْكُمُ السَّلَامُ. مَرْحَبًا."},{"w":"f","n":"زَيْنَبُ","ar":"أُرِيدُ حَقِيبَةً. هَلْ عِنْدَكَ حَقِيبَةٌ جَدِيدَةٌ؟"},{"w":"m","n":"بَائِعٌ","ar":"نَعَمْ، عِنْدِي حَقِيبَةٌ كَبِيرَةٌ وَحَقِيبَةٌ صَغِيرَةٌ."},{"w":"f","n":"زَيْنَبُ","ar":"مَا لَوْنُ الحَقِيبَةِ الكَبِيرَةِ؟"},{"w":"m","n":"بَائِعٌ","ar":"لَوْنُهَا أَسْوَدُ."},{"w":"f","n":"زَيْنَبُ","ar":"وَمَا لَوْنُ الحَقِيبَةِ الصَّغِيرَةِ؟"},{"w":"m","n":"بَائِعٌ","ar":"لَوْنُهَا أَحْمَرُ."},{"w":"f","n":"زَيْنَبُ","ar":"الحَقِيبَةُ الحَمْرَاءُ جَمِيلَةٌ. كَمْ هِيَ؟"},{"w":"m","n":"بَائِعٌ","ar":"عَشَرَةُ رِيَالَاتٍ."},{"w":"f","n":"زَيْنَبُ","ar":"شُكْرًا. مَعَ السَّلَامَةِ."},{"w":"m","n":"بَائِعٌ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."}],"qs":[{"q":"What does Zainab want?","a":"حَقِيبَةً","w":["سَيَّارَةً","كِتَابًا"]},{"q":"What colour is the big bag?","a":"أَسْوَدُ","w":["أَحْمَرُ","أَبْيَضُ"]},{"q":"What colour is the small bag?","a":"أَحْمَرُ","w":["أَسْوَدُ","أَزْرَقُ"]},{"q":"Which bag does Zainab call beautiful?","a":"الحَقِيبَةُ الحَمْرَاءُ","w":["الحَقِيبَةُ السَّوْدَاءُ","الحَقِيبَةُ الكَبِيرَةُ"]},{"q":"How much does the bag cost?","a":"عَشَرَةُ رِيَالَاتٍ","w":["خَمْسَةُ رِيَالَاتٍ","عِشْرُونَ رِيَالًا"]},{"q":"How does Zainab greet the seller?","a":"مَرْحَبًا","w":["صَبَاحُ الخَيْرِ","عَفْوًا"]},{"q":"What does Zainab ask about the big bag?","a":"مَا لَوْنُ الحَقِيبَةِ الكَبِيرَةِ؟","w":["كَمْ عُمْرُهَا؟","مَنْ هَذِهِ؟"]},{"q":"How does the seller say goodbye?","a":"مَعَ السَّلَامَةِ","w":["شُكْرًا","مَرْحَبًا"]}]},"id":"1-1-6"},{"stage":1,"level":1,"order":7,"titleAr":"الصَّلَاةُ","titleEn":"The Prayer","about":"Talk about the prayer. You will learn the names of the five prayers, how many rakʿahs each one has, the words for wudu, the mosque and the qibla, how to say \"I pray\", and the phrases people say around the prayer.","rules":[{"title":"The five prayers (الصَّلَوَاتُ الخَمْسُ)","body":"صَلَاةٌ means \"prayer\". Its plural is صَلَوَاتٌ. Every prayer is named by putting its time after the word صَلَاةُ. The word after صَلَاةُ ends with ـِ.","ex":[{"ar":"هَذِهِ صَلَاةٌ","tr":"hādhihi ṣalātun","en":"this is a prayer","note":"صَلَاةٌ is feminine, so we use هَذِهِ."},{"ar":"صَلَاةُ الفَجْرِ","tr":"ṣalātu l-fajri","en":"the dawn prayer","note":"الفَجْرُ is the dawn. It becomes الفَجْرِ after صَلَاةُ."},{"ar":"صَلَاةُ الظُّهْرِ","tr":"ṣalātu ẓ-ẓuhri","en":"the noon prayer","note":"الظُّهْرُ is the middle of the day."},{"ar":"صَلَاةُ العَصْرِ","tr":"ṣalātu l-ʿaṣri","en":"the afternoon prayer","note":"العَصْرُ is the late afternoon."},{"ar":"صَلَاةُ المَغْرِبِ","tr":"ṣalātu l-maghribi","en":"the sunset prayer","note":"المَغْرِبُ is the sunset, and also the west."},{"ar":"صَلَاةُ العِشَاءِ","tr":"ṣalātu l-ʿishāʾi","en":"the night prayer","note":"العِشَاءُ is the early night."},{"ar":"صَلَاةُ الجُمُعَةِ","tr":"ṣalātu l-jumuʿati","en":"the Friday prayer","note":"Muslims pray it together in the mosque."}]},{"title":"How many rakʿahs? (كَمْ رَكْعَةً؟)","body":"رَكْعَةٌ is one unit of the prayer, and its plural is رَكَعَاتٌ. Ask كَمْ رَكْعَةً؟ You learned that the thing after كَمْ ends with ـًا. For three to ten, use the plural and remember that رَكْعَةٌ is feminine, so the number drops ـَةٌ. For two, use رَكْعَتَانِ.","ex":[{"ar":"كَمْ رَكْعَةً فِي صَلَاةِ الفَجْرِ؟","tr":"kam rakʿatan fī ṣalāti l-fajri","en":"how many rakʿahs are in the dawn prayer?","note":"رَكْعَةً ends with ـًا after كَمْ."},{"ar":"رَكْعَتَانِ","tr":"rakʿatāni","en":"two rakʿahs","re":true,"note":"Two is shown by adding ـَانِ."},{"ar":"كَمْ رَكْعَةً فِي صَلَاةِ الظُّهْرِ؟","tr":"kam rakʿatan fī ṣalāti ẓ-ẓuhri","en":"how many rakʿahs are in the noon prayer?","note":"Same question, new prayer."},{"ar":"أَرْبَعُ رَكَعَاتٍ","tr":"arbaʿu rakaʿātin","en":"four rakʿahs","re":true,"note":"أَرْبَعَةٌ becomes أَرْبَعُ because رَكْعَةٌ is feminine."},{"ar":"كَمْ رَكْعَةً فِي صَلَاةِ المَغْرِبِ؟","tr":"kam rakʿatan fī ṣalāti l-maghribi","en":"how many rakʿahs are in the sunset prayer?","note":"The sunset prayer is the shortest of the three-rakʿah prayers."},{"ar":"ثَلَاثُ رَكَعَاتٍ","tr":"thalāthu rakaʿātin","en":"three rakʿahs","re":true,"note":"ثَلَاثَةٌ becomes ثَلَاثُ."},{"ar":"صَلَاةُ العِشَاءِ أَرْبَعُ رَكَعَاتٍ","tr":"ṣalātu l-ʿishāʾi arbaʿu rakaʿātin","en":"the night prayer is four rakʿahs","note":"The two nouns join to make a short sentence, with no word for \"is\"."},{"ar":"كَمْ صَلَاةً؟","tr":"kam ṣalātan","en":"how many prayers?","note":"صَلَاةً ends with ـًا after كَمْ."},{"ar":"خَمْسُ صَلَوَاتٍ","tr":"khamsu ṣalawātin","en":"five prayers","re":true,"note":"صَلَاةٌ is feminine, so خَمْسَةٌ becomes خَمْسُ."}]},{"title":"Wudu (الوُضُوءُ)","body":"الوُضُوءُ is the washing before the prayer. Say أَتَوَضَّأُ for \"I make wudu\". For \"you\", say تَتَوَضَّأُ to a man and تَتَوَضَّئِينَ to a woman. Use قَبْلَ for \"before\" and بَعْدَ for \"after\". Use بِـ for \"with\", and join it to the next word: بِالمَاءِ.","ex":[{"ar":"أَتَوَضَّأُ","tr":"atawaḍḍaʾu","en":"I make wudu","note":"أَ at the start means \"I\"."},{"ar":"أَتَوَضَّأُ بِالمَاءِ","tr":"atawaḍḍaʾu bi-l-māʾi","en":"I make wudu with water","note":"بِ means \"with\". المَاءُ becomes المَاءِ after بِ."},{"ar":"الوُضُوءُ قَبْلَ الصَّلَاةِ","tr":"al-wuḍūʾu qabla ṣ-ṣalāti","en":"wudu is before the prayer","note":"قَبْلَ means \"before\"."},{"ar":"الدُّعَاءُ بَعْدَ الصَّلَاةِ","tr":"ad-duʿāʾu baʿda ṣ-ṣalāti","en":"the supplication is after the prayer","note":"بَعْدَ means \"after\". الدُّعَاءُ is the supplication."},{"ar":"هَلْ تَتَوَضَّأُ قَبْلَ الصَّلَاةِ؟","tr":"hal tatawaḍḍaʾu qabla ṣ-ṣalāti","en":"do you make wudu before the prayer? (to a man)","note":"تَتَوَضَّأُ means \"you make wudu\" to a man."},{"ar":"نَعَمْ، أَتَوَضَّأُ","tr":"naʿam, atawaḍḍaʾu","en":"yes, I make wudu","re":true,"note":"Answer with the \"I\" verb."},{"ar":"هَلْ تَتَوَضَّئِينَ قَبْلَ الصَّلَاةِ؟","tr":"hal tatawaḍḍaʾīna qabla ṣ-ṣalāti","en":"do you make wudu before the prayer? (to a woman)","note":"For a woman, add ـِينَ."},{"ar":"نَعَمْ، أَتَوَضَّأُ بِالمَاءِ","tr":"naʿam, atawaḍḍaʾu bi-l-māʾi","en":"yes, I make wudu with water","re":true,"note":"The same \"I\" verb."}]},{"title":"The mosque and the qibla (المَسْجِدُ وَالقِبْلَةُ)","body":"المَسْجِدُ is the mosque. The imam leads the prayer, and the muʾadhdhin calls the adhan. القِبْلَةُ is the direction of prayer. It is toward the Kaʿbah in Makkah. You learned فِي, \"in\", and أَيْنَ, \"where\".","ex":[{"ar":"هَذَا مَسْجِدٌ","tr":"hādhā masjidun","en":"this is a mosque","note":"Its plural is مَسَاجِدُ."},{"ar":"هَذَا إِمَامٌ","tr":"hādhā imāmun","en":"this is an imam","note":"Its plural is أَئِمَّةٌ."},{"ar":"هَذَا مُؤَذِّنٌ","tr":"hādhā muʾadhdhinun","en":"this is a muʾadhdhin","note":"He calls the adhan. Its plural is مُؤَذِّنُونَ."},{"ar":"أَيْنَ القِبْلَةُ؟","tr":"ayna l-qiblatu","en":"where is the qibla?","note":"أَيْنَ comes first."},{"ar":"القِبْلَةُ الكَعْبَةُ","tr":"al-qiblatu l-kaʿbatu","en":"the qibla is the Kaʿbah","re":true,"note":"No word for \"is\" is needed."},{"ar":"أَيْنَ الكَعْبَةُ؟","tr":"ayna l-kaʿbatu","en":"where is the Kaʿbah?","note":"الكَعْبَةُ is the cube-shaped house in Makkah."},{"ar":"الكَعْبَةُ فِي مَكَّةَ","tr":"al-kaʿbatu fī makkata","en":"the Kaʿbah is in Makkah","re":true,"note":"مَكَّةُ has no ال, so it ends with ـَ after فِي."},{"ar":"أَيْنَ الإِمَامُ؟","tr":"ayna l-imāmu","en":"where is the imam?","note":"Ask about a person."},{"ar":"الإِمَامُ فِي المَسْجِدِ","tr":"al-imāmu fī l-masjidi","en":"the imam is in the mosque","re":true,"note":"المَسْجِدُ becomes المَسْجِدِ after فِي."}]},{"title":"I pray (أُصَلِّي)","body":"أُصَلِّي means \"I pray\". It ends with a long ـِي and has no extra vowel mark. For \"he\", say يُصَلِّي. For \"she\" or \"you\" (to a man), say تُصَلِّي. For \"you\" (to a woman), say تُصَلِّينَ.","ex":[{"ar":"أُصَلِّي فِي المَسْجِدِ","tr":"uṣallī fī l-masjidi","en":"I pray in the mosque","note":"أُ at the start means \"I\"."},{"ar":"هُوَ يُصَلِّي","tr":"huwa yuṣallī","en":"he prays","note":"يُ at the start means \"he\"."},{"ar":"هِيَ تُصَلِّي فِي البَيْتِ","tr":"hiya tuṣallī fī l-bayti","en":"she prays at home","note":"تُ at the start means \"she\"."},{"ar":"هَلْ تُصَلِّي فِي المَسْجِدِ؟","tr":"hal tuṣallī fī l-masjidi","en":"do you pray in the mosque? (to a man)","note":"تُصَلِّي means \"you pray\" to a man."},{"ar":"نَعَمْ، أُصَلِّي فِي المَسْجِدِ","tr":"naʿam, uṣallī fī l-masjidi","en":"yes, I pray in the mosque","re":true,"note":"Answer with the \"I\" verb."},{"ar":"هَلْ تُصَلِّينَ فِي المَسْجِدِ؟","tr":"hal tuṣallīna fī l-masjidi","en":"do you pray in the mosque? (to a woman)","note":"For a woman, add ـِينَ."},{"ar":"لَا، أُصَلِّي فِي البَيْتِ","tr":"lā, uṣallī fī l-bayti","en":"no, I pray at home","re":true,"note":"البَيْتُ becomes البَيْتِ after فِي."}]},{"title":"Phrases around the prayer (عِبَارَاتٌ)","body":"These are words that Muslims say all the time. Learn them as whole phrases.","ex":[{"ar":"اللَّهُ أَكْبَرُ","tr":"allāhu akbaru","en":"Allah is greatest","note":"It starts the prayer and the adhan. أَكْبَرُ comes from كَبِيرٌ."},{"ar":"بِسْمِ اللَّهِ","tr":"bismi llāhi","en":"in the name of Allah","note":"Say it before you begin something, such as eating."},{"ar":"إِنْ شَاءَ اللَّهُ","tr":"in shāʾa llāhu","en":"if Allah wills","note":"Say it when you talk about the future."},{"ar":"تَقَبَّلَ اللَّهُ","tr":"taqabbala llāhu","en":"may Allah accept it","note":"Say it after someone prays."},{"ar":"جَزَاكَ اللَّهُ خَيْرًا","tr":"jazāka llāhu khayran","en":"may Allah reward you with good (to a man)","note":"Say it to thank someone. ـكَ is for a man."},{"ar":"جَزَاكِ اللَّهُ خَيْرًا","tr":"jazāki llāhu khayran","en":"may Allah reward you with good (to a woman)","note":"ـكِ is for a woman."},{"ar":"السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ","tr":"as-salāmu ʿalaykum wa-raḥmatu llāhi","en":"peace and the mercy of Allah be upon you","note":"It ends the prayer. رَحْمَةٌ means \"mercy\"."}]}],"words":[{"ar":"صَلَاةٌ","pl":"صَلَوَاتٌ","en":"prayer","type":"noun"},{"ar":"فَجْرٌ","pl":"","en":"dawn","type":"noun"},{"ar":"ظُهْرٌ","pl":"","en":"noon","type":"noun"},{"ar":"عَصْرٌ","pl":"","en":"afternoon","type":"noun"},{"ar":"مَغْرِبٌ","pl":"","en":"sunset, west","type":"noun"},{"ar":"عِشَاءٌ","pl":"","en":"night, evening meal","type":"noun"},{"ar":"رَكْعَةٌ","pl":"رَكَعَاتٌ","en":"rakʿah, a unit of prayer","type":"noun"},{"ar":"وُضُوءٌ","pl":"","en":"wudu","type":"noun"},{"ar":"دُعَاءٌ","pl":"أَدْعِيَةٌ","en":"supplication","type":"noun"},{"ar":"مَسْجِدٌ","pl":"مَسَاجِدُ","en":"mosque","type":"noun"},{"ar":"إِمَامٌ","pl":"أَئِمَّةٌ","en":"imam","type":"noun"},{"ar":"مُؤَذِّنٌ","pl":"مُؤَذِّنُونَ","en":"muʾadhdhin","type":"noun"},{"ar":"قِبْلَةٌ","pl":"قِبَلٌ","en":"qibla","type":"noun"},{"ar":"كَعْبَةٌ","pl":"","en":"Kaʿbah","type":"noun"},{"ar":"مَكَّةُ","pl":"","en":"Makkah","type":"noun"},{"ar":"رَحْمَةٌ","pl":"","en":"mercy","type":"noun"},{"ar":"أُصَلِّي","pl":"","en":"I pray","type":"verb"},{"ar":"أَتَوَضَّأُ","pl":"","en":"I make wudu","type":"verb"},{"ar":"قَبْلَ","pl":"","en":"before","type":"preposition"},{"ar":"بَعْدَ","pl":"","en":"after","type":"preposition"},{"ar":"بِ","pl":"","en":"with, by","type":"preposition"}],"qs":[{"q":"Which word means \"prayer\"?","a":"صَلَاةٌ","w":["وُضُوءٌ","دُعَاءٌ"]},{"q":"What is the plural of صَلَاةٌ?","a":"صَلَوَاتٌ","w":["رَكَعَاتٌ","مَسَاجِدُ"]},{"q":"Which prayer is the dawn prayer?","a":"صَلَاةُ الفَجْرِ","w":["صَلَاةُ الظُّهْرِ","صَلَاةُ العِشَاءِ"]},{"q":"Which prayer is the noon prayer?","a":"صَلَاةُ الظُّهْرِ","w":["صَلَاةُ العَصْرِ","صَلَاةُ الفَجْرِ"]},{"q":"Which prayer is the afternoon prayer?","a":"صَلَاةُ العَصْرِ","w":["صَلَاةُ الظُّهْرِ","صَلَاةُ المَغْرِبِ"]},{"q":"Which prayer is the sunset prayer?","a":"صَلَاةُ المَغْرِبِ","w":["صَلَاةُ العِشَاءِ","صَلَاةُ العَصْرِ"]},{"q":"Which prayer is the night prayer?","a":"صَلَاةُ العِشَاءِ","w":["صَلَاةُ المَغْرِبِ","صَلَاةُ الفَجْرِ"]},{"q":"Which prayer is the Friday prayer?","a":"صَلَاةُ الجُمُعَةِ","w":["صَلَاةُ الظُّهْرِ","صَلَاةُ العَصْرِ"]},{"q":"Which word means \"rakʿah\"?","a":"رَكْعَةٌ","w":["رَحْمَةٌ","قِبْلَةٌ"]},{"q":"Which word means \"wudu\"?","a":"وُضُوءٌ","w":["دُعَاءٌ","صَلَاةٌ"]},{"q":"Which word means \"mosque\"?","a":"مَسْجِدٌ","w":["إِمَامٌ","مُؤَذِّنٌ"]},{"q":"Which word means \"imam\"?","a":"إِمَامٌ","w":["مُؤَذِّنٌ","مَسْجِدٌ"]},{"q":"Which word means \"qibla\"?","a":"قِبْلَةٌ","w":["كَعْبَةٌ","رَكْعَةٌ"]},{"q":"Which word means \"before\"?","a":"قَبْلَ","w":["بَعْدَ","بِ"]},{"q":"Which word means \"after\"?","a":"بَعْدَ","w":["قَبْلَ","مَعَ"]},{"q":"How many rakʿahs are in the dawn prayer?","a":"رَكْعَتَانِ","w":["ثَلَاثُ رَكَعَاتٍ","أَرْبَعُ رَكَعَاتٍ"]},{"q":"How many rakʿahs are in the sunset prayer?","a":"ثَلَاثُ رَكَعَاتٍ","w":["رَكْعَتَانِ","أَرْبَعُ رَكَعَاتٍ"]},{"q":"How many rakʿahs are in the noon prayer?","a":"أَرْبَعُ رَكَعَاتٍ","w":["ثَلَاثُ رَكَعَاتٍ","رَكْعَتَانِ"]},{"q":"How do you ask \"How many rakʿahs are in the dawn prayer?\"","a":"كَمْ رَكْعَةً فِي صَلَاةِ الفَجْرِ؟","w":["كَمْ رَكْعَةٌ فِي صَلَاةِ الفَجْرِ؟","أَيْنَ صَلَاةُ الفَجْرِ؟"]},{"q":"How do you say \"five prayers\"?","a":"خَمْسُ صَلَوَاتٍ","w":["خَمْسَةُ صَلَوَاتٍ","خَمْسُ صَلَاةٍ"]},{"q":"How do you say \"I make wudu\"?","a":"أَتَوَضَّأُ","w":["أُصَلِّي","يَتَوَضَّأُ"]},{"q":"How do you say \"I make wudu with water\"?","a":"أَتَوَضَّأُ بِالمَاءِ","w":["أَتَوَضَّأُ مِنَ المَاءِ","أُصَلِّي بِالمَاءِ"]},{"q":"How do you say \"wudu is before the prayer\"?","a":"الوُضُوءُ قَبْلَ الصَّلَاةِ","w":["الوُضُوءُ بَعْدَ الصَّلَاةِ","الصَّلَاةُ قَبْلَ الوُضُوءِ"]},{"q":"How does a man ask \"Do you make wudu?\"","a":"هَلْ تَتَوَضَّأُ؟","w":["هَلْ تَتَوَضَّئِينَ؟","هَلْ أَتَوَضَّأُ؟"]},{"q":"How do you ask a woman \"Do you pray in the mosque?\"","a":"هَلْ تُصَلِّينَ فِي المَسْجِدِ؟","w":["هَلْ تُصَلِّي فِي المَسْجِدِ؟","هَلْ هِيَ فِي المَسْجِدِ؟"]},{"q":"How do you say \"I pray in the mosque\"?","a":"أُصَلِّي فِي المَسْجِدِ","w":["يُصَلِّي فِي المَسْجِدِ","أُصَلِّي مِنَ المَسْجِدِ"]},{"q":"How do you say \"he prays\"?","a":"هُوَ يُصَلِّي","w":["هُوَ أُصَلِّي","هِيَ تُصَلِّي"]},{"q":"How do you say \"she prays at home\"?","a":"هِيَ تُصَلِّي فِي البَيْتِ","w":["هُوَ يُصَلِّي فِي البَيْتِ","أَنَا أُصَلِّي فِي البَيْتِ"]},{"q":"How do you ask \"Where is the qibla?\"","a":"أَيْنَ القِبْلَةُ؟","w":["مَنِ القِبْلَةُ؟","كَمِ القِبْلَةُ؟"]},{"q":"How do you say \"the Kaʿbah is in Makkah\"?","a":"الكَعْبَةُ فِي مَكَّةَ","w":["الكَعْبَةُ مِنْ مَكَّةَ","مَكَّةُ فِي الكَعْبَةِ"]},{"q":"Which phrase do you say to thank a woman by making a prayer for her?","a":"جَزَاكِ اللَّهُ خَيْرًا","w":["جَزَاكَ اللَّهُ خَيْرًا","تَقَبَّلَ اللَّهُ"]},{"q":"Which phrase begins the prayer?","a":"اللَّهُ أَكْبَرُ","w":["إِنْ شَاءَ اللَّهُ","بِسْمِ اللَّهِ"]}],"conv":{"title":"مُحَادَثَةٌ: عَنِ الصَّلَاةِ","lines":[{"w":"m","n":"إِبْرَاهِيمُ","ar":"السَّلَامُ عَلَيْكُمْ. كَيْفَ حَالُكِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"وَعَلَيْكُمُ السَّلَامُ. بِخَيْرٍ، الحَمْدُ لِلَّهِ. وَأَنْتَ؟"},{"w":"m","n":"إِبْرَاهِيمُ","ar":"بِخَيْرٍ، شُكْرًا. هَلْ تُصَلِّينَ فِي المَسْجِدِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"لَا، أُصَلِّي فِي البَيْتِ. وَأَنْتَ؟"},{"w":"m","n":"إِبْرَاهِيمُ","ar":"أُصَلِّي فِي المَسْجِدِ. أَبِي إِمَامٌ فِي المَسْجِدِ."},{"w":"f","n":"مَرْيَمُ","ar":"مَا شَاءَ اللَّهُ! هَلْ تَتَوَضَّأُ قَبْلَ الصَّلَاةِ؟"},{"w":"m","n":"إِبْرَاهِيمُ","ar":"نَعَمْ، أَتَوَضَّأُ بِالمَاءِ قَبْلَ الصَّلَاةِ. وَأَنْتِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"نَعَمْ، أَتَوَضَّأُ قَبْلَ الصَّلَاةِ."},{"w":"m","n":"إِبْرَاهِيمُ","ar":"كَمْ رَكْعَةً فِي صَلَاةِ الفَجْرِ؟"},{"w":"f","n":"مَرْيَمُ","ar":"رَكْعَتَانِ. وَكَمْ رَكْعَةً فِي صَلَاةِ المَغْرِبِ؟"},{"w":"m","n":"إِبْرَاهِيمُ","ar":"ثَلَاثُ رَكَعَاتٍ."},{"w":"f","n":"مَرْيَمُ","ar":"جَزَاكَ اللَّهُ خَيْرًا."},{"w":"m","n":"إِبْرَاهِيمُ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."},{"w":"f","n":"مَرْيَمُ","ar":"مَعَ السَّلَامَةِ."}],"qs":[{"q":"Where does Maryam pray?","a":"فِي البَيْتِ","w":["فِي المَسْجِدِ","فِي المَدْرَسَةِ"]},{"q":"Where does Ibrahim pray?","a":"فِي المَسْجِدِ","w":["فِي البَيْتِ","فِي الفَصْلِ"]},{"q":"Who is Ibrahim's father?","a":"إِمَامٌ","w":["مُؤَذِّنٌ","طَبِيبٌ"]},{"q":"What does Maryam ask Ibrahim about wudu?","a":"هَلْ تَتَوَضَّأُ قَبْلَ الصَّلَاةِ؟","w":["هَلْ تُصَلِّينَ فِي المَسْجِدِ؟","كَمْ رَكْعَةً؟"]},{"q":"What does Ibrahim use for wudu?","a":"المَاءُ","w":["الشَّايُ","القَهْوَةُ"]},{"q":"How many rakʿahs are in the dawn prayer?","a":"رَكْعَتَانِ","w":["ثَلَاثُ رَكَعَاتٍ","أَرْبَعُ رَكَعَاتٍ"]},{"q":"How many rakʿahs are in the sunset prayer?","a":"ثَلَاثُ رَكَعَاتٍ","w":["رَكْعَتَانِ","أَرْبَعُ رَكَعَاتٍ"]},{"q":"Who asks about the rakʿahs of the dawn prayer?","a":"إِبْرَاهِيمُ","w":["مَرْيَمُ","الإِمَامُ"]},{"q":"What does Maryam say at the end to thank him?","a":"جَزَاكَ اللَّهُ خَيْرًا","w":["تَقَبَّلَ اللَّهُ","إِنْ شَاءَ اللَّهُ"]},{"q":"What does Ibrahim answer?","a":"عَفْوًا","w":["تَفَضَّلْ","مَرْحَبًا"]}]},"id":"1-1-7"},{"stage":1,"level":1,"order":5,"titleAr":"العَمَلُ وَالجِنْسِيَّاتُ","titleEn":"Work and Nationalities","about":"Talk about work and where you are from. You will learn common jobs in their masculine and feminine forms, where people work, how to make a nationality word, the names of some countries, and how to ask مَا عَمَلُكَ؟ and مِنْ أَيْنَ أَنْتَ؟","rules":[{"title":"Jobs for men and women (المِهَنُ)","body":"Most Arabic job words have two forms. The masculine form is the base word. To make the feminine form, add ـَةٌ at the end. Say أَنَا before the job to say \"I am a...\".","ex":[{"ar":"أَنَا مُدَرِّسٌ","tr":"anā mudarrisun","en":"I am a teacher (a man)","note":"مُدَرِّسٌ is the masculine form."},{"ar":"أَنَا مُدَرِّسَةٌ","tr":"anā mudarrisatun","en":"I am a teacher (a woman)","note":"Add ـَةٌ to make the feminine form."},{"ar":"هُوَ طَبِيبٌ","tr":"huwa ṭabībun","en":"he is a doctor","note":"طَبِيبٌ is a doctor (a man). Its plural is أَطِبَّاءُ."},{"ar":"هِيَ طَبِيبَةٌ","tr":"hiya ṭabībatun","en":"she is a doctor","note":"طَبِيبَةٌ is a doctor (a woman)."},{"ar":"هُوَ مُهَنْدِسٌ","tr":"huwa muhandisun","en":"he is an engineer","note":"Its plural is مُهَنْدِسُونَ."},{"ar":"هِيَ مُهَنْدِسَةٌ","tr":"hiya muhandisatun","en":"she is an engineer","note":"The feminine form ends with ـَةٌ."},{"ar":"هُوَ مُمَرِّضٌ","tr":"huwa mumarriḍun","en":"he is a nurse","note":"مُمَرِّضٌ is a male nurse."},{"ar":"هِيَ مُمَرِّضَةٌ","tr":"hiya mumarriḍatun","en":"she is a nurse","note":"مُمَرِّضَةٌ is a female nurse."}]},{"title":"What is your job? (مَا عَمَلُكَ؟)","body":"عَمَلٌ means \"work\" or \"job\". Ask a man مَا عَمَلُكَ؟ and ask a woman مَا عَمَلُكِ؟ Answer with أَنَا and the job. You can also ask about a third person with عَمَلُهُ and عَمَلُهَا.","ex":[{"ar":"مَا عَمَلُكَ؟","tr":"mā ʿamaluka","en":"what is your job? (to a man)","note":"ـكَ at the end is for a man."},{"ar":"أَنَا مُهَنْدِسٌ","tr":"anā muhandisun","en":"I am an engineer","re":true,"note":"Say أَنَا and then the job."},{"ar":"مَا عَمَلُكِ؟","tr":"mā ʿamaluki","en":"what is your job? (to a woman)","note":"ـكِ at the end is for a woman."},{"ar":"أَنَا طَبِيبَةٌ","tr":"anā ṭabībatun","en":"I am a doctor (a woman)","re":true,"note":"A woman uses the feminine form."},{"ar":"مَا عَمَلُهُ؟","tr":"mā ʿamaluhu","en":"what is his job?","note":"ـهُ means \"his\"."},{"ar":"هُوَ مُدَرِّسٌ","tr":"huwa mudarrisun","en":"he is a teacher","re":true,"note":"هُوَ means \"he\"."},{"ar":"مَا عَمَلُهَا؟","tr":"mā ʿamaluhā","en":"what is her job?","note":"ـهَا means \"her\"."},{"ar":"هِيَ مُمَرِّضَةٌ","tr":"hiya mumarriḍatun","en":"she is a nurse","re":true,"note":"هِيَ means \"she\"."}]},{"title":"More jobs (مِهَنٌ أُخْرَى)","body":"Here are more jobs. Each one follows the same rule: add ـَةٌ for a woman.","ex":[{"ar":"هُوَ سَائِقٌ","tr":"huwa sāʾiqun","en":"he is a driver","note":"Its feminine form is سَائِقَةٌ."},{"ar":"هُوَ طَبَّاخٌ","tr":"huwa ṭabbākhun","en":"he is a cook","note":"Its feminine form is طَبَّاخَةٌ."},{"ar":"هُوَ مُوَظَّفٌ","tr":"huwa muwaẓẓafun","en":"he is an employee","note":"Its feminine form is مُوَظَّفَةٌ."},{"ar":"هُوَ تَاجِرٌ","tr":"huwa tājirun","en":"he is a merchant","note":"Its feminine form is تَاجِرَةٌ."},{"ar":"هِيَ طَالِبَةٌ","tr":"hiya ṭālibatun","en":"she is a student","note":"You learned طَالِبٌ in Unit 3."},{"ar":"هُوَ شُرْطِيٌّ","tr":"huwa shurṭiyyun","en":"he is a policeman","note":"Its feminine form is شُرْطِيَّةٌ."}]},{"title":"Nationalities (الجِنْسِيَّاتُ)","body":"جِنْسِيَّةٌ means \"nationality\". To make a nationality word from a country, add ـِيٌّ for a man and ـِيَّةٌ for a woman. The doubled ي is part of the ending. Ask مَا جِنْسِيَّتُكَ؟ for \"what is your nationality?\"","ex":[{"ar":"أَنَا سُعُودِيٌّ","tr":"anā suʿūdiyyun","en":"I am Saudi (a man)","note":"ـِيٌّ makes a masculine nationality."},{"ar":"أَنَا سُعُودِيَّةٌ","tr":"anā suʿūdiyyatun","en":"I am Saudi (a woman)","note":"ـِيَّةٌ makes a feminine nationality."},{"ar":"هُوَ مِصْرِيٌّ","tr":"huwa miṣriyyun","en":"he is Egyptian","note":"The country is مِصْرُ."},{"ar":"هِيَ مِصْرِيَّةٌ","tr":"hiya miṣriyyatun","en":"she is Egyptian","note":"The same word with ـِيَّةٌ."},{"ar":"هُوَ أَمْرِيكِيٌّ","tr":"huwa amrīkiyyun","en":"he is American","note":"The country is أَمْرِيكَا."},{"ar":"هُوَ هِنْدِيٌّ","tr":"huwa hindiyyun","en":"he is Indian","note":"The country is الهِنْدُ."},{"ar":"هِيَ أُرْدُنِّيَّةٌ","tr":"hiya urdunniyyatun","en":"she is Jordanian","note":"The country is الأُرْدُنُّ."},{"ar":"هُوَ عَرَبِيٌّ","tr":"huwa ʿarabiyyun","en":"he is Arab","note":"Arabic itself is عَرَبِيٌّ too, as in اللُّغَةُ العَرَبِيَّةُ."},{"ar":"مَا جِنْسِيَّتُكَ؟","tr":"mā jinsiyyatuka","en":"what is your nationality? (to a man)","note":"Use ـكِ when you speak to a woman."},{"ar":"أَنَا سُعُودِيٌّ","tr":"anā suʿūdiyyun","en":"I am Saudi","re":true,"note":"Answer with a nationality word."}]},{"title":"Where are you from? (مِنْ أَيْنَ أَنْتَ؟)","body":"أَيْنَ means \"where\" and مِنْ means \"from\". Ask a man مِنْ أَيْنَ أَنْتَ؟ and ask a woman مِنْ أَيْنَ أَنْتِ؟ Answer أَنَا مِنْ and the country. Before a word with ال, مِنْ becomes مِنَ.","ex":[{"ar":"مِنْ أَيْنَ أَنْتَ؟","tr":"min ayna anta","en":"where are you from? (to a man)","note":"أَنْتَ is for a man."},{"ar":"أَنَا مِنْ مِصْرَ","tr":"anā min miṣra","en":"I am from Egypt","re":true,"note":"Say أَنَا مِنْ and then the country."},{"ar":"مِنْ أَيْنَ أَنْتِ؟","tr":"min ayna anti","en":"where are you from? (to a woman)","note":"أَنْتِ is for a woman."},{"ar":"أَنَا مِنَ السُّعُودِيَّةِ","tr":"anā mina s-suʿūdiyyati","en":"I am from Saudi Arabia","re":true,"note":"The country has ال, so مِنْ becomes مِنَ."},{"ar":"هُوَ مِنَ الهِنْدِ","tr":"huwa mina l-hindi","en":"he is from India","note":"Again مِنَ is used before ال."},{"ar":"هِيَ مِنَ الأُرْدُنِّ","tr":"hiya mina l-urdunni","en":"she is from Jordan","note":"Again مِنَ is used before ال."}]},{"title":"Where people work (مَكَانُ العَمَلِ)","body":"مَكَانٌ means \"place\", so مَكَانُ العَمَلِ is \"the place of work\". Say a person and where they are with فِي, \"in\". The word after فِي ends with ـِ. Because فِي is followed by a word with ال, no tanween is needed.","ex":[{"ar":"المُدَرِّسُ فِي المَدْرَسَةِ","tr":"al-mudarrisu fī l-madrasati","en":"the teacher is in the school","note":"المَدْرَسَةُ becomes المَدْرَسَةِ after فِي."},{"ar":"الطَّبِيبُ فِي المُسْتَشْفَى","tr":"aṭ-ṭabību fī l-mustashfā","en":"the doctor is in the hospital","note":"مُسْتَشْفًى ends with a long vowel, so it does not change."},{"ar":"المُهَنْدِسُ فِي الشَّرِكَةِ","tr":"al-muhandisu fī sh-sharikati","en":"the engineer is in the company","note":"شَرِكَةٌ means \"company\"."},{"ar":"المُوَظَّفُ فِي المَكْتَبِ","tr":"al-muwaẓẓafu fī l-maktabi","en":"the employee is in the office","note":"You learned مَكْتَبٌ in Unit 3."},{"ar":"التَّاجِرُ فِي السُّوقِ","tr":"at-tājiru fī s-sūqi","en":"the merchant is in the market","note":"سُوقٌ means \"market\"."},{"ar":"أَيْنَ الطَّبِيبُ؟","tr":"ayna ṭ-ṭabību","en":"where is the doctor?","note":"أَيْنَ comes first."},{"ar":"الطَّبِيبُ فِي المُسْتَشْفَى","tr":"aṭ-ṭabību fī l-mustashfā","en":"the doctor is in the hospital","re":true,"note":"Answer with the person and the place."},{"ar":"مَا مَكَانُ العَمَلِ؟","tr":"mā makānu l-ʿamali","en":"where is the workplace?","note":"Literally \"what is the place of work?\""},{"ar":"مَكَانُ العَمَلِ شَرِكَةٌ","tr":"makānu l-ʿamali sharikatun","en":"the workplace is a company","re":true,"note":"Two nouns side by side make a simple sentence."}]}],"words":[{"ar":"مُدَرِّسٌ","pl":"مُدَرِّسُونَ","en":"teacher (m)","type":"noun"},{"ar":"مُدَرِّسَةٌ","pl":"مُدَرِّسَاتٌ","en":"teacher (f)","type":"noun"},{"ar":"طَبِيبٌ","pl":"أَطِبَّاءُ","en":"doctor (m)","type":"noun"},{"ar":"طَبِيبَةٌ","pl":"طَبِيبَاتٌ","en":"doctor (f)","type":"noun"},{"ar":"مُهَنْدِسٌ","pl":"مُهَنْدِسُونَ","en":"engineer (m)","type":"noun"},{"ar":"مُهَنْدِسَةٌ","pl":"مُهَنْدِسَاتٌ","en":"engineer (f)","type":"noun"},{"ar":"مُمَرِّضٌ","pl":"مُمَرِّضُونَ","en":"nurse (m)","type":"noun"},{"ar":"مُمَرِّضَةٌ","pl":"مُمَرِّضَاتٌ","en":"nurse (f)","type":"noun"},{"ar":"سَائِقٌ","pl":"سَائِقُونَ","en":"driver","type":"noun"},{"ar":"طَبَّاخٌ","pl":"طَبَّاخُونَ","en":"cook","type":"noun"},{"ar":"مُوَظَّفٌ","pl":"مُوَظَّفُونَ","en":"employee","type":"noun"},{"ar":"تَاجِرٌ","pl":"تُجَّارٌ","en":"merchant","type":"noun"},{"ar":"شُرْطِيٌّ","pl":"شُرْطِيُّونَ","en":"policeman","type":"noun"},{"ar":"عَمَلٌ","pl":"أَعْمَالٌ","en":"work, job","type":"noun"},{"ar":"جِنْسِيَّةٌ","pl":"جِنْسِيَّاتٌ","en":"nationality","type":"noun"},{"ar":"سُعُودِيٌّ","pl":"سُعُودِيُّونَ","en":"Saudi (m)","type":"adjective"},{"ar":"مِصْرِيٌّ","pl":"مِصْرِيُّونَ","en":"Egyptian (m)","type":"adjective"},{"ar":"أَمْرِيكِيٌّ","pl":"أَمْرِيكِيُّونَ","en":"American (m)","type":"adjective"},{"ar":"هِنْدِيٌّ","pl":"هُنُودٌ","en":"Indian (m)","type":"adjective"},{"ar":"عَرَبِيٌّ","pl":"عَرَبٌ","en":"Arab, Arabic (m)","type":"adjective"},{"ar":"السُّعُودِيَّةُ","pl":"","en":"Saudi Arabia","type":"noun"},{"ar":"الهِنْدُ","pl":"","en":"India","type":"noun"},{"ar":"الأُرْدُنُّ","pl":"","en":"Jordan","type":"noun"},{"ar":"مَكَانٌ","pl":"أَمَاكِنُ","en":"place","type":"noun"},{"ar":"مُسْتَشْفًى","pl":"مُسْتَشْفَيَاتٌ","en":"hospital","type":"noun"},{"ar":"شَرِكَةٌ","pl":"شَرِكَاتٌ","en":"company","type":"noun"},{"ar":"سُوقٌ","pl":"أَسْوَاقٌ","en":"market","type":"noun"}],"qs":[{"q":"Which word means \"teacher\" (a man)?","a":"مُدَرِّسٌ","w":["مُدَرِّسَةٌ","طَبِيبٌ"]},{"q":"Which word means \"teacher\" (a woman)?","a":"مُدَرِّسَةٌ","w":["مُدَرِّسٌ","مُمَرِّضَةٌ"]},{"q":"Which word means \"doctor\" (a man)?","a":"طَبِيبٌ","w":["طَبِيبَةٌ","مُهَنْدِسٌ"]},{"q":"Which word means \"doctor\" (a woman)?","a":"طَبِيبَةٌ","w":["طَبِيبٌ","طَالِبَةٌ"]},{"q":"Which word means \"engineer\" (a man)?","a":"مُهَنْدِسٌ","w":["مُمَرِّضٌ","مُدَرِّسٌ"]},{"q":"Which word means \"nurse\" (a woman)?","a":"مُمَرِّضَةٌ","w":["مُمَرِّضٌ","مُهَنْدِسَةٌ"]},{"q":"Which word means \"driver\"?","a":"سَائِقٌ","w":["طَبَّاخٌ","تَاجِرٌ"]},{"q":"Which word means \"cook\"?","a":"طَبَّاخٌ","w":["سَائِقٌ","شُرْطِيٌّ"]},{"q":"Which word means \"merchant\"?","a":"تَاجِرٌ","w":["مُوَظَّفٌ","سَائِقٌ"]},{"q":"Which word means \"work\" or \"job\"?","a":"عَمَلٌ","w":["جِنْسِيَّةٌ","أُسْرَةٌ"]},{"q":"Which word means \"nationality\"?","a":"جِنْسِيَّةٌ","w":["عَمَلٌ","مَدْرَسَةٌ"]},{"q":"Which word means \"where\"?","a":"أَيْنَ","w":["مَنْ","مَا"]},{"q":"Which word means \"from\"?","a":"مِنْ","w":["هَلْ","مَعَ"]},{"q":"How do you say \"I am an engineer\" (a man)?","a":"أَنَا مُهَنْدِسٌ","w":["أَنَا مُهَنْدِسَةٌ","هُوَ مُهَنْدِسٌ"]},{"q":"How does a woman say \"I am a doctor\"?","a":"أَنَا طَبِيبَةٌ","w":["أَنَا طَبِيبٌ","هِيَ طَبِيبَةٌ"]},{"q":"How do you say \"he is a nurse\"?","a":"هُوَ مُمَرِّضٌ","w":["هِيَ مُمَرِّضَةٌ","أَنَا مُمَرِّضٌ"]},{"q":"How do you say \"she is a teacher\"?","a":"هِيَ مُدَرِّسَةٌ","w":["هُوَ مُدَرِّسٌ","أَنَا مُدَرِّسَةٌ"]},{"q":"How do you ask a man \"What is your job?\"","a":"مَا عَمَلُكَ؟","w":["مَا عَمَلُكِ؟","مَا اسْمُكَ؟"]},{"q":"How do you ask a woman \"What is your job?\"","a":"مَا عَمَلُكِ؟","w":["مَا عَمَلُكَ؟","مَا عَمَلُهَا؟"]},{"q":"How do you ask \"What is her job?\"","a":"مَا عَمَلُهَا؟","w":["مَا عَمَلُهُ؟","مَا عَمَلُكِ؟"]},{"q":"How does a man say \"I am Saudi\"?","a":"أَنَا سُعُودِيٌّ","w":["أَنَا سُعُودِيَّةٌ","هُوَ سُعُودِيٌّ"]},{"q":"How does a woman say \"I am Egyptian\"?","a":"أَنَا مِصْرِيَّةٌ","w":["أَنَا مِصْرِيٌّ","هِيَ مِصْرِيَّةٌ"]},{"q":"How do you say \"he is American\"?","a":"هُوَ أَمْرِيكِيٌّ","w":["هِيَ أَمْرِيكِيَّةٌ","أَنَا أَمْرِيكِيٌّ"]},{"q":"How do you ask a man \"What is your nationality?\"","a":"مَا جِنْسِيَّتُكَ؟","w":["مَا جِنْسِيَّتُكِ؟","مَا عَمَلُكَ؟"]},{"q":"How do you ask a man \"Where are you from?\"","a":"مِنْ أَيْنَ أَنْتَ؟","w":["مِنْ أَيْنَ أَنْتِ؟","مَا اسْمُكَ؟"]},{"q":"How do you ask a woman \"Where are you from?\"","a":"مِنْ أَيْنَ أَنْتِ؟","w":["مِنْ أَيْنَ أَنْتَ؟","كَيْفَ حَالُكِ؟"]},{"q":"How do you say \"I am from Egypt\"?","a":"أَنَا مِنْ مِصْرَ","w":["أَنَا مِصْرِيٌّ مِنْ","أَنَا مَعَ مِصْرَ"]},{"q":"How do you say \"she is from Jordan\"?","a":"هِيَ مِنَ الأُرْدُنِّ","w":["هُوَ مِنَ الأُرْدُنِّ","أَنَا مِنَ الأُرْدُنِّ"]},{"q":"Which word means \"place\"?","a":"مَكَانٌ","w":["مَدْرَسَةٌ","بَيْتٌ"]},{"q":"Which word means \"hospital\"?","a":"مُسْتَشْفًى","w":["شَرِكَةٌ","سُوقٌ"]},{"q":"Which word means \"company\"?","a":"شَرِكَةٌ","w":["سُوقٌ","مُسْتَشْفًى"]},{"q":"Which word means \"market\"?","a":"سُوقٌ","w":["شَرِكَةٌ","مَدْرَسَةٌ"]},{"q":"How do you say \"the teacher is in the school\"?","a":"المُدَرِّسُ فِي المَدْرَسَةِ","w":["المُدَرِّسُ مِنَ المَدْرَسَةِ","المَدْرَسَةُ فِي المُدَرِّسِ"]},{"q":"How do you say \"the doctor is in the hospital\"?","a":"الطَّبِيبُ فِي المُسْتَشْفَى","w":["الطَّبِيبُ فِي السُّوقِ","المُسْتَشْفَى فِي الطَّبِيبِ"]},{"q":"How do you say \"the merchant is in the market\"?","a":"التَّاجِرُ فِي السُّوقِ","w":["التَّاجِرُ فِي الشَّرِكَةِ","السُّوقُ فِي التَّاجِرِ"]},{"q":"How do you ask \"Where is the doctor?\"","a":"أَيْنَ الطَّبِيبُ؟","w":["مَنِ الطَّبِيبُ؟","كَمِ الطَّبِيبُ؟"]}],"conv":{"title":"مُحَادَثَةٌ: فِي المُسْتَشْفَى","lines":[{"w":"m","n":"يُوسُفُ","ar":"السَّلَامُ عَلَيْكُمْ. أَهْلًا وَسَهْلًا."},{"w":"f","n":"لَيْلَى","ar":"وَعَلَيْكُمُ السَّلَامُ. أَهْلًا وَسَهْلًا."},{"w":"m","n":"يُوسُفُ","ar":"مَا اسْمُكِ؟"},{"w":"f","n":"لَيْلَى","ar":"اِسْمِي لَيْلَى. وَمَا اسْمُكَ؟"},{"w":"m","n":"يُوسُفُ","ar":"اِسْمِي يُوسُفُ. تَشَرَّفْنَا."},{"w":"f","n":"لَيْلَى","ar":"تَشَرَّفْنَا. مِنْ أَيْنَ أَنْتَ؟"},{"w":"m","n":"يُوسُفُ","ar":"أَنَا مِنْ مِصْرَ. أَنَا مِصْرِيٌّ. وَمِنْ أَيْنَ أَنْتِ؟"},{"w":"f","n":"لَيْلَى","ar":"أَنَا مِنَ الأُرْدُنِّ. أَنَا أُرْدُنِّيَّةٌ."},{"w":"m","n":"يُوسُفُ","ar":"مَا عَمَلُكِ؟"},{"w":"f","n":"لَيْلَى","ar":"أَنَا مُمَرِّضَةٌ. وَمَا عَمَلُكَ؟"},{"w":"m","n":"يُوسُفُ","ar":"أَنَا طَبِيبٌ."},{"w":"f","n":"لَيْلَى","ar":"الحَمْدُ لِلَّهِ. هَلْ عِنْدَكَ أَخٌ؟"},{"w":"m","n":"يُوسُفُ","ar":"نَعَمْ، عِنْدِي أَخٌ وَأُخْتٌ. أَخِي مُهَنْدِسٌ وَأُخْتِي مُدَرِّسَةٌ."},{"w":"f","n":"لَيْلَى","ar":"شُكْرًا."},{"w":"m","n":"يُوسُفُ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."},{"w":"f","n":"لَيْلَى","ar":"مَعَ السَّلَامَةِ."}],"qs":[{"q":"Where is Yusuf from?","a":"مِنْ مِصْرَ","w":["مِنَ الأُرْدُنِّ","مِنَ السُّعُودِيَّةِ"]},{"q":"Where is Layla from?","a":"مِنَ الأُرْدُنِّ","w":["مِنْ مِصْرَ","مِنَ الهِنْدِ"]},{"q":"What is Layla's nationality?","a":"أُرْدُنِّيَّةٌ","w":["مِصْرِيَّةٌ","سُعُودِيَّةٌ"]},{"q":"What is Yusuf's nationality?","a":"مِصْرِيٌّ","w":["أُرْدُنِّيٌّ","هِنْدِيٌّ"]},{"q":"What is Layla's job?","a":"مُمَرِّضَةٌ","w":["طَبِيبَةٌ","مُدَرِّسَةٌ"]},{"q":"What is Yusuf's job?","a":"طَبِيبٌ","w":["مُمَرِّضٌ","مُهَنْدِسٌ"]},{"q":"What is Yusuf's brother's job?","a":"مُهَنْدِسٌ","w":["طَبِيبٌ","مُدَرِّسٌ"]},{"q":"What is Yusuf's sister's job?","a":"مُدَرِّسَةٌ","w":["مُمَرِّضَةٌ","طَبِيبَةٌ"]},{"q":"What does Layla ask Yusuf after they say تَشَرَّفْنَا?","a":"مِنْ أَيْنَ أَنْتَ؟","w":["مَا عَمَلُكَ؟","هَلْ عِنْدَكَ أَخٌ؟"]},{"q":"How does Yusuf answer when he hears her name?","a":"تَشَرَّفْنَا","w":["عَفْوًا","مَرْحَبًا"]},{"q":"What does Yusuf say after Layla thanks him?","a":"عَفْوًا","w":["تَشَرَّفْنَا","مَا شَاءَ اللَّهُ"]},{"q":"How does Layla say goodbye?","a":"مَعَ السَّلَامَةِ","w":["صَبَاحُ الخَيْرِ","شُكْرًا"]}]},"id":"1-1-5"},{"stage":1,"level":1,"order":9,"titleAr":"البَيْتُ وَالأَمَاكِنُ","titleEn":"The House and Places","about":"Describe your home and the places in your town. You will learn the rooms of a house, places in a city, how to say where something is with فِي, عَلَى, تَحْتَ and أَمَامَ, how to say \"here\" and \"there\", and how to say where you live.","rules":[{"title":"Rooms in the house (غُرَفُ البَيْتِ)","body":"غُرْفَةٌ means \"room\". The plural of غُرْفَةٌ is غُرَفٌ. Learn the main rooms of a home.","ex":[{"ar":"هَذِهِ غُرْفَةٌ","tr":"hādhihi ghurfatun","en":"this is a room","note":"غُرْفَةٌ is feminine, so we use هَذِهِ."},{"ar":"هَذَا مَطْبَخٌ","tr":"hādhā maṭbakhun","en":"this is a kitchen","note":"مَطْبَخٌ is masculine. It comes from the place where we cook."},{"ar":"هَذَا حَمَّامٌ","tr":"hādhā ḥammāmun","en":"this is a bathroom","note":"The doubled م stays doubled."},{"ar":"هَذِهِ غُرْفَةُ النَّوْمِ","tr":"hādhihi ghurfatu n-nawmi","en":"this is the bedroom","note":"غُرْفَةُ النَّوْمِ means \"room of sleep\"."},{"ar":"هَذِهِ غُرْفَةُ الجُلُوسِ","tr":"hādhihi ghurfatu l-julūsi","en":"this is the living room","note":"غُرْفَةُ الجُلُوسِ means \"room of sitting\"."},{"ar":"هَذِهِ حَدِيقَةٌ","tr":"hādhihi ḥadīqatun","en":"this is a garden","note":"حَدِيقَةٌ is feminine."},{"ar":"هَذَا سَرِيرٌ","tr":"hādhā sarīrun","en":"this is a bed","note":"Its plural is أَسِرَّةٌ."}]},{"title":"Places in the city (الأَمَاكِنُ)","body":"مَدِينَةٌ means \"city\". Learn the main places you can find in one.","ex":[{"ar":"هَذَا مَسْجِدٌ","tr":"hādhā masjidun","en":"this is a mosque","note":"Its plural is مَسَاجِدُ."},{"ar":"هَذَا سُوقٌ","tr":"hādhā sūqun","en":"this is a market","note":"Its plural is أَسْوَاقٌ."},{"ar":"هَذَا مُسْتَشْفًى","tr":"hādhā mustashfan","en":"this is a hospital","note":"Its plural is مُسْتَشْفَيَاتٌ."},{"ar":"هَذَا مَطَارٌ","tr":"hādhā maṭārun","en":"this is an airport","note":"Its plural is مَطَارَاتٌ."},{"ar":"هَذَا شَارِعٌ","tr":"hādhā shāriʿun","en":"this is a street","note":"Its plural is شَوَارِعُ."},{"ar":"هَذِهِ مَدِينَةٌ","tr":"hādhihi madīnatun","en":"this is a city","note":"Its plural is مُدُنٌ."},{"ar":"هَذِهِ جَامِعَةٌ","tr":"hādhihi jāmiʿatun","en":"this is a university","note":"Its plural is جَامِعَاتٌ."}]},{"title":"Where is it? (أَيْنَ؟)","body":"Ask أَيْنَ to find a place. The answer uses فِي, which means \"in\". The word after فِي ends with ـِ.","ex":[{"ar":"أَيْنَ المَطْبَخُ؟","tr":"ayna l-maṭbakhu","en":"where is the kitchen?","note":"أَيْنَ comes first in the question."},{"ar":"المَطْبَخُ فِي البَيْتِ","tr":"al-maṭbakhu fī l-bayti","en":"the kitchen is in the house","re":true,"note":"البَيْتُ becomes البَيْتِ after فِي."},{"ar":"أَيْنَ الكِتَابُ؟","tr":"ayna l-kitābu","en":"where is the book?","note":"Ask about any thing."},{"ar":"الكِتَابُ فِي الحَقِيبَةِ","tr":"al-kitābu fī l-ḥaqībati","en":"the book is in the bag","re":true,"note":"الحَقِيبَةُ becomes الحَقِيبَةِ after فِي."},{"ar":"أَيْنَ الطَّالِبُ؟","tr":"ayna ṭ-ṭālibu","en":"where is the student?","note":"Ask about a person."},{"ar":"الطَّالِبُ فِي الفَصْلِ","tr":"aṭ-ṭālibu fī l-faṣli","en":"the student is in the class","re":true,"note":"الفَصْلُ becomes الفَصْلِ after فِي."},{"ar":"أَيْنَ أَبُوكَ؟","tr":"ayna abūka","en":"where is your father?","note":"When you add ـكَ to أَبٌ, it becomes أَبُوكَ."},{"ar":"أَبِي فِي المَسْجِدِ","tr":"abī fī l-masjidi","en":"my father is in the mosque","re":true,"note":"المَسْجِدُ becomes المَسْجِدِ after فِي."}]},{"title":"On, under and in front of (عَلَى وَتَحْتَ وَأَمَامَ)","body":"These small words tell you where something is. The noun after them ends with ـِ.\n- عَلَى is \"on\".\n- تَحْتَ is \"under\".\n- أَمَامَ is \"in front of\".\n- خَلْفَ is \"behind\".\n- بِجَانِبِ is \"beside\".","ex":[{"ar":"الكِتَابُ عَلَى المَكْتَبِ","tr":"al-kitābu ʿalā l-maktabi","en":"the book is on the desk","note":"المَكْتَبُ becomes المَكْتَبِ after عَلَى."},{"ar":"القَلَمُ تَحْتَ الكُرْسِيِّ","tr":"al-qalamu taḥta l-kursiyyi","en":"the pen is under the chair","note":"الكُرْسِيُّ becomes الكُرْسِيِّ after تَحْتَ."},{"ar":"السَّيَّارَةُ أَمَامَ البَيْتِ","tr":"as-sayyāratu amāma l-bayti","en":"the car is in front of the house","note":"أَمَامَ ends with ـَ, and the next word ends with ـِ."},{"ar":"الحَدِيقَةُ خَلْفَ البَيْتِ","tr":"al-ḥadīqatu khalfa l-bayti","en":"the garden is behind the house","note":"خَلْفَ means \"behind\"."},{"ar":"المَدْرَسَةُ بِجَانِبِ المَسْجِدِ","tr":"al-madrasatu bi-jānibi l-masjidi","en":"the school is beside the mosque","note":"بِجَانِبِ means \"beside\"."},{"ar":"المُعَلِّمُ أَمَامَ السَّبُّورَةِ","tr":"al-muʿallimu amāma s-sabbūrati","en":"the teacher is in front of the board","note":"You learned السَّبُّورَةُ in Unit 3."}]},{"title":"Here and there (هُنَا وَهُنَاكَ)","body":"هُنَا means \"here\" and هُنَاكَ means \"there\". Put a place first and then the little word فِي to say something exists in it. In Arabic, the place comes first for \"there is\": فِي البَيْتِ غُرْفَةٌ means \"in the house there is a room\".","ex":[{"ar":"أَنَا هُنَا","tr":"anā hunā","en":"I am here","note":"هُنَا means \"here\"."},{"ar":"هُوَ هُنَاكَ","tr":"huwa hunāka","en":"he is there","note":"هُنَاكَ means \"there\"."},{"ar":"فِي البَيْتِ غُرْفَةٌ","tr":"fī l-bayti ghurfatun","en":"in the house there is a room","note":"The place comes first; the thing comes after and has tanween."},{"ar":"فِي البَيْتِ ثَلَاثُ غُرَفٍ","tr":"fī l-bayti thalāthu ghurafin","en":"in the house there are three rooms","note":"غُرْفَةٌ is feminine, so the number drops ـَةٌ."},{"ar":"فِي المَدِينَةِ مَسْجِدٌ كَبِيرٌ","tr":"fī l-madīnati masjidun kabīrun","en":"in the city there is a big mosque","note":"Remember to put the describing word after the noun."}]},{"title":"Where do you live? (أَيْنَ تَسْكُنُ؟)","body":"أَسْكُنُ means \"I live\". Ask a man أَيْنَ تَسْكُنُ؟ and a woman أَيْنَ تَسْكُنِينَ؟ Answer أَسْكُنُ فِي and the city.","ex":[{"ar":"أَيْنَ تَسْكُنُ؟","tr":"ayna taskunu","en":"where do you live? (to a man)","note":"تَسْكُنُ means \"you live\" for a man."},{"ar":"أَسْكُنُ فِي الرِّيَاضِ","tr":"askunu fī r-riyāḍi","en":"I live in Riyadh","re":true,"note":"الرِّيَاضُ becomes الرِّيَاضِ after فِي."},{"ar":"أَيْنَ تَسْكُنِينَ؟","tr":"ayna taskunīna","en":"where do you live? (to a woman)","note":"For a woman, add ـِينَ."},{"ar":"أَسْكُنُ فِي القَاهِرَةِ","tr":"askunu fī l-qāhirati","en":"I live in Cairo","re":true,"note":"القَاهِرَةُ becomes القَاهِرَةِ after فِي."},{"ar":"أَسْكُنُ فِي جُدَّةَ","tr":"askunu fī juddata","en":"I live in Jeddah","note":"جُدَّةُ is a city on the Red Sea. A city name without ال has no tanween."},{"ar":"أَسْكُنُ فِي بَيْتٍ كَبِيرٍ","tr":"askunu fī baytin kabīrin","en":"I live in a big house","note":"بَيْتٌ becomes بَيْتٍ after فِي."}]}],"words":[{"ar":"غُرْفَةٌ","pl":"غُرَفٌ","en":"room","type":"noun"},{"ar":"مَطْبَخٌ","pl":"مَطَابِخُ","en":"kitchen","type":"noun"},{"ar":"حَمَّامٌ","pl":"حَمَّامَاتٌ","en":"bathroom","type":"noun"},{"ar":"غُرْفَةُ النَّوْمِ","pl":"غُرَفُ النَّوْمِ","en":"bedroom","type":"noun"},{"ar":"غُرْفَةُ الجُلُوسِ","pl":"غُرَفُ الجُلُوسِ","en":"living room","type":"noun"},{"ar":"حَدِيقَةٌ","pl":"حَدَائِقُ","en":"garden","type":"noun"},{"ar":"سَرِيرٌ","pl":"أَسِرَّةٌ","en":"bed","type":"noun"},{"ar":"مَطَارٌ","pl":"مَطَارَاتٌ","en":"airport","type":"noun"},{"ar":"شَارِعٌ","pl":"شَوَارِعُ","en":"street","type":"noun"},{"ar":"مَدِينَةٌ","pl":"مُدُنٌ","en":"city","type":"noun"},{"ar":"جَامِعَةٌ","pl":"جَامِعَاتٌ","en":"university","type":"noun"},{"ar":"هُنَا","pl":"","en":"here","type":"adverb"},{"ar":"هُنَاكَ","pl":"","en":"there","type":"adverb"},{"ar":"تَحْتَ","pl":"","en":"under","type":"preposition"},{"ar":"أَمَامَ","pl":"","en":"in front of","type":"preposition"},{"ar":"خَلْفَ","pl":"","en":"behind","type":"preposition"},{"ar":"بِجَانِبِ","pl":"","en":"beside","type":"preposition"},{"ar":"أَسْكُنُ","pl":"","en":"I live","type":"verb"}],"qs":[{"q":"Which word means \"room\"?","a":"غُرْفَةٌ","w":["مَطْبَخٌ","حَمَّامٌ"]},{"q":"Which word means \"kitchen\"?","a":"مَطْبَخٌ","w":["حَمَّامٌ","سَرِيرٌ"]},{"q":"Which word means \"bathroom\"?","a":"حَمَّامٌ","w":["مَطْبَخٌ","حَدِيقَةٌ"]},{"q":"Which word means \"bedroom\"?","a":"غُرْفَةُ النَّوْمِ","w":["غُرْفَةُ الجُلُوسِ","مَطْبَخٌ"]},{"q":"Which word means \"living room\"?","a":"غُرْفَةُ الجُلُوسِ","w":["غُرْفَةُ النَّوْمِ","حَمَّامٌ"]},{"q":"Which word means \"garden\"?","a":"حَدِيقَةٌ","w":["غُرْفَةٌ","جَامِعَةٌ"]},{"q":"Which word means \"bed\"?","a":"سَرِيرٌ","w":["كُرْسِيٌّ","مَكْتَبٌ"]},{"q":"Which word means \"mosque\"?","a":"مَسْجِدٌ","w":["مَدْرَسَةٌ","سُوقٌ"]},{"q":"Which word means \"market\"?","a":"سُوقٌ","w":["مَسْجِدٌ","شَارِعٌ"]},{"q":"Which word means \"hospital\"?","a":"مُسْتَشْفًى","w":["مَطَارٌ","جَامِعَةٌ"]},{"q":"Which word means \"airport\"?","a":"مَطَارٌ","w":["مُسْتَشْفًى","مَدِينَةٌ"]},{"q":"Which word means \"street\"?","a":"شَارِعٌ","w":["سُوقٌ","مَدِينَةٌ"]},{"q":"Which word means \"city\"?","a":"مَدِينَةٌ","w":["شَارِعٌ","جَامِعَةٌ"]},{"q":"Which word means \"university\"?","a":"جَامِعَةٌ","w":["مَدْرَسَةٌ","مَكْتَبَةٌ"]},{"q":"Which word means \"here\"?","a":"هُنَا","w":["هُنَاكَ","أَيْنَ"]},{"q":"Which word means \"there\"?","a":"هُنَاكَ","w":["هُنَا","مِنْ"]},{"q":"What is the plural of غُرْفَةٌ?","a":"غُرَفٌ","w":["أُسَرٌ","كُتُبٌ"]},{"q":"How do you say \"the kitchen is in the house\"?","a":"المَطْبَخُ فِي البَيْتِ","w":["المَطْبَخُ فِي البَيْتُ","المَطْبَخُ عَلَى البَيْتِ"]},{"q":"How do you say \"the book is in the bag\"?","a":"الكِتَابُ فِي الحَقِيبَةِ","w":["الكِتَابُ تَحْتَ الحَقِيبَةِ","الحَقِيبَةُ فِي الكِتَابِ"]},{"q":"How do you say \"the book is on the desk\"?","a":"الكِتَابُ عَلَى المَكْتَبِ","w":["الكِتَابُ تَحْتَ المَكْتَبِ","الكِتَابُ أَمَامَ المَكْتَبِ"]},{"q":"How do you say \"the pen is under the chair\"?","a":"القَلَمُ تَحْتَ الكُرْسِيِّ","w":["القَلَمُ عَلَى الكُرْسِيِّ","القَلَمُ خَلْفَ الكُرْسِيِّ"]},{"q":"How do you say \"the car is in front of the house\"?","a":"السَّيَّارَةُ أَمَامَ البَيْتِ","w":["السَّيَّارَةُ خَلْفَ البَيْتِ","السَّيَّارَةُ فِي البَيْتِ"]},{"q":"How do you say \"the garden is behind the house\"?","a":"الحَدِيقَةُ خَلْفَ البَيْتِ","w":["الحَدِيقَةُ أَمَامَ البَيْتِ","الحَدِيقَةُ عَلَى البَيْتِ"]},{"q":"How do you say \"the school is beside the mosque\"?","a":"المَدْرَسَةُ بِجَانِبِ المَسْجِدِ","w":["المَدْرَسَةُ تَحْتَ المَسْجِدِ","المَسْجِدُ بِجَانِبِ المَدْرَسَةِ"]},{"q":"How do you ask \"Where is the book?\"","a":"أَيْنَ الكِتَابُ؟","w":["مَنِ الكِتَابُ؟","مَا الكِتَابُ؟"]},{"q":"How do you say \"in the house there is a room\"?","a":"فِي البَيْتِ غُرْفَةٌ","w":["غُرْفَةٌ فِي البَيْتُ","فِي بَيْتٍ الغُرْفَةُ"]},{"q":"How do you say \"in the house there are three rooms\"?","a":"فِي البَيْتِ ثَلَاثُ غُرَفٍ","w":["فِي البَيْتِ ثَلَاثَةُ غُرَفٍ","ثَلَاثُ غُرَفٍ البَيْتِ"]},{"q":"How does a man ask \"Where do you live?\"","a":"أَيْنَ تَسْكُنُ؟","w":["أَيْنَ تَسْكُنِينَ؟","مِنْ أَيْنَ أَنْتَ؟"]},{"q":"How do you say \"I live in Riyadh\"?","a":"أَسْكُنُ فِي الرِّيَاضِ","w":["أَنَا مِنَ الرِّيَاضِ","أَسْكُنُ مِنَ الرِّيَاضِ"]}],"conv":{"title":"مُحَادَثَةٌ: بَيْتٌ جَدِيدٌ","lines":[{"w":"m","n":"عُمَرُ","ar":"السَّلَامُ عَلَيْكُمْ. كَيْفَ حَالُكِ؟"},{"w":"f","n":"عَائِشَةُ","ar":"وَعَلَيْكُمُ السَّلَامُ. بِخَيْرٍ، الحَمْدُ لِلَّهِ. وَأَنْتَ؟"},{"w":"m","n":"عُمَرُ","ar":"بِخَيْرٍ، شُكْرًا. أَيْنَ تَسْكُنِينَ؟"},{"w":"f","n":"عَائِشَةُ","ar":"أَسْكُنُ فِي الرِّيَاضِ، فِي بَيْتٍ جَدِيدٍ. وَأَنْتَ؟"},{"w":"m","n":"عُمَرُ","ar":"أَسْكُنُ فِي جُدَّةَ. هَلْ بَيْتُكِ كَبِيرٌ؟"},{"w":"f","n":"عَائِشَةُ","ar":"نَعَمْ، فِي البَيْتِ خَمْسُ غُرَفٍ وَحَدِيقَةٌ جَمِيلَةٌ."},{"w":"m","n":"عُمَرُ","ar":"مَا شَاءَ اللَّهُ! أَيْنَ الحَدِيقَةُ؟"},{"w":"f","n":"عَائِشَةُ","ar":"الحَدِيقَةُ خَلْفَ البَيْتِ، وَالسَّيَّارَةُ أَمَامَ البَيْتِ."},{"w":"m","n":"عُمَرُ","ar":"وَأَيْنَ المَدْرَسَةُ؟"},{"w":"f","n":"عَائِشَةُ","ar":"المَدْرَسَةُ بِجَانِبِ المَسْجِدِ."},{"w":"m","n":"عُمَرُ","ar":"الحَمْدُ لِلَّهِ. شُكْرًا."},{"w":"f","n":"عَائِشَةُ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."}],"qs":[{"q":"Where does Aisha live?","a":"فِي الرِّيَاضِ","w":["فِي جُدَّةَ","فِي القَاهِرَةِ"]},{"q":"Where does Omar live?","a":"فِي جُدَّةَ","w":["فِي الرِّيَاضِ","فِي القَاهِرَةِ"]},{"q":"What kind of house does Aisha have?","a":"بَيْتٌ جَدِيدٌ","w":["بَيْتٌ قَدِيمٌ","بَيْتٌ صَغِيرٌ"]},{"q":"How many rooms are in Aisha's house?","a":"خَمْسُ غُرَفٍ","w":["ثَلَاثُ غُرَفٍ","عَشْرُ غُرَفٍ"]},{"q":"What else is in the house?","a":"حَدِيقَةٌ جَمِيلَةٌ","w":["مَطَارٌ كَبِيرٌ","سُوقٌ جَدِيدٌ"]},{"q":"Where is the garden?","a":"خَلْفَ البَيْتِ","w":["أَمَامَ البَيْتِ","عَلَى البَيْتِ"]},{"q":"Where is the car?","a":"أَمَامَ البَيْتِ","w":["خَلْفَ البَيْتِ","تَحْتَ البَيْتِ"]},{"q":"Where is the school?","a":"بِجَانِبِ المَسْجِدِ","w":["أَمَامَ المَسْجِدِ","فِي المَسْجِدِ"]},{"q":"How does Omar ask about Aisha's house?","a":"هَلْ بَيْتُكِ كَبِيرٌ؟","w":["أَيْنَ بَيْتُكِ؟","مَا لَوْنُ بَيْتِكِ؟"]},{"q":"How does Aisha answer his greeting?","a":"وَعَلَيْكُمُ السَّلَامُ","w":["مَعَ السَّلَامَةِ","عَفْوًا"]}]},"id":"1-1-9"},{"stage":1,"level":1,"order":10,"titleAr":"الأَيَّامُ وَالحَيَاةُ اليَوْمِيَّةُ","titleEn":"Days and Daily Life","about":"Talk about your week and your day. You will learn the days of the week, today, tomorrow and yesterday, the parts of the day, and your first everyday verbs such as I go, I eat and I study. This unit closes Level 1.","rules":[{"title":"The days of the week (أَيَّامُ الأُسْبُوعِ)","body":"يَوْمٌ means \"day\" and أُسْبُوعٌ means \"week\". The Arabic week begins on Sunday. Learn the seven days in order. Friday, الجُمُعَةُ, is the day of the weekly congregational prayer.","ex":[{"ar":"الأَحَدُ","tr":"al-aḥadu","en":"Sunday","note":"It comes from وَاحِدٌ, because it is the first day."},{"ar":"الِاثْنَيْنِ","tr":"al-ithnayni","en":"Monday","note":"It comes from اِثْنَانِ, because it is the second day."},{"ar":"الثُّلَاثَاءُ","tr":"ath-thulāthāʾu","en":"Tuesday","note":"It comes from ثَلَاثَةٌ, the third day."},{"ar":"الأَرْبِعَاءُ","tr":"al-arbiʿāʾu","en":"Wednesday","note":"It comes from أَرْبَعَةٌ, the fourth day."},{"ar":"الخَمِيسُ","tr":"al-khamīsu","en":"Thursday","note":"It comes from خَمْسَةٌ, the fifth day."},{"ar":"الجُمُعَةُ","tr":"al-jumuʿatu","en":"Friday","note":"It means \"the gathering\"."},{"ar":"السَّبْتُ","tr":"as-sabtu","en":"Saturday","note":"The last day of the week."}]},{"title":"Today, tomorrow and yesterday (اليَوْمَ وَغَدًا وَأَمْسِ)","body":"اليَوْمَ means \"today\", غَدًا means \"tomorrow\" and أَمْسِ means \"yesterday\". Ask مَا هُوَ اليَوْمُ؟ for \"what day is it?\" and answer اليَوْمُ and the day.","ex":[{"ar":"مَا هُوَ اليَوْمُ؟","tr":"mā huwa l-yawmu","en":"what day is it today?","note":"اليَوْمُ here means \"the day\"."},{"ar":"اليَوْمُ الجُمُعَةُ","tr":"al-yawmu l-jumuʿatu","en":"today is Friday","re":true,"note":"No word for \"is\" is needed."},{"ar":"غَدًا السَّبْتُ","tr":"ghadan as-sabtu","en":"tomorrow is Saturday","note":"غَدًا ends with ـًا."},{"ar":"أَمْسِ كَانَ الخَمِيسُ","tr":"amsi kāna l-khamīsu","en":"yesterday was Thursday","note":"كَانَ means \"was\". It is a word you will meet often."},{"ar":"أَنَا هُنَا اليَوْمَ","tr":"anā hunā l-yawma","en":"I am here today","note":"اليَوْمَ ends with ـَ when it means \"today\" in a sentence like this."},{"ar":"غَدًا أَنَا فِي المَدْرَسَةِ","tr":"ghadan anā fī l-madrasati","en":"tomorrow I am at school","note":"Put غَدًا first, then the sentence."}]},{"title":"Parts of the day (أَوْقَاتُ اليَوْمِ)","body":"Say فِي and a part of the day. The word after فِي ends with ـِ. صَبَاحٌ is morning, ظُهْرٌ is noon, مَسَاءٌ is evening and لَيْلٌ is night.","ex":[{"ar":"فِي الصَّبَاحِ","tr":"fī ṣ-ṣabāḥi","en":"in the morning","note":"الصَّبَاحُ becomes الصَّبَاحِ after فِي."},{"ar":"فِي الظُّهْرِ","tr":"fī ẓ-ẓuhri","en":"at noon","note":"ظُهْرٌ is the middle of the day."},{"ar":"فِي المَسَاءِ","tr":"fī l-masāʾi","en":"in the evening","note":"المَسَاءُ becomes المَسَاءِ after فِي."},{"ar":"فِي اللَّيْلِ","tr":"fī l-layli","en":"at night","note":"In اللَّيْلِ, the ل of ال joins the ل of لَيْلٌ."},{"ar":"صَبَاحُ الخَيْرِ","tr":"ṣabāḥu l-khayri","en":"good morning","note":"You learned this greeting in Unit 2."},{"ar":"صَبَاحُ النُّورِ","tr":"ṣabāḥu n-nūri","en":"good morning to you (literally \"morning of light\")","re":true,"note":"This is the usual reply. نُورٌ means \"light\"."}]},{"title":"My day (يَوْمِي)","body":"Here are the verbs of a normal day. Each starts with أَ because the person is \"I\". The endings stay the same for these verbs: ـُ.","ex":[{"ar":"أَذْهَبُ إِلَى المَدْرَسَةِ","tr":"adhhabu ilā l-madrasati","en":"I go to school","note":"إِلَى means \"to\". The next word ends with ـِ."},{"ar":"آكُلُ الخُبْزَ","tr":"ākulu l-khubza","en":"I eat bread","note":"آكُلُ has a long آ at the start."},{"ar":"أَشْرَبُ القَهْوَةَ","tr":"ashrabu l-qahwata","en":"I drink coffee","note":"The thing you drink ends with ـَ."},{"ar":"أَدْرُسُ العَرَبِيَّةَ","tr":"adrusu l-ʿarabiyyata","en":"I study Arabic","note":"العَرَبِيَّةُ becomes العَرَبِيَّةَ after the verb."},{"ar":"أَعْمَلُ فِي المُسْتَشْفَى","tr":"aʿmalu fī l-mustashfā","en":"I work in the hospital","note":"After فِي, مُسْتَشْفًى stays the same because it ends with a long vowel."},{"ar":"أَقْرَأُ كِتَابًا","tr":"aqraʾu kitāban","en":"I read a book","note":"كِتَابٌ becomes كِتَابًا after the verb."},{"ar":"أَنَامُ فِي اللَّيْلِ","tr":"anāmu fī l-layli","en":"I sleep at night","note":"أَنَامُ has a long vowel."}]},{"title":"He, she, you (هُوَ وَهِيَ وَأَنْتَ)","body":"Change the first letter of the verb to change the person. أَ means \"I\". يَ means \"he\". تَ means \"she\" or \"you\" (to a man). تَ ... ينَ means \"you\" (to a woman). Watch the context to see who is meant.","ex":[{"ar":"أَذْهَبُ","tr":"adhhabu","en":"I go","note":"أَ means \"I\"."},{"ar":"يَذْهَبُ","tr":"yadhhabu","en":"he goes","note":"يَ means \"he\"."},{"ar":"تَذْهَبُ","tr":"tadhhabu","en":"she goes, or you go (to a man)","note":"تَ can mean \"she\" or \"you\" (to a man)."},{"ar":"تَذْهَبِينَ","tr":"tadhhabīna","en":"you go (to a woman)","note":"Add ـِينَ for \"you\" to a woman."},{"ar":"هُوَ يَشْرَبُ الشَّايَ","tr":"huwa yashrabu sh-shāya","en":"he drinks tea","note":"يَشْرَبُ is the \"he\" form of أَشْرَبُ."},{"ar":"هِيَ تَدْرُسُ فِي الجَامِعَةِ","tr":"hiya tadrusu fī l-jāmiʿati","en":"she studies at the university","note":"تَدْرُسُ is the \"she\" form of أَدْرُسُ."},{"ar":"مَاذَا تَفْعَلُ اليَوْمَ؟","tr":"mādhā tafʿalu l-yawma","en":"what do you do today? (to a man)","note":"مَاذَا means \"what\". تَفْعَلُ means \"you do\"."},{"ar":"أَذْهَبُ إِلَى السُّوقِ","tr":"adhhabu ilā s-sūqi","en":"I go to the market","re":true,"note":"Answer with the \"I\" verb."},{"ar":"مَاذَا تَفْعَلِينَ غَدًا؟","tr":"mādhā tafʿalīna ghadan","en":"what do you do tomorrow? (to a woman)","note":"For a woman, add ـِينَ: تَفْعَلُ becomes تَفْعَلِينَ."},{"ar":"مَتَى تَنَامِينَ؟","tr":"matā tanāmīna","en":"when do you sleep? (to a woman)","note":"مَتَى means \"when\". You learned it in Unit 2."},{"ar":"أَنَامُ فِي اللَّيْلِ","tr":"anāmu fī l-layli","en":"I sleep at night","re":true,"note":"Use the \"I\" verb in your answer."}]}],"words":[{"ar":"يَوْمٌ","pl":"أَيَّامٌ","en":"day","type":"noun"},{"ar":"أُسْبُوعٌ","pl":"أَسَابِيعُ","en":"week","type":"noun"},{"ar":"الأَحَدُ","pl":"","en":"Sunday","type":"noun"},{"ar":"الِاثْنَيْنِ","pl":"","en":"Monday","type":"noun"},{"ar":"الثُّلَاثَاءُ","pl":"","en":"Tuesday","type":"noun"},{"ar":"الأَرْبِعَاءُ","pl":"","en":"Wednesday","type":"noun"},{"ar":"الخَمِيسُ","pl":"","en":"Thursday","type":"noun"},{"ar":"الجُمُعَةُ","pl":"","en":"Friday","type":"noun"},{"ar":"السَّبْتُ","pl":"","en":"Saturday","type":"noun"},{"ar":"اليَوْمَ","pl":"","en":"today","type":"adverb"},{"ar":"غَدًا","pl":"","en":"tomorrow","type":"adverb"},{"ar":"أَمْسِ","pl":"","en":"yesterday","type":"adverb"},{"ar":"صَبَاحٌ","pl":"","en":"morning","type":"noun"},{"ar":"مَسَاءٌ","pl":"","en":"evening","type":"noun"},{"ar":"لَيْلٌ","pl":"","en":"night","type":"noun"},{"ar":"نُورٌ","pl":"أَنْوَارٌ","en":"light","type":"noun"},{"ar":"أَذْهَبُ","pl":"","en":"I go","type":"verb"},{"ar":"آكُلُ","pl":"","en":"I eat","type":"verb"},{"ar":"أَشْرَبُ","pl":"","en":"I drink","type":"verb"},{"ar":"أَدْرُسُ","pl":"","en":"I study","type":"verb"},{"ar":"أَعْمَلُ","pl":"","en":"I work","type":"verb"},{"ar":"أَقْرَأُ","pl":"","en":"I read","type":"verb"},{"ar":"أَنَامُ","pl":"","en":"I sleep","type":"verb"},{"ar":"كَانَ","pl":"","en":"was","type":"verb"},{"ar":"مَاذَا","pl":"","en":"what (with a verb)","type":"question word"}],"qs":[{"q":"Which word means \"day\"?","a":"يَوْمٌ","w":["أُسْبُوعٌ","لَيْلٌ"]},{"q":"Which word means \"week\"?","a":"أُسْبُوعٌ","w":["يَوْمٌ","سَنَةٌ"]},{"q":"Which word means \"Sunday\"?","a":"الأَحَدُ","w":["الِاثْنَيْنِ","السَّبْتُ"]},{"q":"Which word means \"Monday\"?","a":"الِاثْنَيْنِ","w":["الأَحَدُ","الثُّلَاثَاءُ"]},{"q":"Which word means \"Tuesday\"?","a":"الثُّلَاثَاءُ","w":["الأَرْبِعَاءُ","الِاثْنَيْنِ"]},{"q":"Which word means \"Wednesday\"?","a":"الأَرْبِعَاءُ","w":["الثُّلَاثَاءُ","الخَمِيسُ"]},{"q":"Which word means \"Thursday\"?","a":"الخَمِيسُ","w":["الجُمُعَةُ","الأَرْبِعَاءُ"]},{"q":"Which word means \"Friday\"?","a":"الجُمُعَةُ","w":["الخَمِيسُ","السَّبْتُ"]},{"q":"Which word means \"Saturday\"?","a":"السَّبْتُ","w":["الجُمُعَةُ","الأَحَدُ"]},{"q":"Which word means \"today\"?","a":"اليَوْمَ","w":["غَدًا","أَمْسِ"]},{"q":"Which word means \"tomorrow\"?","a":"غَدًا","w":["اليَوْمَ","أَمْسِ"]},{"q":"Which word means \"yesterday\"?","a":"أَمْسِ","w":["غَدًا","اليَوْمَ"]},{"q":"Which word means \"morning\"?","a":"صَبَاحٌ","w":["مَسَاءٌ","لَيْلٌ"]},{"q":"Which word means \"evening\"?","a":"مَسَاءٌ","w":["صَبَاحٌ","ظُهْرٌ"]},{"q":"Which word means \"night\"?","a":"لَيْلٌ","w":["ظُهْرٌ","صَبَاحٌ"]},{"q":"Which word means \"I go\"?","a":"أَذْهَبُ","w":["أَشْرَبُ","أَقْرَأُ"]},{"q":"Which word means \"I eat\"?","a":"آكُلُ","w":["أَنَامُ","أَدْرُسُ"]},{"q":"Which word means \"I sleep\"?","a":"أَنَامُ","w":["أَعْمَلُ","آكُلُ"]},{"q":"How do you ask \"What day is it today?\"","a":"مَا هُوَ اليَوْمُ؟","w":["مَا اسْمُ اليَوْمِ؟","كَمِ اليَوْمُ؟"]},{"q":"How do you say \"today is Friday\"?","a":"اليَوْمُ الجُمُعَةُ","w":["غَدًا الجُمُعَةُ","أَمْسِ الجُمُعَةُ"]},{"q":"How do you say \"tomorrow is Saturday\"?","a":"غَدًا السَّبْتُ","w":["اليَوْمُ السَّبْتُ","أَمْسِ السَّبْتُ"]},{"q":"How do you say \"in the morning\"?","a":"فِي الصَّبَاحِ","w":["فِي الصَّبَاحُ","مِنَ الصَّبَاحِ"]},{"q":"How do you say \"at night\"?","a":"فِي اللَّيْلِ","w":["فِي لَيْلٌ","عَلَى اللَّيْلِ"]},{"q":"How do you say \"I go to school\"?","a":"أَذْهَبُ إِلَى المَدْرَسَةِ","w":["أَذْهَبُ فِي المَدْرَسَةِ","يَذْهَبُ إِلَى المَدْرَسَةِ"]},{"q":"How do you say \"I drink coffee\"?","a":"أَشْرَبُ القَهْوَةَ","w":["آكُلُ القَهْوَةَ","أَشْرَبُ القَهْوَةُ"]},{"q":"How do you say \"I study Arabic\"?","a":"أَدْرُسُ العَرَبِيَّةَ","w":["أَقْرَأُ العَرَبِيَّةَ","يَدْرُسُ العَرَبِيَّةَ"]},{"q":"How do you say \"I read a book\"?","a":"أَقْرَأُ كِتَابًا","w":["أَقْرَأُ كِتَابٌ","آكُلُ كِتَابًا"]},{"q":"How do you say \"he goes\"?","a":"يَذْهَبُ","w":["أَذْهَبُ","تَذْهَبِينَ"]},{"q":"How do you say \"you go\" (to a woman)?","a":"تَذْهَبِينَ","w":["تَذْهَبُ","أَذْهَبُ"]},{"q":"How do you say \"he drinks tea\"?","a":"هُوَ يَشْرَبُ الشَّايَ","w":["هُوَ أَشْرَبُ الشَّايَ","هِيَ تَشْرَبُ الشَّايَ"]},{"q":"How do you say \"she studies at the university\"?","a":"هِيَ تَدْرُسُ فِي الجَامِعَةِ","w":["هُوَ يَدْرُسُ فِي الجَامِعَةِ","أَنَا أَدْرُسُ فِي الجَامِعَةِ"]}],"conv":{"title":"مُحَادَثَةٌ: أُسْبُوعِي","lines":[{"w":"m","n":"عَلِيٌّ","ar":"صَبَاحُ الخَيْرِ."},{"w":"f","n":"نُورَةُ","ar":"صَبَاحُ النُّورِ. كَيْفَ حَالُكَ؟"},{"w":"m","n":"عَلِيٌّ","ar":"بِخَيْرٍ، الحَمْدُ لِلَّهِ. مَا هُوَ اليَوْمُ؟"},{"w":"f","n":"نُورَةُ","ar":"اليَوْمُ الخَمِيسُ، وَغَدًا الجُمُعَةُ."},{"w":"m","n":"عَلِيٌّ","ar":"مَاذَا تَفْعَلِينَ غَدًا؟"},{"w":"f","n":"نُورَةُ","ar":"أَذْهَبُ إِلَى السُّوقِ فِي الصَّبَاحِ. وَأَنْتَ؟"},{"w":"m","n":"عَلِيٌّ","ar":"أَعْمَلُ فِي المُسْتَشْفَى. أَنَا طَبِيبٌ."},{"w":"f","n":"نُورَةُ","ar":"مَا شَاءَ اللَّهُ! وَمَاذَا تَفْعَلُ فِي المَسَاءِ؟"},{"w":"m","n":"عَلِيٌّ","ar":"أَقْرَأُ كِتَابًا وَأَشْرَبُ القَهْوَةَ."},{"w":"f","n":"نُورَةُ","ar":"وَأَنَا أَدْرُسُ العَرَبِيَّةَ فِي المَسَاءِ."},{"w":"m","n":"عَلِيٌّ","ar":"وَمَتَى تَنَامِينَ؟"},{"w":"f","n":"نُورَةُ","ar":"أَنَامُ فِي اللَّيْلِ."},{"w":"m","n":"عَلِيٌّ","ar":"شُكْرًا. مَعَ السَّلَامَةِ."},{"w":"f","n":"نُورَةُ","ar":"عَفْوًا. مَعَ السَّلَامَةِ."}],"qs":[{"q":"What day is it today?","a":"الخَمِيسُ","w":["الجُمُعَةُ","السَّبْتُ"]},{"q":"What day is tomorrow?","a":"الجُمُعَةُ","w":["الخَمِيسُ","الأَحَدُ"]},{"q":"Where does Noura go tomorrow?","a":"إِلَى السُّوقِ","w":["إِلَى المَدْرَسَةِ","إِلَى المَطَارِ"]},{"q":"When does Noura go to the market?","a":"فِي الصَّبَاحِ","w":["فِي المَسَاءِ","فِي اللَّيْلِ"]},{"q":"Where does Ali work?","a":"فِي المُسْتَشْفَى","w":["فِي المَدْرَسَةِ","فِي الجَامِعَةِ"]},{"q":"What is Ali's job?","a":"طَبِيبٌ","w":["مُهَنْدِسٌ","مُدَرِّسٌ"]},{"q":"What does Ali do in the evening?","a":"أَقْرَأُ كِتَابًا وَأَشْرَبُ القَهْوَةَ","w":["أَدْرُسُ العَرَبِيَّةَ","أَذْهَبُ إِلَى السُّوقِ"]},{"q":"What does Noura study in the evening?","a":"العَرَبِيَّةَ","w":["الكِتَابَ","القَهْوَةَ"]},{"q":"When does Noura sleep?","a":"فِي اللَّيْلِ","w":["فِي الصَّبَاحِ","فِي الظُّهْرِ"]},{"q":"How does Noura answer \"good morning\"?","a":"صَبَاحُ النُّورِ","w":["مَسَاءُ الخَيْرِ","مَعَ السَّلَامَةِ"]}]},"id":"1-1-10"},{"stage":1,"level":1,"order":3,"titleAr":"الدِّرَاسَةُ: الأَشْيَاءُ فِي الفَصْلِ","titleEn":"Studies: Things in the Classroom","about":"Learn the language of studying. You will learn the things in the classroom, school subjects, \"this\" and \"that\", the question \"What is this?\", \"my\" and \"your\", and how to say where something is.","rules":[{"title":"This and that (هَذَا وَذَلِكَ)","body":"Arabic has two words for \"this\" and two words for \"that\", because every noun is either masculine or feminine. Use the masculine word for a masculine thing and the feminine word for a feminine thing.\n- هَذَا means \"this\" (masculine, near you).\n- هَذِهِ means \"this\" (feminine, near you).\n- ذَلِكَ means \"that\" (masculine, far from you).\n- تِلْكَ means \"that\" (feminine, far from you).\nPut the pointing word first and then the thing. هَذَا كِتَابٌ means \"this is a book\". There is no word for \"is\".","ex":[{"ar":"هَذَا كِتَابٌ","tr":"hādhā kitābun","en":"this is a book","note":"Book is masculine, so we point at it with هَذَا."},{"ar":"هَذِهِ حَقِيبَةٌ","tr":"hādhihi ḥaqībatun","en":"this is a bag","note":"Bag is feminine, so we point at it with هَذِهِ."},{"ar":"ذَلِكَ بَابٌ","tr":"dhālika bābun","en":"that is a door","note":"ذَلِكَ points at something far from you. Door is masculine."},{"ar":"تِلْكَ نَافِذَةٌ","tr":"tilka nāfidhatun","en":"that is a window","note":"تِلْكَ is the far word for feminine things. Window is feminine."}]},{"title":"Masculine things in the classroom (الأَشْيَاءُ المُذَكَّرَةُ)","body":"Most masculine words have no special ending. Point at them with هَذَا or ذَلِكَ. Learn each plural together with its singular, because the whole shape of the word often changes.","ex":[{"ar":"هَذَا قَلَمٌ","tr":"hādhā qalamun","en":"this is a pen","note":"The plural of قَلَمٌ is أَقْلَامٌ, which means pens."},{"ar":"هَذَا دَفْتَرٌ","tr":"hādhā daftarun","en":"this is a notebook","note":"The plural of دَفْتَرٌ is دَفَاتِرُ, which means notebooks."},{"ar":"هَذَا مَكْتَبٌ","tr":"hādhā maktabun","en":"this is a desk","note":"The plural is مَكَاتِبُ. مَكْتَبٌ can also mean \"an office\". It comes from the root ك ت ب, the place of writing."},{"ar":"هَذَا كُرْسِيٌّ","tr":"hādhā kursiyyun","en":"this is a chair","note":"The plural of كُرْسِيٌّ is كَرَاسِيُّ, which means chairs."},{"ar":"ذَلِكَ مِفْتَاحٌ","tr":"dhālika miftāḥun","en":"that is a key","note":"The plural of مِفْتَاحٌ is مَفَاتِيحُ, which means keys."},{"ar":"هَذَا فَصْلٌ","tr":"hādhā faṣlun","en":"this is a classroom","note":"فَصْلٌ means a class or a classroom. Its plural is فُصُولٌ."}]},{"title":"Feminine things in the classroom (الأَشْيَاءُ المُؤَنَّثَةُ)","body":"Most feminine words end with ـةٌ. For these words, use هَذِهِ and تِلْكَ. A few feminine words do not end with ـةٌ, and you will meet them later.","ex":[{"ar":"هَذِهِ سَبُّورَةٌ","tr":"hādhihi sabbūratun","en":"this is a board","note":"سَبُّورَةٌ is the board the teacher writes on. Its plural is سَبُّورَاتٌ."},{"ar":"تِلْكَ حَقِيبَةٌ","tr":"tilka ḥaqībatun","en":"that is a bag","note":"The plural of حَقِيبَةٌ is حَقَائِبُ, which means bags."},{"ar":"تِلْكَ طَاوِلَةٌ","tr":"tilka ṭāwilatun","en":"that is a table","note":"The plural of طَاوِلَةٌ is طَاوِلَاتٌ, which means tables."},{"ar":"هَذِهِ سَاعَةٌ","tr":"hādhihi sāʿatun","en":"this is a clock","note":"سَاعَةٌ means a clock, a watch or an hour. Its plural is سَاعَاتٌ."},{"ar":"هَذِهِ مَدْرَسَةٌ","tr":"hādhihi madrasatun","en":"this is a school","note":"You met مَدْرَسَةٌ in the root lesson of the introduction. Its plural is مَدَارِسُ."},{"ar":"تِلْكَ مَكْتَبَةٌ","tr":"tilka maktabatun","en":"that is a library","note":"Library is also feminine, so we point at it with تِلْكَ."}]},{"title":"What is this? (مَا هَذَا؟)","body":"Use مَا to ask about a thing, and match the pointing word to the thing: مَا هَذَا؟ for masculine and مَا هَذِهِ؟ for feminine. The answer uses the same pointing word again and then the name of the thing.","ex":[{"ar":"مَا هَذَا؟","tr":"mā hādhā","en":"what is this? (a masculine thing)","note":"Ask it when you point at something masculine, such as a pen."},{"ar":"هَذَا قَلَمٌ","tr":"hādhā qalamun","en":"this is a pen","re":true,"note":"Answer with the same pointing word, then the thing."},{"ar":"مَا هَذِهِ؟","tr":"mā hādhihi","en":"what is this? (a feminine thing)","note":"Ask it when you point at something feminine, such as a clock."},{"ar":"هَذِهِ سَاعَةٌ","tr":"hādhihi sāʿatun","en":"this is a clock","re":true,"note":"The answer stays feminine."},{"ar":"مَا ذَلِكَ؟","tr":"mā dhālika","en":"what is that? (a masculine thing)","note":"Use ذَلِكَ when the thing is far away."},{"ar":"ذَلِكَ بَابٌ","tr":"dhālika bābun","en":"that is a door","re":true,"note":"The answer uses ذَلِكَ again."},{"ar":"مَا تِلْكَ؟","tr":"mā tilka","en":"what is that? (a feminine thing)","note":"Use تِلْكَ for a far feminine thing."},{"ar":"تِلْكَ نَافِذَةٌ","tr":"tilka nāfidhatun","en":"that is a window","re":true,"note":"The answer uses تِلْكَ again."}]},{"title":"Yes or no? (هَلْ؟)","body":"Put هَلْ at the start to ask a yes-or-no question about something. Answer with نَعَمْ for yes or لَا for no, and then say the full sentence. When the answer is no, you can say what the thing really is.","ex":[{"ar":"هَلْ هَذَا قَلَمٌ؟","tr":"hal hādhā qalamun","en":"is this a pen?","note":"هَلْ turns the sentence هَذَا قَلَمٌ into a question."},{"ar":"نَعَمْ، هَذَا قَلَمٌ","tr":"naʿam, hādhā qalamun","en":"yes, this is a pen","re":true,"note":"Say yes, then repeat the sentence."},{"ar":"هَلْ هَذِهِ سَاعَةٌ؟","tr":"hal hādhihi sāʿatun","en":"is this a clock?","note":"Here we point at a feminine thing, so we use هَذِهِ."},{"ar":"لَا، هَذِهِ سَبُّورَةٌ","tr":"lā, hādhihi sabbūratun","en":"no, this is a board","re":true,"note":"Say no, then say what the thing really is."},{"ar":"هَلْ ذَلِكَ بَابٌ؟","tr":"hal dhālika bābun","en":"is that a door?","note":"ذَلِكَ points at something far away."},{"ar":"نَعَمْ، ذَلِكَ بَابٌ","tr":"naʿam, dhālika bābun","en":"yes, that is a door","re":true,"note":"A short, clear answer."}]},{"title":"My and your (كِتَابِي وَكِتَابُكَ)","body":"You already met these endings in \"what is your name?\". Add them to the end of a noun. ـِي means \"my\". ـُكَ means \"your\" to a man, and ـُكِ means \"your\" to a woman. When a word ends with ـةٌ, the ة becomes ت before the ending: حَقِيبَةٌ becomes حَقِيبَتِي.","ex":[{"ar":"هَذَا كِتَابِي","tr":"hādhā kitābī","en":"this is my book","note":"كِتَابٌ plus ـِي gives كِتَابِي."},{"ar":"هَذَا كِتَابُكَ","tr":"hādhā kitābuka","en":"this is your book (to a man)","note":"The ending ـُكَ has a فَتْحَةٌ on the ك, for a man."},{"ar":"هَذَا كِتَابُكِ","tr":"hādhā kitābuki","en":"this is your book (to a woman)","note":"The same word with a كَسْرَةٌ on the ك, for a woman."},{"ar":"هَذِهِ حَقِيبَتِي","tr":"hādhihi ḥaqībatī","en":"this is my bag","note":"The ة of حَقِيبَةٌ becomes ت before the ending."},{"ar":"هَلْ هَذَا قَلَمُكَ؟","tr":"hal hādhā qalamuka","en":"is this your pen? (to a man)","note":"You are asking a man, so the ending is ـُكَ."},{"ar":"نَعَمْ، هَذَا قَلَمِي","tr":"naʿam, hādhā qalamī","en":"yes, this is my pen","re":true,"note":"When you answer, \"your\" becomes \"my\"."},{"ar":"هَلْ هَذِهِ حَقِيبَتُكِ؟","tr":"hal hādhihi ḥaqībatuki","en":"is this your bag? (to a woman)","note":"You are asking a woman, so the ending is ـُكِ."},{"ar":"نَعَمْ، هَذِهِ حَقِيبَتِي","tr":"naʿam, hādhihi ḥaqībatī","en":"yes, this is my bag","re":true,"note":"Again \"your\" becomes \"my\" in the answer."}]},{"title":"Where is it? (أَيْنَ؟)","body":"Use أَيْنَ and then the thing to ask where it is. To answer, use فِي (in) or عَلَى (on). Two things are new here. First, we say \"the book\" with اَلْ, so كِتَابٌ becomes الكِتَابُ. Second, the word after فِي or عَلَى takes a كَسْرَةٌ at the end: المَكْتَبُ becomes المَكْتَبِ.","ex":[{"ar":"أَيْنَ الكِتَابُ؟","tr":"ayna l-kitābu","en":"where is the book?","note":"أَيْنَ asks about a place."},{"ar":"الكِتَابُ عَلَى المَكْتَبِ","tr":"al-kitābu ʿalā l-maktabi","en":"the book is on the desk","re":true,"note":"عَلَى means \"on\", and المَكْتَبِ ends with a كَسْرَةٌ after it."},{"ar":"أَيْنَ القَلَمُ؟","tr":"ayna l-qalamu","en":"where is the pen?","note":"Ask it when you cannot find your pen."},{"ar":"القَلَمُ فِي الحَقِيبَةِ","tr":"al-qalamu fī l-ḥaqībati","en":"the pen is in the bag","re":true,"note":"فِي means \"in\", and الحَقِيبَةِ ends with a كَسْرَةٌ after it."},{"ar":"أَيْنَ المُعَلِّمُ؟","tr":"ayna l-muʿallimu","en":"where is the teacher?","note":"You can ask about people in the same way."},{"ar":"المُعَلِّمُ فِي الفَصْلِ","tr":"al-muʿallimu fī l-faṣli","en":"the teacher is in the classroom","re":true,"note":"الفَصْلِ is \"the classroom\", with a كَسْرَةٌ after فِي."},{"ar":"أَيْنَ الطَّالِبَةُ؟","tr":"ayna ṭ-ṭālibatu","en":"where is the female student?","note":"Before ط the ل of اَلْ is not pronounced, and the ط is doubled. The doubling is shown by a ـّ sign called شَدَّةٌ. The same happens before ت ث د ذ ر ز س ش ص ض ط ظ ل ن."},{"ar":"الطَّالِبَةُ فِي المَكْتَبَةِ","tr":"aṭ-ṭālibatu fī l-maktabati","en":"the student is in the library","re":true,"note":"المَكْتَبَةِ is \"the library\", with a كَسْرَةٌ after فِي."}]},{"title":"School subjects (المَوَادُّ الدِّرَاسِيَّةُ)","body":"دِرَاسَةٌ means \"study\". مَادَّةٌ means \"a school subject\", and its plural is مَوَادُّ. To say \"the book of Arabic\", put two nouns together. The first noun has no tanween and no ال. The second noun has ال and ends with ـِ.","ex":[{"ar":"هَذَا كِتَابُ العَرَبِيَّةِ","tr":"hādhā kitābu l-ʿarabiyyati","en":"this is the Arabic book","note":"كِتَابٌ loses its tanween, and العَرَبِيَّةُ becomes العَرَبِيَّةِ."},{"ar":"هَذَا دَفْتَرُ الرِّيَاضِيَّاتِ","tr":"hādhā daftaru r-riyāḍiyyāti","en":"this is the mathematics notebook","note":"الرِّيَاضِيَّاتُ means \"mathematics\"."},{"ar":"مَا هَذَا؟","tr":"mā hādhā","en":"what is this?","note":"You learned this question earlier in the unit."},{"ar":"هَذَا كِتَابُ التَّارِيخِ","tr":"hādhā kitābu t-tārīkhi","en":"this is the history book","re":true,"note":"التَّارِيخُ means \"history\"."},{"ar":"هَذِهِ مَادَّةٌ","tr":"hādhihi māddatun","en":"this is a subject","note":"مَادَّةٌ is feminine, so we use هَذِهِ."},{"ar":"كِتَابُ العُلُومِ","tr":"kitābu l-ʿulūmi","en":"the science book","note":"العُلُومُ means \"the sciences\". It is the plural of عِلْمٌ."},{"ar":"كِتَابُ الإِنْجِلِيزِيَّةِ","tr":"kitābu l-injlīziyyati","en":"the English book","note":"الإِنْجِلِيزِيَّةُ means \"English\"."},{"ar":"هَذَا هُوَ المُعَلِّمُ","tr":"hādhā huwa l-muʿallimu","en":"this is the teacher (a man)","note":"With ال after هَذَا, add هُوَ to make the sentence \"this is the teacher\"."},{"ar":"هَذِهِ هِيَ المُعَلِّمَةُ","tr":"hādhihi hiya l-muʿallimatu","en":"this is the teacher (a woman)","note":"Add ـَةٌ for a woman, and use هِيَ."}]}],"words":[{"ar":"قَلَمٌ","pl":"أَقْلَامٌ","en":"pen","type":"noun"},{"ar":"دَفْتَرٌ","pl":"دَفَاتِرُ","en":"notebook","type":"noun"},{"ar":"مَكْتَبٌ","pl":"مَكَاتِبُ","en":"desk, office","type":"noun"},{"ar":"كُرْسِيٌّ","pl":"كَرَاسِيُّ","en":"chair","type":"noun"},{"ar":"بَابٌ","pl":"أَبْوَابٌ","en":"door","type":"noun"},{"ar":"مِفْتَاحٌ","pl":"مَفَاتِيحُ","en":"key","type":"noun"},{"ar":"فَصْلٌ","pl":"فُصُولٌ","en":"classroom, class","type":"noun"},{"ar":"سَبُّورَةٌ","pl":"سَبُّورَاتٌ","en":"board","type":"noun"},{"ar":"حَقِيبَةٌ","pl":"حَقَائِبُ","en":"bag","type":"noun"},{"ar":"نَافِذَةٌ","pl":"نَوَافِذُ","en":"window","type":"noun"},{"ar":"سَاعَةٌ","pl":"سَاعَاتٌ","en":"clock, watch, hour","type":"noun"},{"ar":"طَاوِلَةٌ","pl":"طَاوِلَاتٌ","en":"table","type":"noun"},{"ar":"مَدْرَسَةٌ","pl":"مَدَارِسُ","en":"school","type":"noun"},{"ar":"ذَلِكَ","pl":"","en":"that (masculine)","type":"pronoun"},{"ar":"تِلْكَ","pl":"","en":"that (feminine)","type":"pronoun"},{"ar":"دِرَاسَةٌ","pl":"دِرَاسَاتٌ","en":"study","type":"noun"},{"ar":"مَادَّةٌ","pl":"مَوَادُّ","en":"school subject","type":"noun"},{"ar":"العَرَبِيَّةُ","pl":"","en":"Arabic (language)","type":"noun"},{"ar":"الإِنْجِلِيزِيَّةُ","pl":"","en":"English (language)","type":"noun"},{"ar":"الرِّيَاضِيَّاتُ","pl":"","en":"mathematics","type":"noun"},{"ar":"العُلُومُ","pl":"","en":"the sciences","type":"noun"},{"ar":"التَّارِيخُ","pl":"","en":"history","type":"noun"},{"ar":"مُعَلِّمَةٌ","pl":"مُعَلِّمَاتٌ","en":"teacher (f)","type":"noun"}],"qs":[{"q":"Which word means \"this\" for a masculine thing?","a":"هَذَا","w":["هَذِهِ","ذَلِكَ"]} function allUnits(){var m={};SEED.concat(S.units).forEach(function(u){m[u.id]=u});return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return posOf(x)-posOf(y)})}
function isSeed(id){return SEED.some(function(u){return u.id===id})}
function inStore(id){return S.units.some(function(u){return u.id===id})}
function getUnit(id){return allUnits().filter(function(u){return u.id===id})[0]||testUnit(id)}
var REVIEW=true;
function stageGate(s){return REVIEW||s<=1||!!S.prog.done['st-'+(s-1)]}
function curUnit(){return allUnits().filter(function(x){return !S.prog.done[x.id]&&stageGate(x.stage)})[0]||null}
function levelOpen(stage,level){if(S.teacher||REVIEW)return true;if(!stageGate(stage))return false;var c=curUnit();return !c||(c.stage===stage&&c.level===level)}
function stageUnits(s){return allUnits().filter(function(u){return u.stage===s})}
function stageDoneN(s){return stageUnits(s).filter(function(u){return !!S.prog.done[u.id]}).length}
function stageComplete(s){return REVIEW||stageDoneN(s)>=LV_N*UN_N}
function stageReal(s){return stageDoneN(s)>=LV_N*UN_N}
function pendingStage(){for(var s=1;s<STAGES.length;s++)if(stageReal(s)&&!S.prog.done['st-'+s])return s;return 0}
function testUnit(id){
  var m=String(id).match(/^(lt|st)-(\d+)(?:-(\d+))?$/);if(!m)return null;
  var stage=+m[2],level=m[3]?+m[3]:0,us=allUnits().filter(function(u){return u.stage===stage&&(!level||u.level===level)});
  var qs=[],ex=[],words=[];us.forEach(function(u){qs=qs.concat(u.qs);u.rules.forEach(function(r){ex=ex.concat(r.ex)});words=words.concat(u.words)});
  return {id:id,synthetic:true,kind:level?'level':'stage',stage:stage,level:level,order:0,testN:level?30:60,titleAr:'',titleEn:level?'Stage '+stage+' · Level '+level+' test':'Stage '+stage+' test',about:'',rules:[{title:'',body:'',ex:ex}],words:words,qs:qs};
}
function unlocked(u){if(S.teacher||REVIEW)return true;if(!levelOpen(u.stage,u.level))return false;var a=allUnits(),i=a.indexOf(u);return i<=0||!!S.prog.done[a[i-1].id]}

/* ---------- quiz builder ---------- */
function buildQuiz(u,Nov){
  var items=[],seen=S.seenQ[u.id]||[],N=Nov||u.testN||10;
  var all0=shuffle(u.qs),fresh=all0.filter(function(q){return seen.indexOf(q.q)<0}),old=all0.filter(function(q){return seen.indexOf(q.q)>=0}),pick=fresh.concat(old).slice(0,N);
  var reuse=pick.some(function(q){return seen.indexOf(q.q)>=0}),used=pick.map(function(q){return q.q});
  shuffle(pick).forEach(function(q){items.push({q:q.q,big:'',a:q.a,o:shuffle([q.a].concat(shuffle(q.w).slice(0,3)))})});
  var pairs=[],dup={};
  u.rules.forEach(function(r){r.ex.forEach(function(e){pairs.push({ar:e.ar,en:e.en})})});
  u.words.forEach(function(x){pairs.push({ar:x.ar,en:x.en})});
  pairs=pairs.filter(function(p){if(dup[p.ar])return false;dup[p.ar]=1;return !!p.en});
  var pool=pairs.slice();
  allUnits().forEach(function(o){if(o!==u&&posOf(o)<posOf(u))o.words.forEach(function(x){pool.push({ar:x.ar,en:x.en})})});
  var sp=shuffle(pairs);sp=sp.filter(function(p){return seen.indexOf('Which word means “'+p.en+'”?')<0}).concat(sp.filter(function(p){return seen.indexOf('Which word means “'+p.en+'”?')>=0}));
  sp.forEach(function(p){
    if(items.length>=N)return;
    var d=shuffle(pool.filter(function(x){return x.en!==p.en&&x.ar!==p.ar}));
    var wa=uniq(d.map(function(x){return x.ar})).slice(0,3);if(!wa.length)return;
    items.push({q:'Which word means “'+p.en+'”?',big:'',a:p.ar,o:shuffle([p.ar].concat(wa))});used.push('Which word means “'+p.en+'”?');
  });
  S.seenQ[u.id]=reuse?used:seen.concat(used);
  return items;
}
